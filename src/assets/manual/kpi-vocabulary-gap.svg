<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 324" aria-hidden="true">
<text x="12" y="18" font-size="13" fill="hsl(var(--foreground))">Read the evidence in this order</text>
<rect x="8" y="32" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="47" font-size="12" fill="hsl(var(--foreground))">1 · Run status and identity</text>
<text x="18" y="62" font-size="11" fill="hsl(var(--foreground))">Done? Expected replications?</text>
<text x="18" y="77" font-size="11" fill="hsl(var(--foreground))">Which versions and measurement window?</text>
<path d="M160 84v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="101" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="116" font-size="12" fill="hsl(var(--foreground))">2 · Conversion notes</text>
<text x="18" y="131" font-size="11" fill="hsl(var(--foreground))">Defaults, substitutions and clamping</text>
<text x="18" y="146" font-size="11" fill="hsl(var(--foreground))">Do these alter the question?</text>
<path d="M160 153v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="170" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="185" font-size="12" fill="hsl(var(--foreground))">3 · KPIs and uncertainty</text>
<text x="18" y="200" font-size="11" fill="hsl(var(--foreground))">Engine-returned keys drive the table</text>
<text x="18" y="215" font-size="11" fill="hsl(var(--foreground))">Unavailable is not zero.</text>
<path d="M160 222v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="239" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="254" font-size="12" fill="hsl(var(--foreground))">4 · Weekly traces and comparison</text>
<text x="18" y="269" font-size="11" fill="hsl(var(--foreground))">When did service fall and recover?</text>
<text x="18" y="284" font-size="11" fill="hsl(var(--foreground))">What changed against the baseline?</text>
</svg>
