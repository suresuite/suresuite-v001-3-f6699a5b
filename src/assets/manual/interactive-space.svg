<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 255" aria-hidden="true">
<text x="12" y="18" font-size="13" fill="hsl(var(--foreground))">Explore without confusing views</text>
<rect x="8" y="32" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="47" font-size="12" fill="hsl(var(--foreground))">Select a project and network level</text>
<text x="18" y="62" font-size="11" fill="hsl(var(--foreground))">Product dependencies, BOM depth or firms</text>
<text x="18" y="77" font-size="11" fill="hsl(var(--foreground))">Each level reads different relationships.</text>
<path d="M160 84v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="101" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="116" font-size="12" fill="hsl(var(--foreground))">Focus a node</text>
<text x="18" y="131" font-size="11" fill="hsl(var(--foreground))">Inspect its connected path and details</text>
<text x="18" y="146" font-size="11" fill="hsl(var(--foreground))">Filters can hide otherwise valid edges.</text>
<path d="M160 153v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="170" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="185" font-size="12" fill="hsl(var(--foreground))">Restore the full view</text>
<text x="18" y="200" font-size="11" fill="hsl(var(--foreground))">Check inputs and coverage before conclusions</text>
<text x="18" y="215" font-size="11" fill="hsl(var(--foreground))">Visual connectivity is not evidence quality.</text>
</svg>
