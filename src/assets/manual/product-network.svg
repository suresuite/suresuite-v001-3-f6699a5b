<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 372" aria-hidden="true" focusable="false" font-family="inherit">
  <!-- A REPRESENTATION of the product-level view, not a capture of a project.
       The four groups and the rule that a group is worked out from which file
       an arc came from are the page's own. Drawn with two faults in it,
       because finding those is what the page says this screen is for. -->

  <text x="4" y="12" font-size="12" fill="hsl(var(--muted-foreground))">supplier</text>
  <text x="84" y="12" font-size="12" fill="hsl(var(--muted-foreground))">material</text>
  <text x="168" y="12" font-size="12" fill="hsl(var(--muted-foreground))">product</text>
  <text x="252" y="12" font-size="12" fill="hsl(var(--muted-foreground))">customer</text>
  <line x1="4" y1="18" x2="316" y2="18" stroke="hsl(var(--border))" stroke-width="1"/>

  <!-- arcs -->
  <g stroke="hsl(var(--muted-foreground))" stroke-width="1.3" fill="none">
    <path d="M38 48 L98 48"/>
    <path d="M38 48 L98 96"/>
    <path d="M38 104 L98 96"/>
    <path d="M124 48 L182 72"/>
    <path d="M124 96 L182 72"/>
    <path d="M124 96 L182 128"/>
    <path d="M208 72 L266 56"/>
    <path d="M208 128 L266 112"/>
  </g>

  <!-- suppliers -->
  <g fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.3">
    <circle cx="26" cy="48" r="12"/>
    <circle cx="26" cy="104" r="12"/>
  </g>
  <g fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.3">
    <circle cx="110" cy="48" r="12"/>
    <circle cx="110" cy="96" r="12"/>
  </g>
  <!-- the orphan: a material nothing supplies -->
  <circle cx="110" cy="160" r="12" fill="hsl(var(--card))" stroke="hsl(var(--destructive))" stroke-width="1.6" stroke-dasharray="3 2"/>

  <g fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.3">
    <circle cx="195" cy="72" r="12"/>
    <circle cx="195" cy="128" r="12"/>
  </g>
  <g fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.3">
    <circle cx="278" cy="56" r="12"/>
    <circle cx="278" cy="112" r="12"/>
  </g>
  <!-- the stranded customer -->
  <circle cx="278" cy="168" r="12" fill="hsl(var(--card))" stroke="hsl(var(--destructive))" stroke-width="1.6" stroke-dasharray="3 2"/>

  <!-- callouts -->
  <path d="M110 176 L110 196 L150 196" stroke="hsl(var(--destructive))" stroke-width="1.2" fill="none"/>
  <path d="M278 182 L278 208 L150 208" stroke="hsl(var(--destructive))" stroke-width="1.2" fill="none"/>

  <text x="4" y="232" font-size="12" fill="hsl(var(--foreground))">Two faults, both visible at a glance</text>
  <circle cx="10" cy="250" r="5" fill="hsl(var(--card))" stroke="hsl(var(--destructive))" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <text x="24" y="254" font-size="12" fill="hsl(var(--foreground))">A material with no supplier.</text>
  <text x="24" y="268" font-size="12" fill="hsl(var(--muted-foreground))">Something consumes it and no inbound row</text>
  <text x="24" y="280" font-size="12" fill="hsl(var(--muted-foreground))">says where it comes from.</text>

  <circle cx="10" cy="300" r="5" fill="hsl(var(--card))" stroke="hsl(var(--destructive))" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <text x="24" y="304" font-size="12" fill="hsl(var(--foreground))">A customer with nothing arriving.</text>
  <text x="24" y="318" font-size="12" fill="hsl(var(--muted-foreground))">They are in your customer file and in no</text>
  <text x="24" y="330" font-size="12" fill="hsl(var(--muted-foreground))">outbound row.</text>

  <text x="4" y="352" font-size="12" fill="hsl(var(--muted-foreground))">A node you cannot find is a row you have</text>
  <text x="4" y="364" font-size="12" fill="hsl(var(--muted-foreground))">not uploaded.</text>
</svg>
