<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 356" aria-hidden="true" focusable="false" font-family="inherit">
  <!-- A REPRESENTATION of the process-level view, not a capture of a project.
       Drawn deliberately unlike the firm-level picture: depth here is a stage
       of manufacture INSIDE one company, and there it is a company's distance
       from you. Confusing the two is what the page exists to prevent. -->

  <text x="4" y="14" font-size="12" fill="hsl(var(--foreground))">Your bill of materials, depth intact.</text>

  <!-- level rails -->
  <g stroke="hsl(var(--border))" stroke-width="1" stroke-dasharray="3 3">
    <line x1="72" y1="46" x2="316" y2="46"/>
    <line x1="72" y1="100" x2="316" y2="100"/>
    <line x1="72" y1="154" x2="316" y2="154"/>
    <line x1="72" y1="208" x2="316" y2="208"/>
  </g>
  <text x="4" y="50" font-size="12" fill="hsl(var(--muted-foreground))">level 0</text>
  <text x="4" y="104" font-size="12" fill="hsl(var(--muted-foreground))">level 1</text>
  <text x="4" y="158" font-size="12" fill="hsl(var(--muted-foreground))">level 2</text>
  <text x="4" y="212" font-size="12" fill="hsl(var(--muted-foreground))">level 3</text>

  <!-- edges -->
  <g stroke="hsl(var(--muted-foreground))" stroke-width="1.3" fill="none">
    <path d="M194 58 L140 88"/>
    <path d="M194 58 L250 88"/>
    <path d="M140 112 L106 142"/>
    <path d="M140 112 L180 142"/>
    <path d="M250 112 L250 142"/>
    <path d="M106 166 L106 196"/>
  </g>

  <!-- nodes -->
  <rect x="158" y="34" width="72" height="24" rx="3" fill="hsl(var(--foreground))"/>
  <text x="194" y="50" text-anchor="middle" font-size="12" fill="hsl(var(--card))">product</text>

  <rect x="104" y="88" width="72" height="24" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.3"/>
  <text x="140" y="104" text-anchor="middle" font-size="12" fill="hsl(var(--foreground))">sub-asm</text>
  <rect x="214" y="88" width="72" height="24" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.3"/>
  <text x="250" y="104" text-anchor="middle" font-size="12" fill="hsl(var(--foreground))">sub-asm</text>

  <rect x="70" y="142" width="72" height="24" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.3"/>
  <text x="106" y="158" text-anchor="middle" font-size="12" fill="hsl(var(--foreground))">sub-asm</text>
  <rect x="144" y="142" width="72" height="24" rx="3" fill="hsl(var(--muted))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="180" y="158" text-anchor="middle" font-size="12" fill="hsl(var(--muted-foreground))">material</text>
  <rect x="214" y="142" width="72" height="24" rx="3" fill="hsl(var(--muted))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="250" y="158" text-anchor="middle" font-size="12" fill="hsl(var(--muted-foreground))">material</text>

  <rect x="70" y="196" width="72" height="24" rx="3" fill="hsl(var(--muted))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="106" y="212" text-anchor="middle" font-size="12" fill="hsl(var(--muted-foreground))">material</text>

  <!-- a sub-assembly feeding a sub-assembly -->
  <path d="M96 100 L60 100 L60 154 L66 154" stroke="hsl(var(--foreground))" stroke-width="1.4" fill="none"/>
  <text x="4" y="126" font-size="12" fill="hsl(var(--foreground))">one feeds</text>
  <text x="4" y="138" font-size="12" fill="hsl(var(--foreground))">another</text>

  <!-- ══ the distinction ══════════════════════════════════════════════ -->
  <line x1="4" y1="234" x2="316" y2="234" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="4" y="252" font-size="12" fill="hsl(var(--foreground))">Two things here are called levels</text>

  <text x="4" y="272" font-size="12" fill="hsl(var(--foreground))">This page — a stage of manufacture.</text>
  <text x="4" y="284" font-size="12" fill="hsl(var(--muted-foreground))">Level 3 is a part that goes into a part that</text>
  <text x="4" y="296" font-size="12" fill="hsl(var(--muted-foreground))">goes into a part. It can all be one factory.</text>

  <text x="4" y="318" font-size="12" fill="hsl(var(--foreground))">The firm graph — distance between</text>
  <text x="4" y="330" font-size="12" fill="hsl(var(--foreground))">companies.</text>
  <text x="4" y="342" font-size="12" fill="hsl(var(--muted-foreground))">Tier 3 is a company three purchases away.</text>
  <text x="4" y="354" font-size="12" fill="hsl(var(--muted-foreground))">The two numbers are unrelated.</text>
</svg>
