<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 386" aria-hidden="true" focusable="false" font-family="inherit">
  <!-- The three checks a write meets, in the page's own words. The widths are
       the information: the row rules are what refuses people, the capability
       catalog governs what the application offers, and min_project_role is
       declared on every described table and read by ONE live path. -->

  <rect x="88" y="4" width="144" height="26" rx="3" fill="hsl(var(--foreground))"/>
  <text x="160" y="21" text-anchor="middle" font-size="12" fill="hsl(var(--card))">a write to your data</text>
  <line x1="160" y1="30" x2="160" y2="42" stroke="hsl(var(--foreground))" stroke-width="1.4"/>
  <polygon points="160,46 156.5,39 163.5,39" fill="hsl(var(--foreground))"/>

  <!-- ══ gate 1 ═══════════════════════════════════════════════════════ -->
  <rect x="4" y="48" width="312" height="48" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.6"/>
  <text x="12" y="66" font-size="12" fill="hsl(var(--foreground))">Can you reach the project?</text>
  <text x="12" y="80" font-size="12" fill="hsl(var(--muted-foreground))">The database's own row rules. It asks about</text>
  <text x="12" y="92" font-size="12" fill="hsl(var(--muted-foreground))">reachability, not about your role.</text>
  <rect x="4" y="48" width="6" height="48" rx="1" fill="hsl(var(--foreground))"/>

  <line x1="160" y1="96" x2="160" y2="108" stroke="hsl(var(--foreground))" stroke-width="1.4"/>
  <polygon points="160,112 156.5,105 163.5,105" fill="hsl(var(--foreground))"/>

  <!-- ══ gate 2 ═══════════════════════════════════════════════════════ -->
  <rect x="4" y="114" width="312" height="48" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.6"/>
  <text x="12" y="132" font-size="12" fill="hsl(var(--foreground))">Do you hold the capability?</text>
  <text x="12" y="146" font-size="12" fill="hsl(var(--muted-foreground))">Resolved in layers from your role, your</text>
  <text x="12" y="158" font-size="12" fill="hsl(var(--muted-foreground))">organization and you. Governs what you see.</text>
  <rect x="4" y="114" width="6" height="48" rx="1" fill="hsl(var(--foreground))"/>

  <line x1="160" y1="162" x2="160" y2="174" stroke="hsl(var(--muted-foreground))" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="160,178 156.5,171 163.5,171" fill="hsl(var(--muted-foreground))"/>

  <!-- ══ gate 3 — narrow on purpose ═══════════════════════════════════ -->
  <rect x="4" y="180" width="312" height="48" rx="3" fill="hsl(var(--muted))" stroke="hsl(var(--border))" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="12" y="198" font-size="12" fill="hsl(var(--foreground))">Do you hold the minimum project role?</text>
  <text x="12" y="212" font-size="12" fill="hsl(var(--muted-foreground))">Declared on every described table. Read by</text>
  <text x="12" y="224" font-size="12" fill="hsl(var(--muted-foreground))">ONE live path — the promotion.</text>
  <rect x="4" y="180" width="6" height="48" rx="1" fill="hsl(var(--border))"/>

  <!-- ══ the disagreement ═════════════════════════════════════════════ -->
  <line x1="4" y1="246" x2="316" y2="246" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="4" y="264" font-size="12" fill="hsl(var(--foreground))">One person, two answers</text>

  <rect x="4" y="274" width="312" height="30" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="12" y="286" font-size="12" fill="hsl(var(--muted-foreground))">An editor on the project who is not that</text>
  <text x="12" y="298" font-size="12" fill="hsl(var(--muted-foreground))">project's modeler, promoting reviewed rows.</text>

  <!-- pass on gate 3 -->
  <circle cx="16" cy="326" r="6" fill="none" stroke="hsl(var(--foreground))" stroke-width="1.4"/>
  <path d="M13 326 L15.5 329 L19.5 322.5" fill="none" stroke="hsl(var(--foreground))" stroke-width="1.4"/>
  <text x="30" y="324" font-size="12" fill="hsl(var(--foreground))">passes the role check —</text>
  <text x="30" y="336" font-size="12" fill="hsl(var(--muted-foreground))">editor is above the minimum.</text>

  <!-- refused by gate 1 -->
  <circle cx="16" cy="362" r="6" fill="none" stroke="hsl(var(--destructive))" stroke-width="1.4"/>
  <path d="M13 359 L19 365 M19 359 L13 365" stroke="hsl(var(--destructive))" stroke-width="1.4"/>
  <text x="30" y="360" font-size="12" fill="hsl(var(--foreground))">and is then refused by the</text>
  <text x="30" y="372" font-size="12" fill="hsl(var(--foreground))">row rules on the very rows</text>
  <text x="30" y="384" font-size="12" fill="hsl(var(--foreground))">they were promoting.</text>
</svg>
