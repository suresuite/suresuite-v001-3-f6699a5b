<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 324" aria-hidden="true">
<text x="12" y="18" font-size="13" fill="hsl(var(--foreground))">Different roles, different questions</text>
<rect x="8" y="32" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="47" font-size="12" fill="hsl(var(--foreground))">Account and organization</text>
<text x="18" y="62" font-size="11" fill="hsl(var(--foreground))">Application access and organization context</text>
<text x="18" y="77" font-size="11" fill="hsl(var(--foreground))">These do not name one project role.</text>
<path d="M160 84v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="101" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="116" font-size="12" fill="hsl(var(--foreground))">Project role</text>
<text x="18" y="131" font-size="11" fill="hsl(var(--foreground))">Viewer · analyst · editor · owner</text>
<text x="18" y="146" font-size="11" fill="hsl(var(--foreground))">Check effective rights for this project.</text>
<path d="M160 153v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="170" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="185" font-size="12" fill="hsl(var(--foreground))">Request authorization</text>
<text x="18" y="200" font-size="11" fill="hsl(var(--foreground))">Browser RPC or API gateway → server</text>
<text x="18" y="215" font-size="11" fill="hsl(var(--foreground))">UI visibility alone is not enforcement.</text>
<path d="M160 222v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="239" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="254" font-size="12" fill="hsl(var(--foreground))">Known boundary gap</text>
<text x="18" y="269" font-size="11" fill="hsl(var(--foreground))">Browser simulation dispatch needs review</text>
<text x="18" y="284" font-size="11" fill="hsl(var(--foreground))">Do not infer complete server enforcement.</text>
</svg>
