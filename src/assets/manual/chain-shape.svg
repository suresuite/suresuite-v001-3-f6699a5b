<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" aria-hidden="true" focusable="false" font-family="inherit">
  <!-- The whole chain once, with the inbound arcs lit. The five stages are the
       ones the policy grid itself is organised by; the lit arcs are what one
       row of inbound_logistics is — a supplier_id, a material_id, and the
       volume and lead_time on the arc between them. -->

  <text x="4" y="12" font-size="12" fill="hsl(var(--muted-foreground))">Suppliers</text>
  <text x="72" y="12" font-size="12" fill="hsl(var(--muted-foreground))">Materials</text>
  <text x="140" y="12" font-size="12" fill="hsl(var(--muted-foreground))">Plant</text>
  <text x="192" y="12" font-size="12" fill="hsl(var(--muted-foreground))">Products</text>
  <text x="256" y="12" font-size="12" fill="hsl(var(--muted-foreground))">Customers</text>
  <line x1="4" y1="18" x2="316" y2="18" stroke="hsl(var(--border))" stroke-width="1"/>

  <!-- ══ the lit arcs: suppliers → materials ═════════════════════════ -->
  <g stroke="hsl(var(--foreground))" stroke-width="2" fill="none">
    <path d="M60 44 L72 44"/>
    <path d="M60 44 L72 92"/>
    <path d="M60 92 L72 92"/>
    <path d="M60 140 L72 140"/>
  </g>
  <g fill="hsl(var(--foreground))">
    <polygon points="72,44 65,40.5 65,47.5"/>
    <polygon points="72,92 65.5,87.5 64,94"/>
    <polygon points="72,140 65,136.5 65,143.5"/>
  </g>

  <!-- ══ the rest of the chain, quiet ════════════════════════════════ -->
  <g stroke="hsl(var(--border))" stroke-width="1.2" fill="none">
    <path d="M128 44 L140 80"/>
    <path d="M128 92 L140 92"/>
    <path d="M128 140 L140 104"/>
    <path d="M180 80 L192 56"/>
    <path d="M180 104 L192 116"/>
    <path d="M248 56 L260 56"/>
    <path d="M248 56 L260 116"/>
    <path d="M248 116 L260 116"/>
  </g>

  <!-- ══ suppliers ═══════════════════════════════════════════════════ -->
  <g fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.2">
    <rect x="4" y="32" width="56" height="24" rx="3"/>
    <rect x="4" y="80" width="56" height="24" rx="3"/>
    <rect x="4" y="128" width="56" height="24" rx="3"/>
  </g>
  <g font-size="12" fill="hsl(var(--foreground))" text-anchor="middle">
    <text x="32" y="48">SUP-1</text>
    <text x="32" y="96">SUP-2</text>
    <text x="32" y="144">SUP-3</text>
  </g>

  <!-- ══ materials ═══════════════════════════════════════════════════ -->
  <g fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.2">
    <rect x="72" y="32" width="56" height="24" rx="3"/>
    <rect x="72" y="80" width="56" height="24" rx="3"/>
    <rect x="72" y="128" width="56" height="24" rx="3"/>
  </g>
  <g font-size="12" fill="hsl(var(--foreground))" text-anchor="middle">
    <text x="100" y="48">MAT-1</text>
    <text x="100" y="96">MAT-2</text>
    <text x="100" y="144">MAT-3</text>
  </g>

  <!-- ══ plant ═══════════════════════════════════════════════════════ -->
  <rect x="140" y="68" width="40" height="48" rx="3" fill="hsl(var(--muted))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="160" y="96" text-anchor="middle" font-size="12" fill="hsl(var(--muted-foreground))">plant</text>

  <!-- ══ products ════════════════════════════════════════════════════ -->
  <g fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1">
    <rect x="192" y="44" width="56" height="24" rx="3"/>
    <rect x="192" y="104" width="56" height="24" rx="3"/>
  </g>
  <g font-size="12" fill="hsl(var(--muted-foreground))" text-anchor="middle">
    <text x="220" y="60">PRD-1</text>
    <text x="220" y="120">PRD-2</text>
  </g>

  <!-- ══ customers ═══════════════════════════════════════════════════ -->
  <g fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1">
    <rect x="260" y="44" width="56" height="24" rx="3"/>
    <rect x="260" y="104" width="56" height="24" rx="3"/>
  </g>
  <g font-size="12" fill="hsl(var(--muted-foreground))" text-anchor="middle">
    <text x="288" y="60">CUS-1</text>
    <text x="288" y="120">CUS-2</text>
  </g>

  <!-- ══ what one row is ═════════════════════════════════════════════ -->
  <line x1="4" y1="170" x2="316" y2="170" stroke="hsl(var(--border))" stroke-width="1"/>
  <path d="M8 190 L40 190" stroke="hsl(var(--foreground))" stroke-width="2" fill="none"/>
  <polygon points="40,190 33,186.5 33,193.5" fill="hsl(var(--foreground))"/>
  <text x="48" y="194" font-size="12" fill="hsl(var(--foreground))">One row of this file.</text>
  <text x="4" y="212" font-size="12" fill="hsl(var(--muted-foreground))">Four rows are drawn. SUP-1 supplies two</text>
  <text x="4" y="226" font-size="12" fill="hsl(var(--muted-foreground))">materials and MAT-2 has two sources — both</text>
  <text x="4" y="240" font-size="12" fill="hsl(var(--muted-foreground))">are ordinary, and both are just more rows.</text>
</svg>
