    <line x1="27.0" y1="48.0" x2="67.7" y2="66.1"/>
    <line x1="27.0" y1="48.0" x2="112.9" y2="54.8"/>
    <line x1="67.7" y1="66.1" x2="112.9" y2="54.8"/>
    <line x1="67.7" y1="66.1" x2="103.9" y2="118.1"/>
    <line x1="67.7" y1="66.1" x2="133.3" y2="72.9"/>
    <line x1="112.9" y1="54.8" x2="103.9" y2="118.1"/>
