<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 382" aria-hidden="true" focusable="false" font-family="inherit">
  <!-- One graph, four questions, four different answers. The graph is
       illustrative; the winners are computed from it by the standard
       definitions of the four measures the analysis catalog declares
       (degree_centrality, betweenness_centrality, eigenvector_centrality,
       closeness_centrality on network_nodes). Filled = highest. Ringed =
       second, so a close call reads as a close call. -->
  <text x="2" y="12" font-size="12" fill="hsl(var(--foreground))">One graph. Four questions.</text>
  <text x="2" y="26" font-size="12" fill="hsl(var(--muted-foreground))">Four different most-critical firms.</text>

  <!-- ── Degree ─────────────────────────────────── -->
  <text x="4" y="34" font-size="12" fill="hsl(var(--foreground))">Degree</text>
  <rect x="2" y="40" width="148" height="120" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <g stroke="hsl(var(--border))" stroke-width="1.1">
    <line x1="49.6" y1="90.9" x2="67.7" y2="131.6"/>
    <line x1="49.6" y1="90.9" x2="92.6" y2="95.5"/>
    <line x1="49.6" y1="90.9" x2="27.0" y2="48.0"/>
    <line x1="67.7" y1="131.6" x2="42.9" y2="152.0"/>
    <line x1="67.7" y1="131.6" x2="103.9" y2="118.1"/>
    <line x1="92.6" y1="95.5" x2="112.9" y2="54.8"/>
    <line x1="92.6" y1="95.5" x2="103.9" y2="118.1"/>
