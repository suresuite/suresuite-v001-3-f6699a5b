<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 255" aria-hidden="true">
<text x="12" y="18" font-size="13" fill="hsl(var(--foreground))">Resolve access for a particular task</text>
<rect x="8" y="32" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="47" font-size="12" fill="hsl(var(--foreground))">Select the project</text>
<text x="18" y="62" font-size="11" fill="hsl(var(--foreground))">Check effective role on your profile</text>
<text x="18" y="77" font-size="11" fill="hsl(var(--foreground))">Roles can differ across projects.</text>
<path d="M160 84v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="101" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="116" font-size="12" fill="hsl(var(--foreground))">Name the task</text>
<text x="18" y="131" font-size="11" fill="hsl(var(--foreground))">Edit inputs, edit policies, run or export</text>
<text x="18" y="146" font-size="11" fill="hsl(var(--foreground))">Project settings are a separate action.</text>
<path d="M160 153v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="170" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="185" font-size="12" fill="hsl(var(--foreground))">Inspect the boundary</text>
<text x="18" y="200" font-size="11" fill="hsl(var(--foreground))">Unavailable control or backend denial?</text>
<text x="18" y="215" font-size="11" fill="hsl(var(--foreground))">Record the exact error for the owner.</text>
</svg>
