<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 255" aria-hidden="true">
<text x="12" y="18" font-size="13" fill="hsl(var(--foreground))">Two fields, different resolution paths</text>
<rect x="8" y="32" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="47" font-size="12" fill="hsl(var(--foreground))">Material cost · M-BOARD</text>
<text x="18" y="62" font-size="11" fill="hsl(var(--foreground))">Saved override 25 replaces master 20</text>
<text x="18" y="77" font-size="11" fill="hsl(var(--foreground))">Removing it returns to the next source.</text>
<path d="M160 84v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="101" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="116" font-size="12" fill="hsl(var(--foreground))">MTS finished-goods target</text>
<text x="18" y="131" font-size="11" fill="hsl(var(--foreground))">Explicit S is used as the target</text>
<text x="18" y="146" font-size="11" fill="hsl(var(--foreground))">Missing S can trigger a derived target.</text>
<path d="M160 153v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="170" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="185" font-size="12" fill="hsl(var(--foreground))">Check before running</text>
<text x="18" y="200" font-size="11" fill="hsl(var(--foreground))">A draft cell is not a saved run input</text>
<text x="18" y="215" font-size="11" fill="hsl(var(--foreground))">Inspect the field chain and conversion notes.</text>
</svg>
