<text x="18" y="146" font-size="11" fill="hsl(var(--foreground))">Inspect parsed value and findings.</text>
<path d="M160 153v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="170" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="185" font-size="12" fill="hsl(var(--foreground))">Promote eligible rows</text>
<text x="18" y="200" font-size="11" fill="hsl(var(--foreground))">One matching line updated to 3</text>
<text x="18" y="215" font-size="11" fill="hsl(var(--foreground))">Omitted rows are not deletions.</text>
</svg>
