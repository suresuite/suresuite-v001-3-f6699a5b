<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 255" aria-hidden="true">
<text x="12" y="18" font-size="13" fill="hsl(var(--foreground))">Review a correction before accepting it</text>
<rect x="8" y="32" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="47" font-size="12" fill="hsl(var(--foreground))">CSV · P-CONTROL / M-CASE</text>
<text x="18" y="62" font-size="11" fill="hsl(var(--foreground))">Old consumption: 2 units/product</text>
<text x="18" y="77" font-size="11" fill="hsl(var(--foreground))">Corrected file: 3 units/product</text>
<path d="M160 84v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="101" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="116" font-size="12" fill="hsl(var(--foreground))">Staged review · changed row</text>
