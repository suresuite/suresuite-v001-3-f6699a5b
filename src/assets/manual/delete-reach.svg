<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" aria-hidden="true" focusable="false" font-family="inherit">
  <!-- The four ways a project-scoped table is reached when a project is
       deleted. Groups and members are PROJECT_DELETION in policy.generated.ts,
       derived by chains.mjs from the introspected foreign keys joined to
       delete-project's own by-name list. The small groups are NAMED rather than
       counted, so the figure cannot quietly disagree with the page beside it. -->

  <rect x="88" y="4" width="144" height="26" rx="3" fill="hsl(var(--foreground))"/>
  <text x="160" y="21" text-anchor="middle" font-size="12" fill="hsl(var(--card))">delete this project</text>

  <path d="M160 30 L160 44" stroke="hsl(var(--foreground))" stroke-width="1.4" fill="none"/>
  <polygon points="160,48 156.5,41 163.5,41" fill="hsl(var(--foreground))"/>

  <!-- ══ 1 · cascade ══════════════════════════════════════════════════ -->
  <rect x="4" y="52" width="312" height="52" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.4"/>
  <text x="12" y="70" font-size="12" fill="hsl(var(--foreground))">Gone, because the database says so</text>
  <text x="12" y="84" font-size="12" fill="hsl(var(--muted-foreground))">A foreign key with ON DELETE CASCADE. These</text>
  <text x="12" y="96" font-size="12" fill="hsl(var(--muted-foreground))">follow on every path, including a typed one.</text>

  <!-- ══ 2 · swept by name ════════════════════════════════════════════ -->
  <rect x="4" y="112" width="312" height="78" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="12" y="130" font-size="12" fill="hsl(var(--foreground))">Gone, because a function remembers</text>
  <text x="12" y="144" font-size="12" fill="hsl(var(--muted-foreground))">Deleted BY NAME in delete-project. Nothing in</text>
  <text x="12" y="156" font-size="12" fill="hsl(var(--muted-foreground))">the schema says they belong to a project.</text>
  <text x="12" y="172" font-size="12" fill="hsl(var(--foreground))">disruption_scenarios · network_edges ·</text>
  <text x="12" y="184" font-size="12" fill="hsl(var(--foreground))">network_nodes · simulation_results · …</text>

  <!-- ══ 3 · detached ═════════════════════════════════════════════════ -->
  <rect x="4" y="198" width="312" height="64" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="12" y="216" font-size="12" fill="hsl(var(--foreground))">Kept, and cut loose</text>
  <text x="12" y="230" font-size="12" fill="hsl(var(--muted-foreground))">ON DELETE SET NULL — yours, not the project's.</text>
  <text x="12" y="246" font-size="12" fill="hsl(var(--foreground))">chat_threads · user_files</text>
  <text x="12" y="258" font-size="12" fill="hsl(var(--muted-foreground))">Deliberate, and worth saying out loud.</text>

  <!-- ══ 4 · reached by neither ═══════════════════════════════════════ -->
  <rect x="4" y="270" width="312" height="78" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="12" y="288" font-size="12" fill="hsl(var(--foreground))">Kept, on purpose</text>
  <text x="12" y="302" font-size="12" fill="hsl(var(--muted-foreground))">Reached by neither mechanism — because they</text>
  <text x="12" y="314" font-size="12" fill="hsl(var(--muted-foreground))">are facts about the ACCOUNT, not the project.</text>
  <text x="12" y="330" font-size="12" fill="hsl(var(--foreground))">ai_chat_events · ai_usage_logs ·</text>
  <text x="12" y="342" font-size="12" fill="hsl(var(--foreground))">api_request_logs</text>

  <!-- ══ the part that is still true ══════════════════════════════════ -->
  <line x1="4" y1="360" x2="316" y2="360" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="4" y="378" font-size="12" fill="hsl(var(--muted-foreground))">Deleting your typed policy decisions used to</text>
  <text x="4" y="390" font-size="12" fill="hsl(var(--muted-foreground))">need that middle group to remember them. It</text>
  <text x="4" y="400" font-size="12" fill="hsl(var(--muted-foreground))">does not any more — they have a key.</text>
</svg>
