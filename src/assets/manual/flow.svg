<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 442" aria-hidden="true" focusable="false" font-family="inherit">
  <!-- ONE row's journey, not the whole system. Steps and the tier each lands in
       follow DataFlow, which this supersedes; what is added is the brief's own
       three asks — the approval gate marked HUMAN, where a substitution can
       enter, and a layout that survives phone width. -->

  <text x="4" y="14" font-size="12" fill="hsl(var(--foreground))">One row of one file, all the way through.</text>

  <!-- 1 -->
  <rect x="28" y="26" width="288" height="30" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="36" y="39" font-size="12" fill="hsl(var(--foreground))">you upload the file</text>
  <text x="36" y="51" font-size="12" fill="hsl(var(--muted-foreground))">kept exactly as sent</text>
  <text x="4" y="45" font-size="12" fill="hsl(var(--muted-foreground))">0</text>

  <!-- 2 -->
  <rect x="28" y="62" width="288" height="30" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="36" y="75" font-size="12" fill="hsl(var(--foreground))">we parse and check the row</text>
  <text x="36" y="87" font-size="12" fill="hsl(var(--muted-foreground))">findings, nothing changed yet</text>
  <text x="4" y="81" font-size="12" fill="hsl(var(--muted-foreground))">1</text>

  <!-- 3 -->
  <rect x="28" y="98" width="288" height="30" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="36" y="111" font-size="12" fill="hsl(var(--foreground))">it is diffed against your data</text>
  <text x="36" y="123" font-size="12" fill="hsl(var(--muted-foreground))">new, changed or unchanged</text>
  <text x="4" y="117" font-size="12" fill="hsl(var(--muted-foreground))">1</text>

  <!-- 4 — the human gate -->
  <rect x="28" y="134" width="288" height="38" rx="3" fill="hsl(var(--foreground))"/>
  <text x="36" y="151" font-size="12" fill="hsl(var(--card))">A PERSON LOOKS AND APPROVES</text>
  <text x="36" y="165" font-size="12" fill="hsl(var(--card))">Every time. Nothing crosses without this.</text>

  <!-- 5 -->
  <rect x="28" y="178" width="288" height="30" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--foreground))" stroke-width="1.6"/>
  <text x="36" y="191" font-size="12" fill="hsl(var(--foreground))">it is promoted — now it is your data</text>
  <text x="36" y="203" font-size="12" fill="hsl(var(--muted-foreground))">units normalise here, once</text>
  <text x="4" y="197" font-size="12" fill="hsl(var(--foreground))">2</text>

  <!-- 6 -->
  <rect x="28" y="214" width="288" height="30" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="36" y="227" font-size="12" fill="hsl(var(--foreground))">we compute from it</text>
  <text x="36" y="239" font-size="12" fill="hsl(var(--muted-foreground))">shares, paths, summaries</text>
  <text x="4" y="233" font-size="12" fill="hsl(var(--muted-foreground))">3</text>

  <!-- 7 -->
  <rect x="28" y="250" width="288" height="30" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="36" y="263" font-size="12" fill="hsl(var(--foreground))">you set policies over it</text>
  <text x="36" y="275" font-size="12" fill="hsl(var(--muted-foreground))">defaults, then your overrides</text>
  <text x="4" y="269" font-size="12" fill="hsl(var(--muted-foreground))">4</text>

  <!-- 8 -->
  <rect x="28" y="286" width="288" height="30" rx="3" fill="hsl(var(--card))" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="36" y="299" font-size="12" fill="hsl(var(--foreground))">the run uses it, and is stamped</text>
  <text x="36" y="311" font-size="12" fill="hsl(var(--muted-foreground))">data, policy, scenario, engine</text>
  <text x="4" y="305" font-size="12" fill="hsl(var(--muted-foreground))">5</text>

  <path d="M20 26 L20 316" stroke="hsl(var(--border))" stroke-width="1"/>

  <!-- where a substitution can enter -->
  <path d="M316 269 L294 269" stroke="hsl(var(--destructive))" stroke-width="1.6" fill="none"/>
  <polygon points="294,269 301,265.5 301,272.5" fill="hsl(var(--destructive))"/>
  <path d="M316 233 L294 233" stroke="hsl(var(--destructive))" stroke-width="1.6" fill="none"/>
  <polygon points="294,233 301,229.5 301,236.5" fill="hsl(var(--destructive))"/>

  <line x1="4" y1="332" x2="316" y2="332" stroke="hsl(var(--border))" stroke-width="1"/>
  <path d="M8 350 L30 350" stroke="hsl(var(--destructive))" stroke-width="1.6" fill="none"/>
  <polygon points="30,350 23,346.5 23,353.5" fill="hsl(var(--destructive))"/>
  <text x="40" y="354" font-size="12" fill="hsl(var(--foreground))">the only two places a number you</text>
  <text x="40" y="366" font-size="12" fill="hsl(var(--foreground))">did not supply can enter</text>
  <text x="4" y="386" font-size="12" fill="hsl(var(--muted-foreground))">A derived fallback, or a policy default. Both</text>
  <text x="4" y="398" font-size="12" fill="hsl(var(--muted-foreground))">are above your data and neither can reach</text>
  <text x="4" y="410" font-size="12" fill="hsl(var(--muted-foreground))">down and change it. Both are marked on the</text>
  <text x="4" y="422" font-size="12" fill="hsl(var(--muted-foreground))">cell where you meet them — except a bundle</text>
  <text x="4" y="434" font-size="12" fill="hsl(var(--muted-foreground))">default, which is not, and that is a known gap.</text>
</svg>
