<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 393" aria-hidden="true">
<text x="12" y="18" font-size="13" fill="hsl(var(--foreground))">A file is not yet a simulation input</text>
<rect x="8" y="32" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="47" font-size="12" fill="hsl(var(--foreground))">Raw file → staged rows</text>
<text x="18" y="62" font-size="11" fill="hsl(var(--foreground))">Original cells + parsed values + findings</text>
<text x="18" y="77" font-size="11" fill="hsl(var(--foreground))">Contract-driven CSV path only</text>
<path d="M160 84v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="101" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="116" font-size="12" fill="hsl(var(--foreground))">Review → promotion</text>
<text x="18" y="131" font-size="11" fill="hsl(var(--foreground))">Upsert eligible rows by natural key</text>
<text x="18" y="146" font-size="11" fill="hsl(var(--foreground))">Held rows remain out of accepted inputs.</text>
<path d="M160 153v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="170" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="185" font-size="12" fill="hsl(var(--foreground))">Accepted inputs → derived views</text>
<text x="18" y="200" font-size="11" fill="hsl(var(--foreground))">Refresh affected lanes and analyses</text>
<text x="18" y="215" font-size="11" fill="hsl(var(--foreground))">Check freshness and input coverage.</text>
<path d="M160 222v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="239" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="254" font-size="12" fill="hsl(var(--foreground))">Frozen dataset + policy versions</text>
<text x="18" y="269" font-size="11" fill="hsl(var(--foreground))">Scenario and engine bind the run</text>
<text x="18" y="284" font-size="11" fill="hsl(var(--foreground))">The worker reads the frozen snapshots.</text>
<path d="M160 291v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="308" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="323" font-size="12" fill="hsl(var(--foreground))">Result → review</text>
<text x="18" y="338" font-size="11" fill="hsl(var(--foreground))">Completed replications, notes and KPIs</text>
<text x="18" y="353" font-size="11" fill="hsl(var(--foreground))">Older records may have less provenance.</text>
</svg>
