<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 255" aria-hidden="true">
<text x="12" y="18" font-size="13" fill="hsl(var(--foreground))">Operational data is not a deep-tier graph</text>
<rect x="8" y="32" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="47" font-size="12" fill="hsl(var(--foreground))">Tutorial operational relationships</text>
<text x="18" y="62" font-size="11" fill="hsl(var(--foreground))">S-BOARD and S-CASE → Assembly</text>
<text x="18" y="77" font-size="11" fill="hsl(var(--foreground))">Assembly → C-ASSEMBLY</text>
<path d="M160 84v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="101" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="116" font-size="12" fill="hsl(var(--foreground))">Separate firm graph requires evidence</text>
<text x="18" y="131" font-size="11" fill="hsl(var(--foreground))">Company-node IDs and company edges</text>
<text x="18" y="146" font-size="11" fill="hsl(var(--foreground))">The tutorial ships no deep-tier files.</text>
<path d="M160 153v14m-4-4 4 4 4-4" fill="none" stroke="hsl(var(--muted-foreground))"/>
<rect x="8" y="170" width="304" height="54" rx="5" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
<text x="18" y="185" font-size="12" fill="hsl(var(--foreground))">Interpret coverage before concentration</text>
<text x="18" y="200" font-size="11" fill="hsl(var(--foreground))">Missing edges can mean missing evidence</text>
<text x="18" y="215" font-size="11" fill="hsl(var(--foreground))">No automatic upstream simulation follows.</text>
</svg>
