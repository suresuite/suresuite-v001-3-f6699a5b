- version: "0.2.7"
  date: 2026-09-22
  commit: "950d07f0"
  tier: 2
  adr: null
  summary: >-
    Automatic warm-up detection uses the published MSER-5 statistic (White, 1997).
  technical: >-
    mser5 is z(d) = Σ(b−b̄)²/(n_b−d)². The old statistic is reported for one release as
    `WarmupReport.mser5_legacy_week` and adopted by nothing. Of 36 auto-warm-up reference
    scenarios the adopted warm-up changed in 1 (week 50 → 60); its fill rate moved +0.0003,
    inside its CI.
  policies: []
  kpis: [fill_rate, lost_sales_value, delta_cost]
  goldens_moved: null
  comparable: changed-for
  comparability: >-
    Results can change for runs with automatic warm-up, where the adopted warm-up week moves;
    rare and small in the reference set.
  refs: [audit F-25]
  amendments: []
  backfilled: true
  unrecorded_changes: 1

