# The scsim engine's change record — PLAN.md §25 (Phase 15) · WP 15.4 · gate `engine-ledger`.
#
# ONE ENTRY PER ENGINE VERSION, NEWEST FIRST. This file is the only place an
# engine version's meaning is authored. Generated from it, never by hand:
#   scsim/docs/changelog.md                          (scripts/gen_changelog.py)
#   src/components/docs/generated/engineChangelog.generated.ts  (same script)
#
# Fields, per entry:
#   version        ENGINE_VERSION this entry describes (semantic).
#   date           the day the version was set.
#   commit         the commit that set it (null for the entry a branch is adding:
#                  the commit does not exist until it is made; CI fills nothing in).
#   tier           change-governance tier (Part IX §9.5): 1 no behaviour change ·
#                  2 new variable / behaviour-neutral default, or a correction → patch ·
#                  3 new phase or contract change → minor or major, with an ADR.
#   adr            the ADR a Tier 3 entry rests on (required for tier 3).
#   summary        plain words, for a user of the platform.
#   technical      for an engineer: what moved, where.
#   policies       catalog IDs the change touches (P-S.x, P-P.x, P-T.x, P-C.x, P-F.x, P-X.x).
#   kpis           registry KPI names whose values can move.
#   goldens_moved  frozen reference runs whose digest moved, as `engine:<name>`
#                  (scsim/tests/data/golden_digests.json) or `worker:<case>`
#                  (sim-worker/tests/data/golden_runs.json). null = the version
#                  predates the frozen digests (WP 14.0), so nothing can be said.
#   comparable     identical · changed-for · not-comparable — whether a result of the
#                  previous version can be compared with one of this version.
#   comparability  one sentence: for whom results change, and how.
#   refs           D-numbers, work packages, ADRs.
#   amendments     engine-source changes made under this version WITHOUT a bump,
#                  appended (never edited) — each with date, commit, tier, summary.
#   backfilled     true for entries written by WP 15.4 from git history; their
#                  `unrecorded_changes` counts engine-source commits made under the
#                  version that no record describes. A backfilled entry says what
#                  is known and does not invent the rest.
#
# THE GATE (scsim/scripts/check_changelog.py, run in scsim-tests.yml):
#   1 ENGINE_VERSION has exactly one entry; versions unique and descending.
#   2 a moved golden digest ⇒ ENGINE_VERSION differs from the base, and the new
#     entry's goldens_moved lists exactly the moved runs.
#   3 a changed pipeline_schema.json ⇒ the new entry is tier 3 with an ADR.
#   4 `comparable: identical` only when no golden moved.
#   6 engine source changed with no bump ⇒ the current entry gained an amendment.
#   7 append-only: an entry on the base branch is unchanged here, except for
#     amendments appended to it.
#   8 the record does not understate its measured effect: against
#     docs/releases/<version>.json (release_report.py, WP 15.5), `identical` only
#     when no KPI changed on the reference set, and a `changed-for` entry names
#     every KPI that moved beyond noise.

- version: "0.6.1"
  date: 2026-10-03
  commit: "53cf20cd"
  tier: 2
  adr: null
  summary: >-
    A replenishment level typed on a /policies Supplier row is now exactly the level the run
    uses: no safety stock is added on top of it and it is never raised. Periodic review reads
    its review period per material, and an (R,Q) policy with a lot size orders up to R + Q.
  technical: >-
    P-P.1/P-P.3: a row's absolute s/S is the material's level (P-P.3 adds nothing on top at
    PH-70); periodic T read per material; (R,Q) with a lot has S = R + Q; Eq. 21 reads the row
    κ. Patch: no new phase or state key. Mapping warning text for `order_up_to` reworded.
  policies: [P-P.1, P-P.3]
  kpis: [fill_rate, cost_of_resilience, delta_cost]
  goldens_moved: []
  comparable: changed-for
  comparability: >-
    Results change only for projects whose Supplier rows carry a typed s or S, a periodic
    review period, or an (R,Q) lot; every frozen reference run kept its digest.
  refs: [D288, WP 14.8]
  amendments:
    - date: 2026-10-03
      commit: "a603f6c4"
      tier: 2
      summary: >-
        (R,Q) has no κ: a κ stored on an (R,Q) row is no longer mapped, and a row with no
        positive Q keeps the declared fallback with a per-material warning.
    - date: 2026-10-03
      commit: "e34945f4"
      tier: 2
      summary: >-
        A Supplier row's lead time (`lead_time_weeks`) is read as an override of its lane,
        for that link only, rounded and clamped as an upload is. Neutral for a project that
        sets none (D290).
    - date: 2026-10-03
      commit: null
      tier: 1
      summary: >-
        Build identity (WP 15.1): a run's code_version names its build by content
        (`scsim-0.6.1+<digest>` over scsim and the worker's compute path), the package
        version is ENGINE_VERSION (the wheel is scsim-0.6.1), and the version line no longer
        carries a comment. No result changes; every frozen reference run kept its digest.
  backfilled: true
  unrecorded_changes: 0

