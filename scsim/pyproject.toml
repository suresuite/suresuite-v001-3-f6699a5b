[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scsim"
# WP 15.1 · §4 D293 — the package version is ENGINE_VERSION, read from source.
dynamic = ["version"]
description = "Resilience-grade 3-echelon supply chain simulator (SCSIM)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Phu Nguyen", email = "phu.nguyen@hwr-berlin.de" }]
# No `license` yet: all rights reserved until the open-access release —
# see NOTICE.md and docs/design/open-access-release-plan.md (decision L1).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
]

[project.optional-dependencies]
io = ["pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov", "pyyaml>=6"]

[tool.setuptools.dynamic]
version = { attr = "scsim.ENGINE_VERSION" }

[tool.setuptools.packages.find]
include = ["scsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running benchmark tests (deselect with '-m \"not slow\"')",
]
