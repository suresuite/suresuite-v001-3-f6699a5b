[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scsim"
version = "0.2.0"
description = "Resilience-grade 3-echelon supply chain simulator (SCSIM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
]

[project.optional-dependencies]
io = ["pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["scsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running benchmark tests (deselect with '-m \"not slow\"')",
]
