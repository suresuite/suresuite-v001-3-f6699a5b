site_name: SCSIM — Resilience-Grade Supply Chain Simulator
site_description: >-
  Phase-pipeline DES engine for stress-testing supplier and material risk,
  evaluating resilience-strategy portfolios, and measuring synergy.
repo_url: https://github.com/suresuite/suresuite-v001-3
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Statistics: statistics.md
  - KPIs: kpis.md
  - Stress tests: stress-tests.md
  - Synergy: synergy.md
  - Extending: extending.md
  - Performance: performance.md
  - Roadmap: roadmap.md
  - Reference (generated):
      - Policy catalog: reference/policies.md
      - Variable dictionary: reference/variables.md
      - Pipeline contract: reference/pipeline.md
      - KPI dictionary: reference/kpis.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
