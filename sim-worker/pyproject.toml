# Makes sim_worker pip-installable so the Vercel Python function
# (api/run_simulation.py) can `from sim_worker.datamap import build_project_data`
# etc. Deps here are ONLY what the serverless compute path imports at runtime,
# to keep the Vercel bundle under its 250 MB limit: pydantic (policies models)
# — scsim (numpy/scipy) comes from the separate ./scsim install. redis, httpx
# and networkx are the Fly worker's (stream consumer, DB reads, legacy graph);
# they stay in requirements.txt and are imported lazily, so they never enter
# the serverless bundle.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-worker"
version = "0.1.0"
description = "SuReSuite simulation worker — ingestion + scsim bridge"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
include = ["sim_worker*"]
