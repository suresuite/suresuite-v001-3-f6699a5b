# Fly.io configuration for sim-worker.
# The image bundles the scsim engine, so deploys build from the REPO ROOT:
#   flyctl deploy . --config sim-worker/fly.toml --dockerfile sim-worker/Dockerfile
# CI (.github/workflows/deploy-sim-worker.yml) overrides `app` with the
# FLY_APP_NAME Actions variable, so keep that variable and this value in sync.

app = "suresuite-sim-worker"   # globally-unique Fly app name — change if taken
primary_region = "iad"   # set this close to your Supabase region

[build]

[env]
  LOG_LEVEL = "INFO"
  IDLE_TTL_SECONDS = "600"   # LRU eviction of warm project graphs (in-memory)
  # Scale-to-zero cost control. A positive number of seconds makes the worker
  # exit cleanly after that long with no command in flight, so the Fly machine
  # STOPS — dropping BOTH idle Fly billing AND idle Upstash reads to ~0 (a
  # stopped worker runs neither poll loop; those loops otherwise cost ~95k
  # reads/month even at the tuned 30s cadence, see README "Idle command
  # budget"). "0" disables it → the worker runs 24/7 and polls Redis around the
  # clock. Enabled here at 900s (15 min). This REQUIRES two companions to stay
  # correct: `[[restart]] policy = "on-failure"` below, and the sim-command wake
  # secrets FLY_API_TOKEN + FLY_APP_NAME so a stopped worker is restarted on the
  # next run — WITHOUT them a stopped worker never wakes and runs sit "queued"
  # forever. See README "Scale to zero (idle cost → ~$0)".
  IDLE_SHUTDOWN_SECONDS = "900"
  # Run experiment.run on the scsim phase-pipeline engine (the canonical path:
  # worker is the sole authoritative writer of runs + per-replication rows).
  # Remove to fall back to the legacy analytical engine (aggregates only).
  SCSIM_ENGINE = "1"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# SCALE-TO-ZERO (active): `policy = "on-failure"` lets a clean exit(0) on idle
# (see IDLE_SHUTDOWN_SECONDS above) STOP the machine while genuine crashes still
# restart. Once stopped — whether by an idle exit or by exhausted crash
# retries — the next run wakes the machine via the sim-command edge function's
# Fly Machines API call (supabase/functions/_shared/wakeWorker.ts), so that wake
# path is what keeps a stopped worker from stranding a "queued" run. The wake
# secrets FLY_API_TOKEN + FLY_APP_NAME MUST be set for this, or a stopped worker
# never comes back. To revert to an always-on worker (no scale-to-zero), set
# IDLE_SHUTDOWN_SECONDS="0" above AND restore `policy = "always"` here — with
# "always" a worker that exits(0) on idle is simply restarted, so it never
# strands a run even before the wake secrets are configured.
[[restart]]
  policy = "on-failure"

# No public HTTP service — this is a background worker.
# Health check via a tiny TCP listener inside the worker (optional).
