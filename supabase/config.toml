project_id = "wckdrutwkytwcomrlpib"

[functions.calculate-node-prominence]
# A database trigger reaches this one through `pg_net` with no user JWT
# (`auto_calculate_prominence_on_deep_tier_completion`), so platform
# verification must be off. The browser calls it too, with the anon key.
verify_jwt = false

# D105 — these two were UNDECLARED while they were also undeployed, so nothing
# had ever had to state their trust model. Both are browser-invoked only
# (`ProductLevelNetwork.tsx`, `MLPrediction.tsx`) with the anon key, which is a
# valid JWT, and no `pg_net` caller reaches either — so verification stays on.
# Declared rather than left to the CLI's default, which is the same value: a
# default is not a decision, and the next reader cannot tell them apart.
[functions.calculate-network-science-metrics]
verify_jwt = true

[functions.predict-critical-nodes]
verify_jwt = true

[functions.combine-project]
verify_jwt = true

[functions.delete-project]
verify_jwt = true

[functions.ingest-outbound-logistics]
verify_jwt = true

[functions.ingest-bom-multi-level]
verify_jwt = true

[functions.ingest-inbound-logistics]
verify_jwt = true

[functions.project-ai-chat]
verify_jwt = false

[functions.project-ai-health]
verify_jwt = false

[functions.sim-command]
# The function validates the caller's JWT itself (RLS-aware createClient with
# the forwarded Authorization header); platform verification stays on too.
verify_jwt = true

[functions.api]
# Public /v1 gateway (API Phase 0 / G15). Callers authenticate with hashed
# API keys (`Authorization: Bearer sk_…`), not Supabase JWTs, so platform JWT
# verification must be off — the function fails closed on its own auth.
verify_jwt = false

[functions.agent-apply]
# Same trust model as project-ai-chat (client-asserted identity, ai-agents.md
# §8 T4 / §13.5); the function fails closed on its own §13.2 checkpoint-5
# checks (status, project ownership, agent_apply + operation rights, quota).
verify_jwt = false

[functions.report-render]
# Same trust model as project-ai-chat / agent-apply (client-asserted identity,
# ai-agents.md §8 T4 / §13.5): download fails closed on file ownership for the
# asserted user and only ever returns a 60-minute signed URL; render requires
# the service-role bearer. Platform JWT verification must be off for the
# anon-key client (`useUserFiles`) to reach it.
verify_jwt = false

[functions.ingest-file]
# Phase 3 / WP 3.2. Same trust model as the other ingest functions: the caller
# asserts its user id (this application authenticates against `approved_users`,
# not Supabase Auth — D28, a standing decision). The assertion is not taken on
# trust: `ingest_land_file` refuses a landing into a project the asserted user
# cannot reach. Platform verification stays on, as it is for the three it replaces.
verify_jwt = true

[functions.session-mint]
# Phase 7 / WP 7.1 stage 1b. Verification must be OFF, and this is the one function
# where that is structural rather than a trade-off: it is the endpoint that ISSUES the
# session token, so requiring a token to reach it is a circle. A caller is by definition
# unauthenticated.
#
# It is not therefore unguarded. It verifies the password ITSELF, server-side, through
# `authenticate_approved_user` with the service role — it does not accept the client's
# claim to have already logged in — and it answers 501 while `SUPABASE_JWT_SECRET` is
# unset, which it is today. A wrong password and an unknown address get the same 401, so
# the endpoint does not say whether an address is registered.
verify_jwt = false

# Audit 2026-09-22 · F-28 — the last three UNDECLARED functions. Each inherited the
# CLI default, which is this same value; declared because a default is not a
# decision (D105). Every caller carries a JWT: the browser invokes all three with
# the anon key (`MapView.tsx`, `useErpConnections.tsx`, `OrbitMrpCallback.tsx`),
# and the pg_cron ERP sweep sends the service-role key.
#
# `get-mapbox-token` returns a Mapbox PUBLIC token. Verification bounds an
# anonymous `curl`, not a determined caller — the anon key is public — so the real
# control is the token's URL restriction in the Mapbox account. A per-user check
# needs a user identity the server can prove, which is §4 D28 (PLAN WP 7.1).
[functions.get-mapbox-token]
verify_jwt = true

[functions.geocode-locations]
verify_jwt = true

[functions.erp-sync-orbit-mrp]
verify_jwt = true
