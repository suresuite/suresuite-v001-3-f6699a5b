[functions.api]
# Public /v1 gateway (API Phase 0 / G15). Callers authenticate with hashed
# API keys (`Authorization: Bearer sk_…`), not Supabase JWTs, so platform JWT
# verification must be off — the function fails closed on its own auth.
verify_jwt = false

[functions.agent-apply]
# Same trust model as project-ai-chat (client-asserted identity, ai-agents.md
# §8 T4 / §13.5); the function fails closed on its own §13.2 checkpoint-5
# checks (status, project ownership, agent_apply + operation rights, quota).
verify_jwt = false

[functions.report-render]
# Same trust model as project-ai-chat / agent-apply (client-asserted identity,
# ai-agents.md §8 T4 / §13.5): download fails closed on file ownership for the
# asserted user and only ever returns a 60-minute signed URL; render requires
# the service-role bearer. Platform JWT verification must be off for the
# anon-key client (`useUserFiles`) to reach it.
verify_jwt = false
