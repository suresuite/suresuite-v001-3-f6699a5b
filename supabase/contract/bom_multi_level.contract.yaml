# AUTHORED — the data contract's sidecar for `bom_multi_level`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: bom_multi_level
tier: "2"
schema_name: public
grain: >-
  One child-to-parent line of a deep bill of materials: this material is
  consumed by this higher-level component, at this level of the tree.
  Collapsed to effective product-to-material arcs before the engine sees it.
  UNIQUE on `natural_key_intended` since WP 3.3 (`20260916000018`), and the index
  is NULLS NOT DISTINCT because a ROOT line has no parent — without that clause
  the constraint would hold every line except the roots (D5 closed).
ingest_dataset:
  wizard_id: bom_multi_level
  fact_class: master
  server_set: [project_id, plant_name]
owner: data-ingestion

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "bom_multi_level_pkey"
  # WP 3.3 — `20260916000018`. THE KEY `natural_key_intended` HAS NAMED SINCE
  # WP 1.4, now enforced. `NULLS NOT DISTINCT` is part of the constraint and not
  # a detail: PostgreSQL's default makes NULLs distinct, so a plain index would
  # constrain every row except the ones whose key column is null — and
  # `ON CONFLICT` infers from the same index, so the promotion would INSERT a
  # duplicate instead of updating exactly those rows (§4 D5).
  - source: "UNIQUE index (NULLS NOT DISTINCT)"
    columns: [project_id, plant_name, material_id, higher_level_component_id, level]
    name: "bom_multi_level_natural_key"
# The key the grain implies and the database does NOT enforce (D5); WP 3.3 lands
# it. `level` is part of it: the same material can be consumed by the same parent
# at two depths of a deep BOM, and the two lines are different facts.
natural_key_intended: [project_id, plant_name, material_id, higher_level_component_id, level]

surfaces:
  - page: "DataManager.tsx"
    via: "rpc get_project_dataset_status"
    grain: table
    evidence: "src/pages/DataManager.tsx:413"
    confirmed: true
  - page: "InteractiveNetworkSpace.tsx"
    via: "table read"
    grain: table
    evidence: "src/pages/InteractiveNetworkSpace.tsx:478"
    confirmed: true
  - page: "ProcessLevelNetwork.tsx"
    via: "table read"
    grain: table
    evidence: "src/pages/ProcessLevelNetwork.tsx:359"
    confirmed: true
  - page: "ProjectPolicies.tsx"
    via: "table read"
    grain: table
    evidence: "src/lib/policies/projectLanes.ts:48"
    confirmed: true
  - page: "SimulationLab.tsx"
    via: "table read"
    grain: table
    evidence: "src/lib/policies/projectLanes.ts:48"
    confirmed: true

governance:
  read: null
  write: "data_editing"
  min_project_role: editor
  # WP 2.3 created `audit_<table>_insert/update/delete`, three AFTER … FOR EACH
  # STATEMENT triggers calling `audit_tier_write`. This flag said `false` for
  # every one of the twelve tables it audited, and the generated page published
  # that as "Tier transitions audited: no" (D40). `contract:check` R9 now
  # compares this field against the live triggers, so it cannot drift again.
  audited: true
  rls_enabled: true
  note: >-
    `write` names the capability that exists today. WP 2.2 splits `data_editing`
    into `data_edit_inputs` (tier 2) and `data_edit_policies` (tier 4); this row
    becomes `data_edit_inputs` then, and all twelve sidecars change together.

fields:
  id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Surrogate row identifier. Carries no meaning and joins to nothing.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  project_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The project this row belongs to. Every read is scoped by it.
    grain: identifier
    engine:
      consumed_by: "datamap.py::rows -> per-project fetch"
      transform: "filter, never read as a value"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: "set from the selected project, never from the CSV"
    surfaces: []
    resolution: null
  plant_name:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The focal plant this row belongs to, by NAME. A displayable string used as a
      join key — the thing invariant G1 forbids; WP 2.1/3.3 replace it with a
      uuid.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions:
      - when: "the CSV omits it"
        value: "the selected project's `projects.plant_name`"
        provenance: derived
        visible_as: null
    ingest:
      csv_header: null
      required: false
      validate: "must equal the project's plant_name — a trigger raises otherwise"
    surfaces: []
    resolution: null
  material_id:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The material this line is about — the CHILD in the parent/child pair.
    grain: identifier
    engine:
      consumed_by: "project_map.py::_map_bom -> BomArc.material_id after collapsing"
      transform: "str(); multi-level rows are folded into product->material arcs"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "material_id"
      required: true
      validate: "non-empty after trim — this ingest function is the correct pattern to copy"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  level:
    type: "integer"
    unit: "tree depth"
    unit_source: fixed
    meaning: >-
      Depth in the BOM tree. Level 1 is directly under the finished product;
      higher numbers are deeper.
    grain: level
    engine:
      consumed_by: "project_map.py::_map_bom -> collapse order"
      transform: "int()"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "level"
      required: true
      validate: "integer >= 0 — level 0 is a root component, which both live parsers admit and always have (WP 3.2 §16)"
      rule: {kind: integer, min: 0, blank: reject}
    surfaces:
      - page: "InteractiveNetworkSpace.tsx"
        via: "table read"
        grain: column
        evidence: "src/pages/InteractiveNetworkSpace.tsx:478"
        confirmed: true
      - page: "ProcessLevelNetwork.tsx"
        via: "table read"
        grain: column
        evidence: "src/pages/ProcessLevelNetwork.tsx:359"
        confirmed: true
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        Depth in the BOM tree is structure, not measurement.
  higher_level_component_id:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The parent this material feeds. Empty at the top of the tree, where the
      parent is the finished product itself.
    grain: identifier
    engine:
      consumed_by: "project_map.py::_map_bom -> collapse parent"
      transform: "str(); NULL means 'the product'"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "higher_level_component_id"
      required: false
      validate: "may be blank only at the root level"
      rule: {kind: text, blank: "null"}
    surfaces: []
    resolution: null
  consumption_rate:
    type: "numeric"
    unit: "units of material per unit of parent"
    unit_source: fixed
    meaning: >-
      How many units of this material one unit of the parent consumes. An
      engineering fact, never estimated (WP 1.3).
    grain: level
    engine:
      consumed_by: "project_map.py::_map_bom -> BomArc.consumption_rate"
      transform: "float(); multiplied down the tree when collapsing; a falsy value becomes 1.0"
      missing_default: "1.0"
    substitutions:
      - when: "NULL or zero"
        value: "1.0"
        provenance: default
        visible_as: null
    ingest:
      csv_header: "consumption_rate"
      required: true
      validate: "numeric > 0"
      rule: {kind: numeric, exclusive_min: 0, blank: reject}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        estimable_from is EMPTY and that is a positive statement, not an omission.
        This is an engineering or commercial fact that someone knows exactly — it
        is written on a drawing, in a contract, or on a machine's nameplate.
        Fitting a distribution to it would produce a number with error bars around
        something that has no error, and the error bars would be believed. A
        future estimator reading this contract must refuse this field. Same rule
        as bom_single_level.consumption_rate, and more important here: multi-level
        rates multiply down the tree, so an estimate at level 3 propagates into
        every product above it.
  created_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the row was inserted. Server-set.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  updated_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the row last changed. Server-set.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  ingest_run_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The ingestion run that last wrote this row (WP 3.3), and through it the
      project, the source kind and who approved the promotion. NULL for every
      row that predates the CSV landing path, and for rows whose run has since
      been deleted — a null here means the provenance is UNKNOWN, never that
      there was none. Set by `ingest_apply_run` and by nothing else.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
  source_row_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The tier-1 staged row this was promoted from (WP 3.3). Its
      `source_row_number` is the physical line of the uploaded file, header =
      line 1, so a person can be shown the line rather than told a file name —
      which is what extends A4 down to the source. `ON DELETE SET NULL` and
      DEFERRABLE: staging is deleted with its run, and a canonical row belongs to
      the project rather than to the run that last wrote it.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
