note: >-
  Backfilled from `projects.modeler_id` — every project's modeler becomes its
  owner. That records a fact that already held rather than granting anything new:
  every write policy in the schema already reads `modeler_id` as the project's
  owner. `modeler_id` is NOT a declared foreign key to `approved_users`, so the
  backfill filters on the user existing; a project whose modeler row is gone gets
  no owner and is visible only to the organization, which is the honest outcome
  and a §15 question worth asking. THE PROJECT LEVEL OF THREE (§4 D211): a row here
  is the project role; `approved_users.role` is the platform level and the account
  tier, `organization_members.org_role` the role inside an organization. The rules
  that read a row here are the promotion (`ingest_apply_run`, editor or higher) and
  the export decision (`capabilities_for_user(user, project)`); NO row-level policy
  does (D66), so an editor who did not create the project still cannot write its
  data. `admin_set_project_member` refuses an account outside the project's
  organization, demoting the creator, and removing the last owner; a row held by an
  account that has since left the organization is kept and reported
  (`admin_project_access.in_project_org = false`), not deleted.
