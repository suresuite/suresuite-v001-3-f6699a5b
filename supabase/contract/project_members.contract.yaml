# AUTHORED — the data contract's sidecar for `project_members`.
# Edit this file; do not edit docs/data/tables/*.md, which is generated from it.
table: project_members
tier: G
schema_name: public
grain: >-
  One person's standing on one project. This is the level of access the platform
  did not have until WP 2.2 — between "in the organization" (sees every project)
  and "not in it" (sees none).
owner: platform

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [project_id, user_id]
    name: null

governance:
  read: null
  write: super_admin
  min_project_role: owner
  audited: false
  rls_enabled: true
  note: >-
    There is still NO insert/update/delete POLICY, and that absence is
    load-bearing: D28 says every policy here is PERMISSIVE and permissive
    policies OR, so a "deny writes" policy added beside anything else would deny
    nothing. The ABSENCE of a policy is the enforcement, and the SECURITY DEFINER
    functions are the only way in. Since `20260930000005` (§4 D211) one of them is
    user-facing — `admin_set_project_member` / `admin_remove_project_member`, a
    super admin on /admin/projects › Access, logged through `log_admin_action` —
    hence `write: super_admin`. The other writers are the creator triggers
    (`projects_owner_membership` at INSERT, `projects_new_modeler_is_owner` when
    the modeler changes) and the backfills. `audited: false` — the triggers and
    backfills write no audit row, so the general claim fails; WP 2.3 is where
    that becomes true.

