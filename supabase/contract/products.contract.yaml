# AUTHORED — the data contract's sidecar for `products`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: products
tier: "2"
schema_name: public
grain: >-
  One finished product in one project: the economics and the demand shape the
  simulation reads for it. Where this row is silent the engine derives price
  and demand from the outbound arcs.
owner: data-ingestion

natural_key_unique:
  - source: "PRIMARY KEY constraint"
    columns: [project_id, product_id]
    name: null

governance:
  read: null
  write: "data_editing"
  min_project_role: editor
  audited: false
  rls_enabled: false
  note: >-
    `write` names the capability that exists today. WP 2.2 splits `data_editing`
    into `data_edit_inputs` (tier 2) and `data_edit_policies` (tier 4); this row
    becomes `data_edit_inputs` then, and all twelve sidecars change together.
    SEPARATELY AND MORE URGENTLY: rls_enabled is FALSE on all three item
    masters. No migration ever runs ALTER TABLE ... ENABLE ROW LEVEL SECURITY on
    them, so the per-project isolation every other tier-2 table has does not
    exist here. Found by WP 1.2; it is WP 2.4's to fix and WP 2.2's to test.

fields:
  project_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The project this product belongs to. Half of the primary key.
    grain: identifier
    engine:
      consumed_by: "datamap.py::rows -> per-project fetch"
      transform: "filter, never read as a value"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: "set from the selected project, never from the CSV"
    surfaces: []
    resolution: null
  product_id:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The product's code as the user's own systems spell it. Joins to the BOM and
      to every outbound arc that sells it.
    grain: identifier
    engine:
      consumed_by: "project_map.py::_map_products -> ProductRow.id"
      transform: "str()"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "product_id"
      required: true
      validate: "non-empty; unique within the project"
    surfaces: []
    resolution: null
  name:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      A human-readable name for the product. Display only.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_map_products -> Product.name"
      transform: "str(name or product_id)"
      missing_default: "the product_id itself"
    substitutions:
      - when: "NULL or blank"
        value: "the product_id"
        provenance: default
        visible_as: null
    ingest:
      csv_header: "name"
      required: false
      validate: null
    surfaces: []
    resolution: null
  sell_price:
    type: "numeric"
    unit: "currency per unit of product"
    unit_source: fixed
    meaning: >-
      What one unit of this product sells for. Where it is unset the engine uses
      the demand-weighted mean of the outbound arcs' prices, which is usually what
      the user means and is why leaving it blank is not an error.
    grain: level
    engine:
      consumed_by: "project_map.py::_map_products -> Product.unit_price"
      transform: "float() when > 0"
      missing_default: "the demand-weighted mean outbound unit_price, else ENGINE_DEFAULT_PRICE"
    substitutions:
      - when: "NULL or <= 0"
        value: "demandWeightedSellPrice over this product's outbound arcs"
        provenance: derived
        visible_as: "the effective-economics badge in /policies"
    ingest:
      csv_header: "sell_price"
      required: false
      validate: "numeric > 0"
    surfaces: []
    resolution: null
    note: >-
      D21 in one line: the user types `sell_price`, the database column is
      `sell_price`, and the engine's field is `unit_price`. The legacy docs led
      with the engine's name, so a reader searching their own CSV for `unit_price`
      found nothing. The manual leads with `sell_price`.
  production_capacity:
    type: "numeric"
    unit: "units per week"
    unit_source: fixed
    meaning: >-
      How much of this product the plant can make per week. The canonical G4
      example: when it is unset the engine invents a capacity generous enough that
      capacity never binds, so an unset value silently turns off the constraint
      the user thinks they are simulating.
    grain: rate
    engine:
      consumed_by: "project_map.py::_map_products -> Product.production_capacity"
      transform: "float() when > 0"
      missing_default: "max(2 x demand, 1000) — a value chosen so the constraint never binds"
    substitutions:
      - when: "NULL or <= 0"
        value: "max(2 x demand, 1000)"
        provenance: default
        visible_as: "MappingWarning on the run's mapping report"
    ingest:
      csv_header: "production_capacity"
      required: false
      validate: "numeric > 0"
    surfaces: []
    resolution: null
  fulfillment_mode:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      Whether this product is made to order or made to stock. Decides whether the
      simulation holds finished goods for it.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_fulfillment_mode -> Product fulfillment mode"
      transform: "resolved against the project's supply_chain_model; an unknown value warns rather than raising"
      missing_default: "the project's supply_chain_model"
    substitutions:
      - when: "NULL or unrecognised"
        value: "the project-level fulfillment strategy"
        provenance: default
        visible_as: "MappingWarning on the run's mapping report"
    ingest:
      csv_header: "fulfillment_mode"
      required: false
      validate: "mto or mts; ato is a reserved enum that hard-errors, eto/cto are UI labels only"
    surfaces: []
    resolution: null
  demand_distribution:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The SHAPE of weekly demand for this product — constant, normal, triangular
      and so on. What the user types here is `demand_distribution`; the engine
      calls the resolved value `demand_model`.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_resolve_demand_kind -> demand kind"
      transform: "resolved against the scenario's demand_model; unknown values fall back"
      missing_default: "the scenario's demand_model"
    substitutions:
      - when: "NULL or unrecognised"
        value: "the scenario's demand_model"
        provenance: default
        visible_as: null
    ingest:
      csv_header: "demand_distribution"
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      D21: CSV header `demand_distribution`, engine field `demand_model`. Recorded
      both ways; the manual leads with the header.
  demand_mean:
    type: "numeric"
    unit: "units per week"
    unit_source: fixed
    meaning: >-
      Typical weekly demand for this product. The engine treats it as the MODE of
      the demand distribution, not its arithmetic mean — a distinction that
      matters the moment the distribution is skewed.
    grain: rate
    engine:
      consumed_by: "project_map.py::_map_products -> demand_mode"
      transform: "float() when > 0; otherwise derived from the outbound arcs"
      missing_default: "the weekly-normalized outbound volume for this product"
    substitutions:
      - when: "NULL or <= 0"
        value: "sum of this product's outbound volumes, normalized to weeks"
        provenance: derived
        visible_as: "the effective-economics badge in /policies"
    ingest:
      csv_header: "demand_mean"
      required: false
      validate: "numeric > 0"
    surfaces: []
    resolution: null
    note: >-
      D21: CSV header `demand_mean`, engine field `demand_mode`. The rename is not
      cosmetic — calling a mode a mean is a modelling claim. Both recorded.
  demand_cv:
    type: "numeric"
    unit: "coefficient of variation (dimensionless)"
    unit_source: fixed
    meaning: >-
      How much weekly demand varies, as a coefficient of variation.
    grain: level
    engine:
      consumed_by: "project_map.py::_map_products -> demand cv"
      transform: "float() when not None, else the scenario's demand_cv"
      missing_default: "the scenario-level demand_cv"
    substitutions:
      - when: "NULL"
        value: "the scenario's demand_cv"
        provenance: default
        visible_as: null
    ingest:
      csv_header: "demand_cv"
      required: false
      validate: "numeric >= 0"
    surfaces: []
    resolution: null
  updated_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the row last changed. Server-set.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  created_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the row was inserted. Server-set.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  demand_min:
    type: "numeric"
    unit: "units per week"
    unit_source: fixed
    meaning: >-
      The lowest weekly demand the distribution allows. Used by the triangular
      demand shape; a value above the mode is clamped to the mode rather than
      rejected.
    grain: rate
    engine:
      consumed_by: "project_map.py::_map_products -> demand_min"
      transform: "float(); clamped to the mode with a warn when it exceeds it"
      missing_default: "mode x (1 - cv)"
    substitutions:
      - when: "NULL"
        value: "demand_mean x (1 - demand_cv)"
        provenance: derived
        visible_as: null
      - when: "greater than the mode"
        value: "the mode"
        provenance: default
        visible_as: "MappingWarning on the run's mapping report"
    ingest:
      csv_header: "demand_min"
      required: false
      validate: "numeric >= 0"
    surfaces: []
    resolution: null
  demand_max:
    type: "numeric"
    unit: "units per week"
    unit_source: fixed
    meaning: >-
      The highest weekly demand the distribution allows. Used by the triangular
      demand shape; a value below the mode is clamped to the mode rather than
      rejected.
    grain: rate
    engine:
      consumed_by: "project_map.py::_map_products -> demand_max"
      transform: "float(); clamped to the mode with a warn when it falls below it"
      missing_default: "mode x (1 + cv)"
    substitutions:
      - when: "NULL"
        value: "demand_mean x (1 + demand_cv)"
        provenance: derived
        visible_as: null
      - when: "less than the mode"
        value: "the mode"
        provenance: default
        visible_as: "MappingWarning on the run's mapping report"
    ingest:
      csv_header: "demand_max"
      required: false
      validate: "numeric >= 0"
    surfaces: []
    resolution: null
  source_system:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      Which external system this row came from, when it was synced rather than
      uploaded. NULL for a hand-uploaded or hand-edited row.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED into the engine, and correctly so: it is provenance, not a
      parameter. Read by the ERP connector (blueprint G18), which is the only
      writer. Kept, not a deletion candidate.
  source_external_id:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      This row's identifier in the external system, so a re-sync can match it.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED into the engine; ERP-connector provenance, as source_system.
  source_synced_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the external system last confirmed this row.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED into the engine; ERP-connector provenance, as source_system.
