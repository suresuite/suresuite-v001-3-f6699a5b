# AUTHORED — the data contract's sidecar for `products`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: products
tier: "2"
schema_name: public
grain: >-
  One finished product in one project: the economics and the demand shape the
  simulation reads for it. Where this row is silent the engine derives price
  and demand from the outbound arcs.
ingest_dataset:
  # D55 — WP 3.2 left the three item masters writing tier 2 DIRECTLY, from the
  # browser to `bulk_upsert_products`, and the reason was not laziness: that RPC
  # already upserts on this table's natural key, and routing it through a landing
  # whose promotion was an INSERT would have been a regression dressed as
  # progress. WP 3.3 makes the promotion an upsert, so the landing is now strictly
  # better than the RPC — it adds a tier-0 manifest, a run, staged rows a person
  # can be shown, and an audit row naming the uploader — and this block is the
  # whole cost. `INGEST_DATASETS` is generated from it, `UploadWizard` routes on
  # `INGEST_DATASETS[template.id]`, and `ingest-file` validates from the spec.
  #
  # `server_set` is `project_id` ALONE. These tables have no `plant_name`: an
  # item master is a property of the project, not of a plant. `ingest_apply_run`
  # therefore derives the server-set columns per target instead of assuming both,
  # which is what lets one promotion serve nine datasets rather than six plus a
  # special case.
  wizard_id: item_master_products
  fact_class: master
  server_set: [project_id]
owner: data-ingestion

natural_key_unique:
  - source: "PRIMARY KEY constraint"
    columns: [project_id, product_id]
    name: null

governance:
  read: null
  write: "data_editing"
  min_project_role: editor
  # WP 2.3 created `audit_<table>_insert/update/delete`, three AFTER … FOR EACH
  # STATEMENT triggers calling `audit_tier_write`. This flag said `false` for
  # every one of the twelve tables it audited, and the generated page published
  # that as "Tier transitions audited: no" (D40). `contract:check` R9 now
  # compares this field against the live triggers, so it cannot drift again.
  audited: true
  # `rls_enabled` is DELIBERATELY ABSENT, and that is the finding. See the note.
  note: >-
    `write` names the capability that exists today. WP 2.2 splits `data_editing`
    into `data_edit_inputs` (tier 2) and `data_edit_policies` (tier 4); this row
    becomes `data_edit_inputs` then, and all thirteen sidecars change together.
    SEPARATELY — AND THIS REPLACES WHAT WP 1.2 WROTE HERE, WHICH WAS WRONG: this
    sidecar used to assert `rls_enabled: false` and say "no migration ever runs
    ALTER TABLE ... ENABLE ROW LEVEL SECURITY on them". One does.
    `20260614000001_item_master.sql:57-66` enables RLS and creates two policies
    (`%s_auth_all`, `%s_anon_read`) on each of the three masters — but through
    `EXECUTE format(...)` inside a `FOREACH` over an array of table names, which
    a static replay of the migrations cannot evaluate. The introspector recorded
    the absence as `enabled: false`, WP 1.2 read that as fact, and the contract
    was one generated page away from telling a user their item masters were
    unprotected. WP 1.4 fixed the mechanism, not the guess: the introspector now
    records dynamic DDL (`dynamic_ddl`) and marks the tables it touches
    `rls.determinate: false`, the validator refuses to let a sidecar assert an
    RLS state the migrations do not settle, and the generated page says the state
    is indeterminate and names the migration. The ONLY way to know is to read the
    live database — PLAN.md §15, still unrun. WP 2.4's security review owns it.

fields:
  project_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The project this product belongs to. Half of the primary key.
    grain: identifier
    engine:
      consumed_by: "datamap.py::rows -> per-project fetch"
      transform: "filter, never read as a value"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: "set from the selected project, never from the CSV"
    surfaces: []
    resolution: null
  product_id:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The product's code as the user's own systems spell it. Joins to the BOM and
      to every outbound arc that sells it.
    grain: identifier
    engine:
      consumed_by: "project_map.py::_map_products -> ProductRow.id"
      transform: "str()"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "product_id"
      required: true
      validate: "non-empty; unique within the project"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  name:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      A human-readable name for the product. Display only.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_map_products -> Product.name"
      transform: "str(name or product_id)"
      missing_default: "the product_id itself"
    substitutions:
      - when: "NULL or blank"
        value: "the product_id"
        provenance: default
        visible_as: null
    ingest:
      csv_header: "name"
      required: false
      validate: null
      rule: {kind: text, blank: 'null'}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload, item_master_form]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        A label. See materials.name.
  sell_price:
    type: "numeric"
    unit: "currency per unit of product"
    unit_source: fixed
    meaning: >-
      What one unit of this product sells for. Where it is unset the engine uses
      the demand-weighted mean of the outbound arcs' prices, which is usually what
      the user means and is why leaving it blank is not an error.
    grain: level
    engine:
      consumed_by: "project_map.py::_map_products -> Product.unit_price"
      transform: "float() when > 0"
      missing_default: "the demand-weighted mean outbound unit_price, else ENGINE_DEFAULT_PRICE"
    substitutions:
      - when: "NULL or <= 0"
        value: "demandWeightedSellPrice over this product's outbound arcs"
        provenance: derived
        visible_as: "the effective-economics badge in /policies"
    ingest:
      csv_header: "sell_price"
      required: false
      validate: "numeric > 0"
      rule: {kind: numeric, exclusive_min: 0, blank: 'null'}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload, item_master_form]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        hybrid is NULL because scsim has nowhere to put a spread: cost and
        unit_price are bare floats on Material and Product, with no distribution,
        no CV and no sampling path anywhere in the engine. Recording `hybrid:
        null` here is a statement about the ENGINE, not about the world — prices
        obviously vary. Giving them a spread is an engine change on the scsim
        track; see the RFC in PLAN.md §14. Do not invent one in this contract: a
        contract that describes a capability the engine does not have is how a
        fallback ends up in code with no contract entry, which is what I6 forbids
        in the other direction. As with materials.cost, the demand-weighted
        outbound mean is a visible substitution, not an estimate.
    note: >-
      D21 in one line: the user types `sell_price`, the database column is
      `sell_price`, and the engine's field is `unit_price`. The legacy docs led
      with the engine's name, so a reader searching their own CSV for `unit_price`
      found nothing. The manual leads with `sell_price`.
  production_capacity:
    type: "numeric"
    unit: "units per week"
    unit_source: fixed
    meaning: >-
      How much of this product the plant can make per week. The canonical G4
      example: when it is unset the engine invents a capacity generous enough that
      capacity never binds, so an unset value silently turns off the constraint
      the user thinks they are simulating.
    grain: rate
    engine:
      consumed_by: "project_map.py::_map_products -> Product.production_capacity"
      transform: "float() when > 0"
      missing_default: "max(2 x demand, 1000) — a value chosen so the constraint never binds"
    substitutions:
      - when: "NULL or <= 0"
        value: "max(2 x demand, 1000)"
        provenance: default
        visible_as: "MappingWarning on the run's mapping report"
    ingest:
      csv_header: "production_capacity"
      required: false
      validate: "numeric > 0"
      rule: {kind: numeric, exclusive_min: 0, blank: 'null'}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload, item_master_form]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        estimable_from is EMPTY and that is a positive statement, not an omission.
        This is an engineering or commercial fact that someone knows exactly — it
        is written on a drawing, in a contract, or on a machine's nameplate.
        Fitting a distribution to it would produce a number with error bars around
        something that has no error, and the error bars would be believed. A
        future estimator reading this contract must refuse this field. This is the
        canonical G4 field: unset, the engine invents max(2 x demand, 1000), which
        is chosen so the constraint never binds. Estimating it from output would
        do the same thing with more ceremony — output is bounded by demand, so the
        fitted capacity can never explain a shortage.
  fulfillment_mode:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      Whether this product is made to order or made to stock. Decides whether the
      simulation holds finished goods for it.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_fulfillment_mode -> Product fulfillment mode"
      transform: "resolved against the project's supply_chain_model; an unknown value warns rather than raising"
      missing_default: "the project's supply_chain_model"
    substitutions:
      - when: "NULL or unrecognised"
        value: "the project-level fulfillment strategy"
        provenance: default
        visible_as: "MappingWarning on the run's mapping report"
    ingest:
      csv_header: "fulfillment_mode"
      required: false
      validate: "mto or mts; ato is a reserved enum that hard-errors, eto/cto are UI labels only"
      rule: {kind: enum, values: [mto, mts], blank: 'null'}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload, item_master_form]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        Make-to-order or make-to-stock is a decision about how the business runs,
        not a quantity. Falls back to the project's fulfillment_strategy.
  demand_distribution:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The SHAPE of weekly demand for this product — constant, normal, triangular
      and so on. What the user types here is `demand_distribution`; the engine
      calls the resolved value `demand_model`. `normal` IS A REAL NORMAL since
      engine 0.3.0 (PLAN.md §24 WP 14.1, ADR 0002 decision 8): N(mean, σ =
      demand_cv × mean), negative draws set to 0 and counted on the run — before
      it, `normal` ran as triangularAV with a mapping warning. A customer × product
      row may state its own distribution on `outbound_logistics` (WP 14.2); this
      product-level one is what a row that states none runs on, scaled by its
      volume share.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_resolve_demand_kind -> demand kind"
      transform: "resolved against the scenario's demand_model; unknown values fall back"
      missing_default: "the scenario's demand_model"
    substitutions:
      - when: "NULL or unrecognised"
        value: "the scenario's demand_model"
        provenance: default
        visible_as: null
    ingest:
      csv_header: "demand_distribution"
      required: false
      validate: null
      rule: {kind: enum, values: [triangular, deterministic, poisson, negbin], blank: 'null'}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload, item_master_form]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        The SHAPE of demand is a modelling choice, not something to fit: which
        distribution to believe is exactly the judgement the user is making. Falls
        back to the scenario's demand_model.
    note: >-
      D21: CSV header `demand_distribution`, engine field `demand_model`. Recorded
      both ways; the manual leads with the header.
  demand_mean:
    type: "numeric"
    unit: "units per week"
    unit_source: fixed
    meaning: >-
      Typical weekly demand for this product. The engine treats it as the MODE of
      the demand distribution, not its arithmetic mean — a distinction that
      matters the moment the distribution is skewed.
    grain: rate
    engine:
      consumed_by: "project_map.py::_map_products -> demand_mode"
      transform: "float() when > 0; otherwise derived from the outbound arcs"
      missing_default: "the weekly-normalized outbound volume for this product"
    substitutions:
      - when: "NULL or <= 0"
        value: "sum of this product's outbound volumes, normalized to weeks"
        provenance: derived
        visible_as: "the effective-economics badge in /policies"
    ingest:
      csv_header: "demand_mean"
      required: false
      validate: "numeric > 0"
      rule: {kind: numeric, exclusive_min: 0, blank: 'null'}
    surfaces: []
    resolution:
      default_mode: hybrid
      assertable_by: [csv_upload, item_master_form]
      estimable_from: [outbound_logistics.volume (weekly-normalized)]
      hybrid:
        centre: "products.demand_mean"
        spread: "products.demand_cv + products.demand_min/demand_max"
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        default_mode is `hybrid` and this is the only field in the twelve where
        that is true. Demand is the one quantity here that is genuinely observed
        rather than specified: the user may state a figure, and the outbound arcs
        independently say what was actually taken. The engine already resolves it
        that way — the master value wins, the weekly-normalized outbound volume
        stands in when it is unset. on_conflict is assertion_wins: a stated
        forecast beats history, because a forecast is a decision about the future
        and history is not.
    note: >-
      D21: CSV header `demand_mean`, engine field `demand_mode`. The rename is not
      cosmetic — calling a mode a mean is a modelling claim. Both recorded.
  demand_cv:
    type: "numeric"
    unit: "coefficient of variation (dimensionless)"
    unit_source: fixed
    meaning: >-
      How much weekly demand varies — READ BY THE DISTRIBUTION (PLAN.md §24
      WP 14.1): for `normal` it is the coefficient of variation (σ = cv × mean);
      for `triangular` / `triangularAV` it is the ± fraction of the triangularAV
      form, triangular(mean·(1−cv), mean, mean·(1+cv)), unless explicit
      `demand_min` / `demand_max` are given; Poisson and deterministic ignore it.
      The two readings are not interchangeable: 0.3 is σ = 30 % of the mean under
      normal and a ±30 % range under triangular.
    grain: level
    engine:
      consumed_by: "project_map.py::_map_products -> demand cv"
      transform: "float() when not None, else the scenario's demand_cv"
      missing_default: "the scenario-level demand_cv"
    substitutions:
      - when: "NULL"
        value: "the scenario's demand_cv"
        provenance: default
        visible_as: null
    ingest:
      csv_header: "demand_cv"
      required: false
      validate: "numeric >= 0"
      rule: {kind: numeric, min: 0, blank: 'null'}
    surfaces: []
    resolution:
      default_mode: hybrid
      assertable_by: [csv_upload, item_master_form, policy_grid]
      estimable_from: [outbound_logistics.volume (weekly-normalized)]
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        The SPREAD half of demand's hybrid. Falls back to the scenario-level
        demand_cv rather than to zero, so an unset CV does not silently make
        demand deterministic.
  fg_policy:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The finished-goods inventory policy of an MTS product (PLAN.md §24 WP 14.4,
      ADR 0002 decision 3): `base_stock` fills to S, `min_max` fills to S only when
      the stock left after the week's demand is below s, `days_of_cover` fills to
      D/7 × the projected weekly demand, so its target moves with the forecast.
      NULL is base-stock with today's derived target. An MTO product holds no FG
      stock and does not read it.
    grain: level
    engine:
      consumed_by: "project_map.py::_resolve_fg -> Product.fg_policy (MTS)"
      transform: "the Plant-stage override, else this; an incomplete min_max or days_of_cover runs as base_stock, warned"
      missing_default: "base_stock"
    substitutions:
      - when: "NULL"
        value: "base_stock"
        provenance: default
        visible_as: "the Plant cell's empty note"
    ingest:
      csv_header: "fg_policy"
      required: false
      validate: "base_stock | min_max | days_of_cover; blank lands nothing"
      rule: {kind: enum, values: [base_stock, min_max, days_of_cover], blank: 'null'}
    surfaces: []
    resolution: null
  fg_base_stock:
    type: "numeric"
    unit: "units of product"
    unit_source: fixed
    meaning: >-
      S — the end-of-week finished-goods target in units, for `base_stock` and
      `min_max` (WP 14.4). A STATED S is the target: P-P.4's safety stock is never
      added on top of it (one source per number). Empty under base-stock is the
      derived target: one week of forecast, plus P-P.4's buffer when it is on.
    grain: level
    engine:
      consumed_by: "project_map.py::_resolve_fg -> Product.fg_base_stock (MTS)"
      transform: "the Plant-stage override, else this"
      missing_default: "derived: one week of forecast (+ P-P.4)"
    substitutions: []
    ingest:
      csv_header: "fg_base_stock"
      required: false
      validate: "numeric >= 0; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: 'null'}
    surfaces: []
    resolution: null
  fg_reorder_point:
    type: "numeric"
    unit: "units of product"
    unit_source: fixed
    meaning: >-
      s — `min_max` only: the plant builds up to S when the stock left after the
      week's demand falls below s, and builds nothing otherwise (WP 14.4). Must be
      below S.
    grain: level
    engine:
      consumed_by: "project_map.py::_resolve_fg -> Product.fg_reorder_point (MTS, min_max)"
      transform: "the Plant-stage override, else this"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "fg_reorder_point"
      required: false
      validate: "numeric >= 0; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: 'null'}
    surfaces: []
    resolution: null
  fg_cover_days:
    type: "numeric"
    unit: "days"
    unit_source: fixed
    meaning: >-
      D — `days_of_cover` only: how many days of FUTURE demand the stock should
      cover. The target is D/7 × the projected weekly demand, so it moves with the
      forecast (WP 14.4). Days, not converted: the engine divides by 7 itself.
    grain: level
    engine:
      consumed_by: "project_map.py::_resolve_fg -> Product.fg_cover_days (MTS, days_of_cover)"
      transform: "the Plant-stage override, else this; target = D/7 x projected weekly demand"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "fg_cover_days"
      required: false
      validate: "numeric >= 0; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: 'null'}
    surfaces: []
    resolution: null
  fg_initial_on_hand:
    type: "numeric"
    unit: "units of product"
    unit_source: fixed
    meaning: >-
      The finished-goods stock an MTS product starts the run with — engine RFC 4,
      closed by WP 14.4 (the capability first, then this column, in RFC 4's own
      order). Empty starts the run at the policy target, which is today's
      behaviour.
    grain: level
    engine:
      consumed_by: "project_map.py::_resolve_fg -> Product.fg_initial_on_hand (MTS)"
      transform: "the Plant-stage override, else this"
      missing_default: "the policy target"
    substitutions:
      - when: "NULL"
        value: "the FG target"
        provenance: default
        visible_as: "the Plant cell's empty note"
    ingest:
      csv_header: "fg_initial_on_hand"
      required: false
      validate: "numeric >= 0; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: 'null'}
    surfaces: []
    resolution: null
  production_lead_time:
    type: "numeric"
    unit: "weeks"
    unit_source: column
    unit_column: production_lead_time_unit
    normalize_at_promotion: {conversion: duration, canonical: week}
    meaning: >-
      How long this product takes to make at the focal plant: output started in a
      week is finished stock L weeks later (P-P.13, PLAN.md §25 WP 15.5). A duration
      in `production_lead_time_unit` (blank = weeks); weeks after promotion. Empty is
      0 — the product completes in the week it starts, which is how every product ran
      before Phase 15. For deterministic, normal, lognormal and gamma it is the mean;
      a triangular or uniform product plans on the mean of its bounds instead.
    grain: level
    engine:
      consumed_by: "project_map.py::_product_lead_time -> Product.production_lead_time_weeks"
      transform: "the Plant-stage override, else _duration_to_weeks(this, production_lead_time_unit); rounded half to even, clamped 0–26"
      missing_default: "0 weeks — completes in the week it starts"
    substitutions:
      - when: "NULL"
        value: "0 weeks"
        provenance: default
        visible_as: "the Plant cell's empty default"
    ingest:
      csv_header: "production_lead_time"
      required: false
      validate: "numeric >= 0; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: 'null'}
    surfaces: []
    resolution: null
  production_lead_time_unit:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The period `production_lead_time` and its bounds are quoted in — day, week,
      month, … (PLAN.md §25 WP 15.5). Blank means WEEKS, the convention
      `inbound_logistics.lead_time_unit` set. After promotion it reads `week`.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_product_lead_time -> _duration_to_weeks(…, production_lead_time_unit)"
      transform: "looked up in the one unit table; an unknown value falls to a 7-day basis"
      missing_default: "weeks"
    substitutions:
      - when: "NULL or blank"
        value: "weeks"
        provenance: contract
        visible_as: null
    ingest:
      csv_header: "production_lead_time_unit"
      required: false
      validate: "one of the units public.unit_days() knows — enforced by the column's CHECK constraint"
      rule: {kind: unit, blank: "null"}
    surfaces: []
    resolution: null
  production_lead_time_dist:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The SHAPE of this product's production lead time — deterministic, normal,
      lognormal, gamma, triangular or uniform, chosen like a lane's lead time
      (PLAN.md §25 WP 15.5). Blank is deterministic.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_product_lead_time -> Product.production_lead_time_dist"
      transform: "lower-cased; an unknown value, or a shape missing a parameter it needs, is warned and the product runs deterministic"
      missing_default: "deterministic"
    substitutions:
      - when: "blank"
        value: "deterministic"
        provenance: default
        visible_as: "the Plant table's production lead-time distribution cell"
      - when: "a shape whose parameters are missing or unusable"
        value: "deterministic"
        provenance: default
        visible_as: "MappingWarning on the run's mapping report"
    ingest:
      csv_header: "production_lead_time_dist"
      required: false
      validate: "one of deterministic, normal, lognormal, gamma, triangular, uniform — enforced by the column's CHECK constraint; blank lands nothing"
      rule: {kind: enum, values: [deterministic, normal, lognormal, gamma, triangular, uniform], blank: "null"}
    surfaces: []
    resolution: null
  production_lead_time_cv:
    type: "numeric"
    unit: "coefficient of variation (dimensionless)"
    unit_source: fixed
    meaning: >-
      How much the production lead time varies — read by normal, lognormal and
      gamma only (PLAN.md §25 WP 15.5). Bounded 0–1, as the engine bounds it.
    grain: level
    engine:
      consumed_by: "project_map.py::_product_lead_time -> Product.production_lead_time_cv"
      transform: "float(); the Plant row's CV on /policies wins"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "production_lead_time_cv"
      required: false
      validate: "numeric 0–1 — enforced by the column's CHECK constraint; blank lands nothing"
      rule: {kind: numeric, min: 0, max: 1, blank: "null"}
    surfaces: []
    resolution: null
  production_lead_time_min:
    type: "numeric"
    unit: "weeks"
    unit_source: column
    unit_column: production_lead_time_unit
    normalize_at_promotion: {conversion: duration, canonical: week}
    meaning: >-
