# AUTHORED — the data contract's sidecar for `scenarios`.
table: scenarios
tier: '4'
schema_name: public
grain: >-
  One what-if a person set up and can run: the horizon, the warm-up, the replications, the seed,
  the demand model, the disruption schedule and the recovery overrides. The scenario half of
  `result-binding` (I8) — a run cites one of these rows, and the export reads it back whole.
owner: engine

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [id]
    name: scenarios_pkey

governance:
  read: null
  write: data_edit_policies
  min_project_role: editor
  audited: true
  rls_enabled: true
  note: >-
    Tier 4 — the DECISION plane: what a person or an agent CHOSE, as against the dataset they
    chose it over and the result it produced. `result-binding` (I8) needs all three, which is
    why WP 6.3 keeps the results and this package takes the decisions. Audited from WP 6.4: the
    three statement-grain triggers land beside this sidecar, because `dataPlaneAudit.test.ts`
    scopes its rule to tables IN the contract and a deferred table's writes are unaudited with
    nothing to notice (D54). **This is the widest decision row in the product** — twenty-two
    columns, seven of them the engine reads directly — and it is the one a reproducibility
    record quotes rather than summarises, because a scenario summarised is a scenario that
    cannot be re-run. **Three settings are a name rather than an id** (`primary_kpi`,
    `time_step`, `warmup_mode`), which is legitimate for an enum and is the reason D113's KPI
    vocabulary mattered: a `primary_kpi` naming a measure the engine never emits is a scenario
    whose objective no run can report.

