# AUTHORED — the data contract's sidecar for `model_validation_evidence`.
table: model_validation_evidence
tier: "4"
schema_name: public
grain: >-
  The evidence one Validated Model rests on, kept beside it rather than summarised into
  it: per-KPI warm-up series and detector outputs, the replication analysis, the per-KPI
  tests, the face-validation statement and the evidence runs. One row per model, written
  with it, never edited (WP 10.3, §4 D243).
owner: policy-ui

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "model_validation_evidence_pkey"
  - source: "column UNIQUE"
    columns: [validation_id]
    name: "model_validation_evidence_validation_id_key"

governance:
  read: null
  write: simulation_lab
  min_project_role: analyst
  audited: true
  rls_enabled: true
  note: >-
    Written only by `_insert_validated_model`, inside the same transaction as its model;
    a BEFORE UPDATE trigger refuses every edit. Read through `has_project_access`, and by
    the browser through `get_validated_model_evidence`, which is no wider than the model
    row it belongs to (readable by every API role). Audited at statement grain.

