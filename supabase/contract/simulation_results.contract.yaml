# AUTHORED — the data contract's sidecar for `simulation_results`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md.
#
# WP 10.4 · `result-binding`. Described because a table the contract cannot see
# is a table every rule scoped to the contract cannot see (§4 D54), not because
# this one binds anything: it is a DORMANT result table of the retired batch
# pipeline, and saying so in the place a reader looks first is the point.
table: simulation_results
tier: "5"
schema_name: public
grain: >-
  One result of one run of the RETIRED batch pipeline (the "Legacy Sim" path:
  `simulation-runner` → `external-simulation-processor` → the Render-hosted
  `ml-service`), for one project, one plant and a set of legacy disruption
  profiles: a status and a `metrics` blob. Tier 5 — a result, input to nothing.
  DORMANT IN THE REPOSITORY: no code in `src/`, `supabase/functions/`,
  `sim-worker/` or `scsim/` reads or inserts it. The current product's results
  are `simulation_runs` + `run_replications`, which this table predates and
  which never write here.
owner: engine

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "simulation_results_pkey"

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    Two policies, both routed through the project's organization
    (`org_is_current_user_org(p.organization_id, p.organization)`, the WP 2.1
    dual-read shape): SELECT for any member of the project's organization, and
    ALL for the project's modeler or an organization admin. Neither is
    predicate-less, so `write: null` is consistent with
    `governanceEnforcement.test.ts` — and it is also the plain truth: no
    user-facing write path exists in the repository.
    THE ONLY STATEMENTS THAT STILL TOUCH IT ARE DELETES. `_delete_project_rows`
    (reached from `delete_project` and the organization and user deletions)
    sweeps it BY NAME, because it has no foreign key to `projects` and the
    cascade (§4 D117) cannot reach it. `admin_delete_project` does NOT go through
    that sweep — it deletes the project row alone — so a project a super admin
    deletes from /admin/projects leaves its rows here behind, unreachable: D117's
    class, on a table no screen reads. The SECURITY DEFINER
    readers and writers the legacy path used (`create_simulation_result`,
    `get_simulation_results`, `get_baseline_simulation_results`,
    `get_scenario_simulation_results`, `delete_simulation_result`,
    `delete_simulation_results_batch`, `seed_synthetic_simulation_data`) still
    exist in the database and have no caller in the repository; the two views
    over it (`simulation_results_with_settings`, `simulation_result_scenarios`,
    `security_invoker` since D38) have none either.
    NOT IN PRODUCTION'S CASE: §4 D168 read production's function list and found
    the legacy functions that wrote this table — `simulation-runner`,
    `external-simulation-processor`, `simulation-availability-checker`,
    `delete-simulation-job` — still LIVE there with no source in this
    repository. So "dormant" is a statement about the repository; whether
    anything still calls those endpoints is a production question (D168, WP 7.1).
    NOT AUDITED, and that is the tier rather than an omission: `audit-actor`
    covers tiers 2–4, and a result row is an input to nothing.

note: >-
  A RETIRED PIPELINE'S RESULT TABLE, LEFT IN PLACE ON PURPOSE. The commit that
  removed the legacy batch stack (2026-07-02, "Remove legacy simulation stack and
  ML service") deleted every reader and writer and left this table and its four
  siblings (`simulation_jobs`, `simulation_job_magnitudes`, `simulation_cache`,
  `simulation_performance_metrics`) "in place, inert, for a later cleanup
  migration". Described rather than dropped: a drop needs a production row count
  first, which no §15 run has taken for this table, and the live legacy functions
  (D168) are a reason to take it rather than assume zero. It binds none of
  dataset, policy, scenario or engine version, so it can never satisfy
  `result-binding` and nothing should begin reading it.

fields:
  id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Surrogate key. The legacy job row (`simulation_jobs.simulation_result_id`)
      pointed at it; nothing else identifies a result.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  project_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The owning project. NO foreign key — which is why the project deletion
      sweeps this table by name instead of letting a cascade do it.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  plant_name:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The plant the legacy run was scoped to, copied from the project's own
      `plant_name` when the result was written. A name, not a key — the
      pipeline that read it predates `uuid-identity`.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  scenario_ids:
    type: "uuid[]"
    unit: null
    unit_source: none
    meaning: >-
      The legacy disruption scenarios the run applied — ids of
      `disruption_scenario_profiles`, which is what `simulation_result_scenarios`
      explodes this array against. NOT `scenarios` ids: the current scenario
      table is a different thing with a different key space.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      An array of ids with no foreign key, so a deleted profile leaves a
      dangling element behind. Not repaired: nothing reads it.
  status:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      Lifecycle of the legacy result — DEFAULT 'pending'; the processor wrote
      the external service's own status ('completed' or otherwise). No CHECK
      constraint, so the vocabulary was the writer's convention.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  result_data:
    type: "jsonb"
    unit: null
    unit_source: derived
    meaning: >-
      A free-form payload slot for the legacy run's output. The retired
      `ml-service` wrote it on its own direct insert path and 2025-09 seed
      migrations filled it with synthetic demo data; `external-simulation-processor`
      did NOT — it folded the service's payload into `metrics` instead, so which
      of the two columns holds a legacy row's output depends on which path wrote
      the row.
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED to scsim, because scsim never produced it — the producer was
      the retired `ml-service`, whose source left this repository with the
      legacy stack. Its shape is whatever that service returned.
  metrics:
    type: "jsonb"
    unit: null
    unit_source: derived
    meaning: >-
      The legacy run's KPI blob, as `external-simulation-processor` transformed
      the external service's response. Units were per-key and defined by a
      service that no longer exists in this repository.
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED to scsim: the legacy engine produced it, not the strategic
      one. Several 2025-09 migrations also seeded synthetic rows here, tagged
      with a `seed_tag` key, so a row's presence is not evidence that any
      simulation ran. Nothing should read these as results.
  started_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: "When the legacy run began, as the writer stamped it."
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  completed_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: "When the legacy run completed. Null for a run that did not."
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  created_by:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The approved user who started the legacy run, copied from the job row.
      No foreign key.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  organization:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The organization's NAME at write time, DEFAULT 'default_org'. Legacy
