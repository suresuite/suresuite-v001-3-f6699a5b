# AUTHORED — the data contract's sidecar for `tier2_suppliers`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: tier2_suppliers
tier: "2"
schema_name: public
grain: >-
  One tier-2 supply relationship: a direct supplier of this project's plant
  and the supplier BEHIND it, for one material. The row is an EDGE, not a
  party — the same supplier appears in as many rows as it has upstream
  sources.
ingest_dataset:
  wizard_id: tier2_suppliers
  fact_class: transactional
  server_set: [project_id, plant_name]
owner: data-ingestion

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "tier2_suppliers_pkey"
  # WP 3.3 — `20260916000018`. THE KEY `natural_key_intended` HAS NAMED SINCE
  # WP 1.4, now enforced. `NULLS NOT DISTINCT` is part of the constraint and not
  # a detail: PostgreSQL's default makes NULLs distinct, so a plain index would
  # constrain every row except the ones whose key column is null — and
  # `ON CONFLICT` infers from the same index, so the promotion would INSERT a
  # duplicate instead of updating exactly those rows (§4 D5).
  - source: "UNIQUE index (NULLS NOT DISTINCT)"
    columns: [project_id, plant_name, supplier_id, upstream_supplier_id, material_id]
    name: "tier2_suppliers_natural_key"
natural_key_intended: [project_id, plant_name, supplier_id, upstream_supplier_id, material_id]

governance:
  read: null
  write: null
  min_project_role: editor
  audited: true
  rls_enabled: true
  note: >-
    Two policies, both routed through the project's organization —
    `org_is_current_user_org(p.organization_id, p.organization)` for SELECT and
    the same predicate plus modeler-or-admin for writes. It is the dual-read
    shape WP 3.0 made uuid-only at the predicate (D29); the one remaining text
    branch is `organizations`' own read policy (D47, WP 6.2), not this one.
    `audited: true` SINCE WP 3.2, and the sequence is worth keeping. WP 2.3
    instrumented twelve tier-2/3/4 tables and this was not among them, because
    nothing in the contract described it: `dataPlaneAudit.test.ts` requires the
    three triggers on every tier-2/3/4 table IN THE CONTRACT, so a table with no
    sidecar was outside the rule and nobody could see that its writes were
    unattributable. Writing this sidecar turned that gate red in the same
    session, and `20260916000016` is the gate being obeyed rather than a decision
    taken. It matters here more than most: `ingest_apply_run` promotes a CSV into
    this table, and a promotion into an unaudited table is the `audit-actor` hole
    this package exists to close.

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      Surrogate key. Not the grain — D5's signature, the same as the four lane
      tables: the row that means something is the supplier/upstream/material
      triple, and nothing enforces it.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  project_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The project this relationship belongs to. Set by the server from the
      selected project; the CSV never carries it (G1 — a project is referenced
      by uuid, never by a name the user typed).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "set from the selected project, never from the CSV"}
    surfaces: []
    resolution: null
  plant_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The project's plant, copied onto every row. A denormalization the schema
      has carried since 2025 and a trigger enforces:
      `ensure_dataset_plant_matches_project` refuses a row whose plant disagrees
      with its project's.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "must equal the project's plant_name — a trigger raises otherwise"}
    surfaces: []
    resolution: null
  supplier_id:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The DOWNSTREAM party of this relationship, as the user's own systems spell
      it — the direct supplier whose own supplier is named beside it.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: supplier_id
      required: true
      validate: "non-empty after trim"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  upstream_supplier_id:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The UPSTREAM party — who supplies `supplier_id`. The direction is what
      makes the row a tier-2 fact rather than a tier-1 one, and it
      is the column a reader most often has backwards.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: upstream_supplier_id
      required: true
      validate: "non-empty after trim"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  material_id:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      What flows along the relationship. NULLABLE, and the NULL is meaningful:
      it says the relationship is known but what it carries is not.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: material_id
      required: true
      validate: "non-empty after trim"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  relationship_type:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      How the two parties are related, in the user's own vocabulary. NOT a closed
      set: no CHECK constrains it and no code branches on it, so it is a label a
      person reads and nothing else.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: relationship_type
      required: true
      validate: "free text; no closed vocabulary exists for it"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  volume:
    type: numeric
    unit: units per `time_unit`
    unit_source: column
    unit_column: time_unit
    meaning: >-
      How much moves along the relationship over one `time_unit`. A RATE, like
      the lane tables' `volume`, and comparable across rows only after both are
      converted to the same period.
    grain: rate
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: volume
      required: false
      validate: "numeric >= 0; blank lands no value, never 0 (D7)"
      rule: {kind: numeric, min: 0, blank: "null"}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED into the simulation engine. `scsim` models one tier of supply;
      these rows are read by the network pages, not by `project_map.py`. Recorded
      so that nobody reads the shared column name as a shared code path.
  unit_price:
    type: numeric
    unit: currency per unit
    unit_source: none
    meaning: >-
      Price per unit of `material_id` along this relationship, in the project's
      own currency — which no column names anywhere in this schema.
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: unit_price
      required: false
      validate: "numeric > 0; blank lands no value"
      rule: {kind: numeric, exclusive_min: 0, blank: "null"}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED into the simulation engine, for the same reason `volume` is not:
      `scsim` models one tier of supply. The price of a tier-2 purchase reaches no
      cost term in the engine today.
  lead_time:
    type: numeric
    unit: weeks
    unit_source: fixed
    meaning: >-
      How long the upstream party takes to deliver. WEEKS by omission rather than
      by contract — unlike `inbound_logistics`, this table has NO
      `lead_time_unit` column, so there is nothing to say otherwise (the D9 shape,
      one table later).
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: lead_time
      required: false
      validate: "numeric > 0; blank lands no value"
      rule: {kind: numeric, exclusive_min: 0, blank: "null"}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED into the simulation engine. It is a number the network pages
      display and nothing computes with — which is worth saying plainly, because
      a column named `lead_time` beside one the engine DOES read
      (`inbound_logistics.lead_time`) invites the assumption that both are inputs.
  time_unit:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The period `volume` is quoted over — day, week, month, quarter or year. It
      describes the VOLUME only and has never applied to `lead_time`.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: time_unit
      required: false
      validate: "one of the units public.unit_days() knows; blank means weeks"
      rule: {kind: unit, blank: "null"}
    surfaces: []
    resolution: null
    note: >-
      D46 is about this column's twin in `inbound_logistics` — 27 production
      values that are integers, every one read as weekly. The rule above is what
      refuses that token here rather than coercing it.
  created_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: When the row was written. Server-stamped.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  updated_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: When the row was last written. Server-stamped by trigger.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null

note: >-
  DESCRIBED IN PHASE 3 / WP 3.2, having been deferred under WP 3.1's group since
  WP 1.4. The deferral said these were "the other inbound datasets, each with its
  own bespoke upload path", and this package is the one that gives them the
  shared one: a tier2_suppliers CSV is now parsed server-side, landed in tier 0, staged in
  `ingest_staged_rows` and promoted by `ingest_apply_run` like any other lane.
  WHAT IS STILL TRUE AND UNCOMFORTABLE: the table has no natural-key constraint
  (D5's shape, WP 3.3) and no audit trigger (WP 2.3 instrumented twelve tables
  and could not instrument one the contract did not describe). Both are recorded
  above rather than rounded off, because a sidecar that describes the table it
  wishes existed is worth less than none.
