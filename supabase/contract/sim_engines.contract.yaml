# AUTHORED — the data contract's sidecar for `sim_engines`.
# WP 10.4 · §4 D245. Edit this file; docs/data/tables/*.md is generated from it.
table: sim_engines
tier: reference
schema_name: public
grain: >-
  One row per simulation engine the platform knows: whether dispatch may use it
  (`status`) and which build the worker last reported running. scsim is the one
  active engine; the legacy worker engine is registered RETIRED — it stays frozen
  (CLAUDE.md's standing law) and is never offered. A run row names its engine
  (`simulation_runs.engine_id`) and the build is part of its RunKey.
owner: engine

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "sim_engines_pkey"
  - source: "table constraint 20261001000009_engines_runkey.sql"
    columns: [slug]
    name: "sim_engines_slug_key"

natural_key_intended: [slug]

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    A registry, not project data: read by everyone through `sim_engines_read`
    (`USING (true)`, select only), written by no API role. Rows are seeded by the
    migration; the one runtime writer is `sim_engine_report`, executable by the
    service role alone (the worker, at boot), which updates the row the worker
    runs and never creates one. Not audited: a reference table whose rows change
    by migration, and whose one runtime write is a build report stamped with
    `reported_at`.

surfaces:
  - page: "SimulationLab.tsx"
    via: "hook useSimEngines → select active rows from sim_engines (the Engine step, WP 10.5)"
    grain: table
    evidence: "src/hooks/useSimEngines.ts:25"
    confirmed: true

