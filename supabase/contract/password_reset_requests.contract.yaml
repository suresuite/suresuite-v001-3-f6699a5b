# AUTHORED — the data contract's sidecar for `password_reset_requests`.
table: password_reset_requests
tier: G
schema_name: public
grain: >-
  One "Forgot password?" request for one account, from the moment the person asks
  until a super admin resets the password or dismisses the request (PLAN.md §4 D233).
owner: platform

natural_key_unique:
  - source: column PRIMARY KEY
    columns: [id]
    name: password_reset_requests_pkey
  - source: "unique index 20261001000006_password_reset_requests.sql"
    columns: [user_id]
    name: password_reset_requests_one_open
# The second is PARTIAL — `WHERE status = 'open'`: at most one open request per
# account, and any number of closed ones. It is what makes a repeated request add
# nothing (`ON CONFLICT … DO NOTHING` in `request_password_reset`).

governance:
  read: super_admin
  write: super_admin
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    RLS on, NO policy and no table grant: which accounts asked for a reset is not one
    PostgREST query away. The one writer for a NEW row is `request_password_reset(p_email)`,
    callable by anyone signed out — it records a row only for an ACTIVE account, at most
    one open per account, and answers identically in every case so it cannot be used to
    discover which emails exist; it writes an access-plane `auth.password_reset_requested`
    audit row naming the account as TARGET and no actor, because whoever typed the email
    is not proven to be its holder. A request changes nothing about the account. Super
    admins list open requests through `admin_list_password_reset_requests`, close one as
    `dismissed` through `admin_dismiss_password_reset_request`, and `admin_reset_user_password`
    closes the account's open request as `resolved`; both write an `admin_audit_logs` row.
    The super admin's identity is client-asserted (§4 D28).

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      Surrogate id, `gen_random_uuid()`.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  user_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The account the request is for — the active `approved_users` row whose email was typed. Deleting the account deletes its requests (`ON DELETE CASCADE`).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  status:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      `open` until a super admin acts; then `resolved` (the password was reset) or `dismissed` (the request was not genuine, or was handled another way). CHECK-constrained, and `closed_at` is set exactly when the status is not `open`.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "open | resolved | dismissed"}
    surfaces: []
    resolution: null
  requested_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: >-
      When the person asked. Server-stamped.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  closed_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: >-
      When a super admin resolved or dismissed the request; NULL while it is open.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  closed_by:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The super admin who closed it; NULL while open, or once that account is deleted (`ON DELETE SET NULL`).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
