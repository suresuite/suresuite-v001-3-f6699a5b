    note: >-
      Half of D13. A displayable, editable, non-unique string used as a join key.
      It is kept, not dropped: `organization_id` is nullable and the rows D27 left
      unstamped have nothing else to authorize on. Every live comparison now goes
      through `org_is_current_user_org(uuid, text)`, so when §15 confirms the
      backfill at 100 % the text branch is removed from one function body rather
      than from 107 call sites.
  organization_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The account's ACTIVE organization, by uuid — the one it is working in now, the
      same organization `organization` names, and the plane that survives a rename.
      What `get_current_user_org_id(_user_id)` returns, and therefore what every
      org-scoped RLS policy reads and what a new project is stamped with. Since §4 D210
      an account may BELONG to several organizations (`organization_members`, the
      authority for membership) and this column is always one of them — NULL exactly
      when it belongs to none. Setting it adds the membership if missing; the account
      changes it itself through `switch_my_organization`, and sign-in moves it to a
      current membership when the active one's access period has ended. The
      `organization` text copy follows it (`trg_approved_users_track_active_org`).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      NULLABLE, and rows are genuinely NULL here. It was added and backfilled once
      by `20260709000002`; WP 2.1 re-ran the backfill matching on `name` OR `slug`
      and leaving ambiguous matches alone rather than picking one. A row whose
      text org matches no organization — `'default_org'`, or a tenant renamed and
      re-typed — stays NULL and keeps working on the text branch. How many is a
      §15 question; no work-package session can reach the database.
  display_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
