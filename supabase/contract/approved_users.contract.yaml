      The account holder's full name, as entered when the account was approved.
      Their identity for accountability: its owner cannot change it (§4 D209) —
      `update_own_profile` has no parameter for it — and only the administrator
      paths write it. `first_name` / `last_name` are a reading of it.
    grain: metadata
