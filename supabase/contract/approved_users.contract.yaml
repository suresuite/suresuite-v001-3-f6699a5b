      "User name" on /profile, and the one name its owner can change (§4 D209).
      It never replaces `name` as the account holder's identity.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
