  is_active:
    type: boolean
    unit: null
    unit_source: none
    meaning: >-
      Whether the account may sign in. Enforced by the SERVER since `20260929000002`
      (§4 D205): `authenticate_approved_user` returns no row for a suspended account
      and records `auth.sign_in_failed` with the reason, and `_assert_super_admin`
      refuses a suspended super admin. The browser also checks it through
      `get_my_profile` at login and on every reload — a check that, until §4 D206,
      raised for every user and was ignored, so before these two changes the column
      was set and never read. It is not consulted by any RLS policy, so between
      reloads a suspended user's open session is not revoked (D28's client-asserted
      identity).
    grain: metadata
