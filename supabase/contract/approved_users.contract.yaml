note: >-
  The table WP 1.4 found existed in production but in no migration — the
  authentication table, untracked for a year, discovered by the orphan rule
  (D4). `20250815000000_approved_users_base.sql` now builds it on a fresh
  database, and the parts of that file which are reconstruction rather than
  evidence are marked as such in it. This sidecar describes the table as the
  migrations now define it.
