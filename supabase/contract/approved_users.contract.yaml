    type: boolean
    unit: null
    unit_source: none
    meaning: >-
      Whether the user must set a new password before continuing. Set when an
      administrator creates or resets an account; cleared by `change_own_password`.
      Enforced by `RoleGuard`, which could not see it until §4 D206.
    grain: metadata
