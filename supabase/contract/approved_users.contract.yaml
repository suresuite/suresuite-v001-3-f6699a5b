    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: >-
      When the current password expires — `now() + password_max_age()` (90 days)
      when the password was last set. Expiry does not refuse a sign-in: it sends the
      user to /profile and closes every other page until the password is changed
      (`RoleGuard`, reading `get_my_profile`'s server-computed `password_expired`;
      §4 D206). Rows that predate `20260527011429` were stamped by that migration's
      column default, not by a real password change.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions:
