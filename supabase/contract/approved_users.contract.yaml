  first_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The first word of `name` (§4 D209), derived by the
      `approved_users_derive_name_parts` trigger on every write that names `name`
      or either part, so a value written into it directly is overwritten. Shown
      read-only on /profile; changed only by an administrator changing `name`.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions:
