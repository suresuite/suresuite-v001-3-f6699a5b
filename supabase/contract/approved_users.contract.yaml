  last_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      `name` after its first word (§4 D209); NULL when the name is one word.
      Derived with `first_name` by the same trigger, read-only on /profile.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions:
