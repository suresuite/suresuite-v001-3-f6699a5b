# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md.
table: approved_users
tier: G
schema_name: public
grain: >-
  One person who may sign in. This is the authentication table: the product does
  not use Supabase Auth for its own users, so a row here IS an account —
  credential, role, tenant and profile in one.
owner: platform

