# AUTHORED — the data contract's sidecar for `multi_tier_supply_chain`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: multi_tier_supply_chain
tier: "2"
schema_name: public
grain: >-
  One directed firm-to-firm relationship in a project's multi-tier network: who
  supplies whom, at what depth, and in what capacity. An EDGE between two firm
  identifiers — not a party, and not a material flow: nothing here says what
  moves along it or how much.
owner: data-ingestion

natural_key_unique:
  - source: column PRIMARY KEY
    columns: [id]
    name: multi_tier_supply_chain_pkey

natural_key_intended: [project_id, plant_name, from_firm_id, to_firm_id]

governance:
  read: null
  write: null
  min_project_role: editor
  audited: true
  rls_enabled: true
  note: >-
    Two policies through the project's organization, the same pair
    `tier2_suppliers` carries: `org_is_current_user_org(p.organization_id,
    p.organization)` for SELECT, and the same predicate plus modeler-or-admin for
    writes. `audited: true` SINCE WP 3.2. No trigger existed before it, because WP 2.3
    instrumented the tables the contract DESCRIBED and this was not one of them —
    the qualifier in `dataPlaneAudit.test.ts` is exactly the hole, and writing
    this sidecar is what made it visible. `20260916000016` adds the three
    triggers. On a table nothing writes they will never fire, which is the point:
    the rule is about every tier-2 table, not about the ones that happen to be
    busy.

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      Surrogate key. Not the grain: the row that means something is the
      from/to pair within a project.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  project_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: The project this edge belongs to, by uuid (G1).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "set by the writer from the project, never from a file"}
    surfaces: []
    resolution: null
  plant_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The project's plant, copied onto every row and enforced by
      `ensure_dataset_plant_matches_project`.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "must equal the project's plant_name — a trigger raises otherwise"}
    surfaces: []
    resolution: null
  from_firm_id:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The firm the edge points FROM, as the user's own systems spell it. A text
      identifier with no referential integrity to anything — there is no firm
      table for it to point at.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "non-empty; NOT NULL at the column"}
    surfaces: []
    resolution: null
  to_firm_id:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The firm the edge points TO. Direction is the whole content of the row and
      nothing in the schema defends it: swapping the two columns produces a valid
      row that says the opposite thing.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "non-empty; NOT NULL at the column"}
    surfaces: []
    resolution: null
  to_firm_tier:
    type: integer
    unit: null
    unit_source: none
    meaning: >-
      How many hops from the project's own plant the TO firm sits — 1 for a
      direct supplier, 2 for its supplier, and so on. NULLABLE, and a NULL says
      the depth was never established rather than that it is zero.
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "integer >= 1 where present"}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED into the simulation engine, and nothing else reads it either —
      see the table note. `scsim` models one tier of supply; a depth number has
      nowhere to go.
  to_firm_relationship:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      What the TO firm is to the FROM firm, in the user's own words. No CHECK, no
      closed vocabulary, no code that branches on it.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "free text"}
    surfaces: []
    resolution: null
  created_at:
    type: timestamp with time zone
