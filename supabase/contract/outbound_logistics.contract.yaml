# AUTHORED — the data contract's sidecar for `outbound_logistics`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: outbound_logistics
tier: "2"
schema_name: public
grain: >-
  One demand arc as the user uploaded it: this customer buys this product from
  this plant, at this price and lead time, in this volume. UNIQUE on
  `natural_key_intended` since WP 3.3 (`20260916000018`): a second upload of the
  same arc UPDATES it rather than adding a row (D5 closed).
ingest_dataset:
  wizard_id: outbound_logistics
  fact_class: transactional
  server_set: [project_id, plant_name]
owner: data-ingestion

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "outbound_logistics_pkey"
  # WP 3.3 — `20260916000018`. THE KEY `natural_key_intended` HAS NAMED SINCE
  # WP 1.4, now enforced. `NULLS NOT DISTINCT` is part of the constraint and not
  # a detail: PostgreSQL's default makes NULLs distinct, so a plain index would
  # constrain every row except the ones whose key column is null — and
  # `ON CONFLICT` infers from the same index, so the promotion would INSERT a
  # duplicate instead of updating exactly those rows (§4 D5).
  - source: "UNIQUE index (NULLS NOT DISTINCT)"
    columns: [project_id, plant_name, customer_id, product_id]
    name: "outbound_logistics_natural_key"
# The key the grain implies and the database does NOT enforce (D5); WP 3.3 lands
# it. Mirrors `inbound_logistics`, with customer/product where that has
# supplier/material.
natural_key_intended: [project_id, plant_name, customer_id, product_id]

surfaces:
  - page: "DataManager.tsx"
    via: "rpc get_project_dataset_status"
    grain: table
    evidence: "src/pages/DataManager.tsx:430"
    confirmed: true
  - page: "ProjectPolicies.tsx"
    via: "rpc ensure_item_masters"
    grain: table
    evidence: "src/hooks/useItemMasters.tsx:244"
    confirmed: true
  - page: "SimulationLab.tsx"
    via: "rpc ensure_item_masters"
    grain: table
    evidence: "src/hooks/useItemMasters.tsx:244"
    confirmed: true

governance:
  read: null
  write: "data_editing"
  min_project_role: editor
  # WP 2.3 created `audit_<table>_insert/update/delete`, three AFTER … FOR EACH
  # STATEMENT triggers calling `audit_tier_write`. This flag said `false` for
  # every one of the twelve tables it audited, and the generated page published
  # that as "Tier transitions audited: no" (D40). `contract:check` R9 now
  # compares this field against the live triggers, so it cannot drift again.
  audited: true
  rls_enabled: true
  note: >-
    `write` names the capability that exists today. WP 2.2 splits `data_editing`
    into `data_edit_inputs` (tier 2) and `data_edit_policies` (tier 4); this row
    becomes `data_edit_inputs` then, and all twelve sidecars change together.

fields:
  id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Surrogate row identifier. Carries no meaning and joins to nothing.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  project_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The project this row belongs to. Every read is scoped by it.
    grain: identifier
    engine:
      consumed_by: "datamap.py::rows -> per-project fetch"
      transform: "filter, never read as a value"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: "set from the selected project, never from the CSV"
    surfaces: []
    resolution: null
  plant_name:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The focal plant this row belongs to, by NAME. A displayable string used as a
      join key — the thing invariant G1 forbids; WP 2.1/3.3 replace it with a
      uuid.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions:
      - when: "the CSV omits it"
        value: "the selected project's `projects.plant_name`"
        provenance: derived
        visible_as: null
    ingest:
      csv_header: null
      required: false
      validate: "must equal the project's plant_name — a trigger raises otherwise"
    surfaces: []
    resolution: null
  customer_id:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The customer's code as the user's own systems spell it.
    grain: identifier
    engine:
      consumed_by: "project_map.py::_map_demand -> customer node id"
      transform: "str(); no trimming (D8)"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "customer_id"
      required: true
      validate: "non-empty after trim — NOT enforced today (D8)"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  product_id:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The finished product's code as the user's own systems spell it. Joins to
      products and the BOM.
    grain: identifier
    engine:
      consumed_by: "project_map.py::_map_demand -> ProductRow lookup"
      transform: "str()"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "product_id"
      required: true
      validate: "non-empty after trim — NOT enforced today (D8)"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  volume:
    type: "numeric"
    unit: "units per `time_unit`"
    unit_source: column
    unit_column: time_unit
    normalize_at_promotion: {conversion: rate, canonical: week}
    meaning: >-
      How much of this product the customer takes over one `time_unit`. A RATE,
      not a quantity — two rows are only comparable after both are converted to
      the same period.
    grain: rate
    engine:
      consumed_by: "project_map.py::_map_demand -> demand mode when `products.demand_mean` is unset"
      transform: "rateToWeekly(volume, time_unit) — normalized to weeks"
      missing_default: "0 (the arc carries no demand)"
    substitutions: []
    ingest:
      csv_header: "volume"
      required: true
      validate: "numeric >= 0; blank becomes NULL, not 0 (D7)"
      rule: {kind: numeric, min: 0, blank: reject}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        Volume is what the user's own systems recorded. It is not estimated; it is
        the thing other quantities are estimated FROM — demand_mean names it in
        estimable_from.
  time_unit:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The period `volume` is quoted over — day, week, month, quarter, year — and,
      since WP 14.2, the period of the row's `demand_mean`, `demand_min` and
      `demand_max` too. It says nothing about `expected_lead_time`.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_duration_to_weeks (via UNIT_DAYS)"
      transform: "looked up in the one unit table"
      missing_default: "weekly"
    substitutions:
      - when: "blank or unrecognised"
        value: "treated as weekly"
        provenance: default
        visible_as: null
    ingest:
      csv_header: "time_unit"
      required: false
      validate: "one of day/week/month/quarter/year and their -ly spellings"
      rule: {kind: unit, blank: "null"}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        A unit is never estimated. Unrecognised or blank is read on a 7-day basis,
        i.e. as already weekly (grading.ts::rateToWeekly).
  expected_lead_time:
    type: "numeric"
    unit: "weeks"
    unit_source: fixed
    meaning: >-
      How long the customer expects to wait for this product. The contract fixes
      the unit at WEEKS; `time_unit` does not apply to it.
    grain: level
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "expected_lead_time"
      required: true
      validate: "numeric > 0"
      rule: {kind: numeric, exclusive_min: 0, blank: reject}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED. `expected_lead_time` appears in no read in project_map.py or
      datamap.py — datamap's outbound projection selects product_id, customer_id,
      unit_price, volume, time_unit and nothing else, so the column never leaves
      the database. Recorded as null rather than guessed. It is a deletion
      candidate for this WP's gap check; do not delete it here.
  unit_price:
    type: "numeric"
    unit: "currency per unit of product"
    unit_source: fixed
    meaning: >-
      What the customer pays for one unit of this product.
    grain: level
    engine:
      consumed_by: "project_map.py::_map_demand -> ProductRow.sell_price when the master is unset; and (WP 14.3) CustomerLink.unit_price, the row's own price under `revenue_max` and in its fill rates"
      transform: "demand-weighted mean across this product's outbound arcs (the product's price); as is for the row's price, which a Customer-row `price` override beats"
      missing_default: "the engine's ENGINE_DEFAULT_PRICE"
    substitutions:
      - when: "`products.sell_price` is unset for this product"
        value: "the demand-weighted mean of this product's outbound unit_price"
        provenance: derived
        visible_as: "the effective-economics badge in /policies"
    ingest:
      csv_header: "unit_price"
      required: true
      validate: "numeric > 0"
      rule: {kind: numeric, exclusive_min: 0, blank: reject}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        hybrid is NULL because scsim has nowhere to put a spread: cost and
        unit_price are bare floats on Material and Product, with no distribution,
        no CV and no sampling path anywhere in the engine. Recording `hybrid:
        null` here is a statement about the ENGINE, not about the world — prices
        obviously vary. Giving them a spread is an engine change on the scsim
        track; see the RFC in PLAN.md §14. Do not invent one in this contract: a
        contract that describes a capability the engine does not have is how a
        fallback ends up in code with no contract entry, which is what I6 forbids
        in the other direction.
    note: >-
      The user types `unit_price`; the engine field it feeds is `sell_price` on
      the product, and inside scsim it is `unit_price` again on the product model.
      The manual leads with the CSV header (D21).
  demand_distribution:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The SHAPE of this customer × product row's weekly demand — deterministic,
      normal, triangular, triangular_av or poisson (PLAN.md §24 WP 14.2, ADR 0002
      decision 2). Blank: the row takes its product's distribution, scaled by its
      share of the product's volume, which is how every project ran before Phase 14.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_row_demand_spec -> CustomerLink.demand_model"
      transform: "lower-cased; `triangularAV` spellings → triangular_av; an unknown value is warned and the row keeps its product's distribution"
      missing_default: "the product's distribution × the row's volume share"
    substitutions:
      - when: "blank"
        value: "the product's own distribution, scaled by the row's share of the product's outbound volume"
        provenance: derived
        visible_as: "the Customer table's distribution cell on /policies"
    ingest:
      csv_header: "demand_distribution"
      required: false
      validate: "one of deterministic, normal, triangular, triangular_av, poisson; blank lands nothing"
      rule: {kind: enum, values: [deterministic, normal, triangular, triangular_av, poisson], blank: "null"}
    surfaces: []
    resolution: null
  demand_mean:
    type: "numeric"
    unit: "units per time_unit"
    unit_source: column
    unit_column: time_unit
    normalize_at_promotion: {conversion: rate, canonical: week}
    meaning: >-
      This row's mean demand — the MODE for a triangular row, as
      `products.demand_mean` is a product's. A RATE in the row's `time_unit`,
      weekly after promotion. With a forecast series it is the value the plan uses
      past the series' end.
    grain: rate
    engine:
      consumed_by: "project_map.py::_row_demand_spec -> CustomerLink.demand_mean"
      transform: "rateToWeekly(demand_mean, time_unit) — normalized to weeks at promotion"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "demand_mean"
      required: false
      validate: "numeric >= 0; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: "null"}
    surfaces: []
    resolution: null
  demand_variation:
    type: "numeric"
    unit: "dimensionless — read by the distribution"
    unit_source: fixed
    meaning: >-
      How much the row's weekly demand varies, READ BY ITS DISTRIBUTION: for
      `normal` it is the coefficient of variation (σ = variation × centre); for
      `triangular_av` it is the ± fraction of the centre (0.3 → 70…130 around
      100). Deterministic, poisson and triangular (whose bounds are explicit)
      ignore it.
    grain: level
    engine:
      consumed_by: "project_map.py::_row_demand_spec -> CustomerLink.demand_variation"
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "demand_variation"
      required: false
      validate: "numeric >= 0; triangular_av needs <= 1; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: "null"}
    surfaces: []
    resolution: null
  demand_min:
    type: "numeric"
    unit: "units per time_unit"
    unit_source: column
    unit_column: time_unit
    normalize_at_promotion: {conversion: rate, canonical: week}
    meaning: >-
      A triangular row's lower bound — a rate in the row's `time_unit`, weekly
      after promotion. Read by `triangular` only.
    grain: rate
    engine:
      consumed_by: "project_map.py::_row_demand_spec -> CustomerLink.demand_min"
      transform: "rateToWeekly(demand_min, time_unit)"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "demand_min"
      required: false
      validate: "numeric >= 0; triangular only; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: "null"}
    surfaces: []
    resolution: null
  demand_max:
    type: "numeric"
    unit: "units per time_unit"
    unit_source: column
    unit_column: time_unit
    normalize_at_promotion: {conversion: rate, canonical: week}
    meaning: >-
      A triangular row's upper bound — a rate in the row's `time_unit`, weekly
      after promotion. Read by `triangular` only.
    grain: rate
    engine:
      consumed_by: "project_map.py::_row_demand_spec -> CustomerLink.demand_max"
      transform: "rateToWeekly(demand_max, time_unit)"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: "demand_max"
      required: false
      validate: "numeric >= 0; triangular only; blank lands nothing"
      rule: {kind: numeric, min: 0, blank: "null"}
    surfaces: []
    resolution: null
  created_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the row was inserted. Server-set.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  updated_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the row last changed. Server-set.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  ingest_run_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The ingestion run that last wrote this row (WP 3.3), and through it the
      project, the source kind and who approved the promotion. NULL for every
      row that predates the CSV landing path, and for rows whose run has since
      been deleted — a null here means the provenance is UNKNOWN, never that
      there was none. Set by `ingest_apply_run` and by nothing else.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
  source_row_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The tier-1 staged row this was promoted from (WP 3.3). Its
      `source_row_number` is the physical line of the uploaded file, header =
      line 1, so a person can be shown the line rather than told a file name —
      which is what extends A4 down to the source. `ON DELETE SET NULL` and
      DEFERRABLE: staging is deleted with its run, and a canonical row belongs to
      the project rather than to the run that last wrote it.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
