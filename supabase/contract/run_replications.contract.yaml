# AUTHORED — the data contract's sidecar for `run_replications`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
#
# WP 9.1 · G19. Described for the first time here, and for a reason narrower than
# "the deferral was stale": this package adds facts TO this table. The inventory
# series a user now reads on /policies and /simulation-lab live in `time_series`,
# and a fact the product depends on cannot sit in a column the contract does not
# describe. The `single-source` gate stops at markdown (§4 D101), and `time_series`
# is exactly the shape that defeats it — a jsonb blob whose KEYS are the schema.
# So the key vocabulary is NOT restated here: it is scsim's `WEEKLY_SERIES`, and
# `deriveReplicationSeries` reads that declaration to publish it.
#
# The other eight tables in the WP 6.3 deferral group stay deferred — see
# `scripts/data-contract/coverage.yaml`. They are re-homed rather than described,
# because `result-binding` is what they owe and this package does not pay it.
table: run_replications
tier: "5"
schema_name: public
grain: >-
  One replication of one simulation run: the seed it used, the KPI row the
  engine computed for it, and its weekly series. A run has as many rows here as
  it has replications, and `rep_index` orders them. Tier 5 — a RESULT, derived
  from a tier-2 dataset by a named engine version, never an input to anything.
  Nothing downstream reads it except the result surfaces; a row is superseded
  by re-running, never edited.
owner: engine
natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "run_replications_pkey"
  - source: "table constraint 20260607121406_fcbd47e9-93de-4b3b-988f-7f4718159c91.sql"
    columns: [run_id, rep_index]
    name: "rep_run_index_uq"
  # TWO unique indexes on the SAME columns, from two migrations seven days
  # apart. `20260614000001_item_master.sql` re-declared under a different name
  # what `20260607121406` had already created, and `IF NOT EXISTS` keys on the
  # NAME, not on the columns — so the guard passed and the database carries
  # both. Harmless (they enforce the same rule) but not free: every write pays
  # for two index maintenances, and `ingest_apply_run` reads its conflict
  # arbiter from `pg_index`, where two candidates now match. Recorded rather
  # than dropped — dropping it is a migration, and this package's subject is
  # the inventory series (§16 · WP 9.1 · gap check).
  - source: "table constraint 20260614000001_item_master.sql"
    columns: [run_id, rep_index]
    name: "run_replications_run_rep_uniq"

natural_key_intended: [run_id, rep_index]

governance:
  read: null
  write: "simulation_lab"
  min_project_role: viewer
  audited: false
  note: >-
    `write: simulation_lab` is the capability that gates the only user-facing
    action which writes this table — running a simulation. It is NOT `null`,
    and the first draft of this sidecar said it was: `analysis_runs` can claim
    `write: null` because it has no write policy at all and every write goes
    through a SECURITY DEFINER RPC, but this table is written by the BROWSER,
    as a PostgREST upsert from `pyodideEngine.persistEngineResult`, behind two
    predicate-less policies (`rep_auth_all` and `run_replications_anon_write`).
    `governanceEnforcement.test.ts` refused the `null` claim on exactly that
    evidence, and it was right: a policy with no predicate permits any holder
    of the table grant to write, which is a user-facing write path whether or
    not a page uses it.
    So the capability is declared and the exposure is stated rather than
    implied: this is one of the eleven tables §4 D154 measured as genuinely
    writable from the browser's `anon` role. That is D28's standing decision
    (document, do not change) and WP 7.1's to close — `min_project_role` is
    `viewer` because nothing here enforces a role today, not because a viewer
    ought to be able to write results.
    NOT AUDITED, and that is the tier rather than an omission: the audit rule
    (`audit-actor`) covers tiers 2, 3 and 4, where a write changes the world a
    later run will see. A replication row is the OUTPUT of one run and an input
    to nothing; re-running writes new rows rather than mutating these, so there
    is no tier transition here for an audit row to name.

surfaces:
  - page: "ProjectPolicies.tsx"
    via: "hook useSimulationRun → select * from run_replications"
    grain: table
    evidence: "src/hooks/useSimulationRun.tsx:121"
    confirmed: true
    note: >-
      Both result surfaces reach this table through the SAME hook, so the
      evidence is the hook's read rather than either page's render. Run &
      Validate reads every replication of the newest run: the weekly series
      charts, the financial statement, the per-seed explorer and the inventory
      chart all render from these rows.
  - page: "SimulationLab.tsx"
    via: "hook useSimulationRun::loadReps → select * from run_replications"
    grain: table
    evidence: "src/hooks/useSimulationRun.tsx:239"
    confirmed: true
  - page: "ProjectPolicies.tsx"
    via: "useVerifiableExports → select * from run_replications"
    grain: table
    evidence: "src/hooks/useVerifiableExports.tsx:218"
    confirmed: true
    note: >-
      The run-results workbook. This is the path by which a replication row
      leaves the system, so it is the one A5's Reproducibility Record has to
      bind (`result-binding`, still owed — WP 9.2).

fields:
  id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Surrogate key. The row's identity is `natural_key_intended`; this exists
      because the table predates that rule.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED to the engine because nothing in the engine reads it — the
      engine produces these rows and never joins back to them.
  run_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The `simulation_runs` row this replication belongs to. ON DELETE CASCADE:
      deleting a run takes its replications with it, which is right for a
      result — a replication of a run that no longer exists is not evidence.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  project_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The owning project. Denormalized from `simulation_runs` so RLS and the
      per-project reads do not need the join.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  rep_index:
    type: "integer"
    unit: null
    unit_source: none
    meaning: >-
      This replication's position in the run, from 0. Half of the natural key,
      and the order the convergence plot walks.
    grain: identifier
    engine:
      consumed_by: "scsim_bridge.py::compute_run_from_project -> replications[].rep_index"
      transform: "the enumeration index of ScenarioResult.kpis"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  seed_used:
    type: "bigint"
    unit: null
    unit_source: none
    meaning: >-
      The random seed this replication actually ran with, derived as
      `project_seed * 1000 + model_rep`. It is recorded rather than recomputed
      so a single replication can be reproduced exactly — the per-seed explorer
      addresses rows by it.
    grain: identifier
    engine:
      consumed_by: "scsim_bridge.py::compute_run_from_project -> replications[].seed_used"
      transform: "project_seed * 1000 + int(rep_cells[i][0])"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      The per-seed explorer addresses replications by this value
      (`ReplicationSeedExplorer`), but the read that fetches it is the hook's
      `select *` cited at table grain — there is no column-grain read to point
      at, and inventing one would be the shape D21 and D22 warn about.
  status:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      Lifecycle of the one replication — 'queued' until the engine returns it,
      'done' once its KPI row and series are written. The result surfaces filter
      on 'done' so a partially-streamed run does not render half-written rows as
      if they were results.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      DEFAULT 'queued' and no CHECK constraint, so the vocabulary is a
      convention rather than a rule the database enforces. Not widened here:
      constraining it is a migration this package does not need, and the
      honest record is that the column accepts any text today.
  kpis:
    type: "jsonb"
    unit: null
    unit_source: derived
    meaning: >-
      This replication's KPI row, exactly as `compute_replication_kpis` built
      it: fill rate, revenue, lost sales, peak backlog, the inventory window
      averages, capacity utilization and one `cost_<component>` key per entry
      of scsim's COST_COMPONENTS. Units are per-key and follow the engine's
      definition of each measure, which is why `unit_source` is `derived`
      rather than a single token.
    grain: level
    engine:
      consumed_by: "scsim_bridge.py::compute_run_from_project -> replications[].kpis"
      transform: "_finite(v, 6) per key — NaN and ±inf become null, which is valid JSON"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      The KEYS are a vocabulary this file does not restate — they are the
      engine's, and `deriveRunKpis` reads them from it so the manual cannot
      drift from what a run carries. §4 D113 is what restating them costs: a
      display list built from the LEGACY engine's KPI shape offered eleven rows
      the canonical engine never writes.
      NO `computed_by`: its contract is a writer `contract:check` R18 can find
      in `src/` or `supabase/functions/`, and the producer here is Python
      (`scsim/scsim/kpi/compute.py::compute_replication_kpis`) running in
      Pyodide. Naming it there would be a declaration R18 cannot resolve —
      §4 D118's shape. `engine.consumed_by` carries the path instead.
  time_series:
    type: "jsonb"
    unit: null
    unit_source: derived
    meaning: >-
      This replication's weekly series, one array per key, each as long as the
      horizon in weeks. The keys are scsim's PUBLISHED weekly series and are
      declared in ONE place — `WEEKLY_SERIES` in scsim/scsim/core/context.py —
      which also fixes each series' unit and how it may be aggregated across
      weeks (`level` = a stock, average it; `flow` = a weekly quantity, sum it;
      `ratio` = neither). `unit_source` is `derived` because the unit is
      per-key, from that declaration, not one token for the column.
      The four inventory series (`on_hand_value`, `fg_value`, `on_hand_units`,
      `fg_units`) are what WP 9.1 added to a user's view; `fg_value` had been
      computed on every replication since the trace was written and published
      by nothing, because the vocabulary was authored six times and it was
      present in only two of them (§4 D164).
    grain: level
    engine:
      consumed_by: "scsim_bridge.py::compute_run_from_project -> replications[].time_series"
      transform: >-
        fill_rate from fr_series, every other published series iterated
        generically out of extra_series; _finite(x, 5) per element
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      Rendered on BOTH result surfaces — `InventoryOverTime` (materials and
      finished goods, units or value), `WeeklySeriesChart` and
      `ReplicationSeedExplorer` — all fed by the hook's `select *` cited at
      table grain, so there is no column-grain read to cite.
      A run made before a series existed carries a row WITHOUT that key. The
      inventory panel states that rather than drawing a zero line, because a
      missing measurement and a measured zero are different facts and T1 does
      not allow one to stand in for the other.
      NO `computed_by`, for the reason given on `kpis`: the producer is scsim,
      which R18 cannot resolve. `engine.consumed_by` carries the path.
  warmup_at:
    type: "integer"
    unit: "weeks"
    unit_source: fixed
    meaning: >-
      The week the run's warm-up was detected to end, copied onto every
      replication of the run. Nullable because it is known only at run end: the
      rows streamed live during a run carry null and the final upsert fills it.
    grain: level
    engine:
      consumed_by: "scsim_bridge.py::compute_run_from_project -> warmup_detected_at"
      transform: "ScenarioResult.warmup.adopted_week, or null when no warm-up report"
      missing_default: "null — not measured, which the charts render as no warm-up marker"
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      Drawn as the warm-up `ReferenceLine` on every weekly series chart,
      including the inventory panel, from the hook's `select *`.
  started_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: "When this replication began executing. Null until it starts."
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  ended_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: "When this replication finished. Null while it is queued or running."
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  created_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: "When the row was inserted."
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
