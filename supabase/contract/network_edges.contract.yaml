# AUTHORED — the data contract's sidecar for `network_edges`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
#
# WP 4.3 · §11. Described for the first time here. It was deferred through WP 3.1,
# 3.2 and 4.2 because "what tier is it" had no answer while the table was one
# thing — see §4 D56, which decided that `network_nodes` and `node_list` are BOTH
# and that the answer is a SPLIT rather than a tier. Tier 3 is the honest label
# TODAY: what these tables are FOR is analysis output, the anchor already treats
# them as derived (`graphHashCoverage.test.ts`'s DERIVED_AND_OUT), and calling the
# uploaded half tier 2 before WP 5.3 drops the computed columns would fold an
# analysis's own output into the identity of its inputs.
table: network_edges
tier: "3"
schema_name: public
grain: >-
  One directed relationship between two firms in one project's deep-tier
  graph. EVERY column is uploaded — nothing computes this table, which is
  why it gains no `computed_from_hash` in WP 4.3 although it sits in
  `graphHashCoverage.test.ts`'s DERIVED_AND_OUT list by name.
owner: analysis
natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "network_edges_pkey"
surfaces:
  - page: "DataManager.tsx"
    via: "rpc get_project_dataset_status"
    grain: table
    evidence: "src/pages/DataManager.tsx:403"
    confirmed: true
  - page: "ProductLevelNetwork.tsx"
    via: "rpc get_network_metrics_for_materials"
    grain: table
    evidence: "src/pages/ProductLevelNetwork.tsx:241"
    confirmed: true

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    Read follows project reachability. No user-facing write policy; uploads go through
    `bulk_insert_network_edges`, which takes the actor. `audited: true` as of WP 4.3
    (`20260917000007`); it was deferred and therefore unaudited before that (D54).

