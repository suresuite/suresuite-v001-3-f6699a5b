# AUTHORED — the data contract's sidecar for `network_nodes`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
#
# WP 4.3 · §11. Described for the first time here. It was deferred through WP 3.1,
# 3.2 and 4.2 because "what tier is it" had no answer while the table was one
# thing — see §4 D56, which decided that `network_nodes` and `node_list` are BOTH
# and that the answer is a SPLIT rather than a tier. Tier 3 is the honest label
# TODAY: what these tables are FOR is analysis output, the anchor already treats
# them as derived (`graphHashCoverage.test.ts`'s DERIVED_AND_OUT), and calling the
# uploaded half tier 2 before WP 5.3 drops the computed columns would fold an
# analysis's own output into the identity of its inputs.
table: network_nodes
tier: "3"
schema_name: public
grain: >-
  One firm in one project's deep-tier network graph, identified by `uid`.
  THE TABLE IS TWO THINGS AND THAT IS §4 D56: nine columns a user uploaded
  and eight an analysis wrote. WP 4.3 gives the computed half a second home
  in `analysis_results`; WP 5.3 drops it from here, and what is left is a
  tier-2 input table.
owner: analysis
natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "network_nodes_pkey"
  - source: "unique index 20260917000007_analyzer_provenance.sql"
    columns: [project_id, uid]
    name: "network_nodes_natural_key"

natural_key_intended: [project_id, uid]
surfaces:
  - page: "DataManager.tsx"
    via: "rpc get_project_dataset_status"
    grain: table
    evidence: "src/pages/DataManager.tsx:412"
    confirmed: true
  - page: "ProductLevelNetwork.tsx"
    via: "rpc project_freshness"
    grain: table
    evidence: "src/pages/ProductLevelNetwork.tsx:227"
    confirmed: true
  - page: "SimulationLab.tsx"
    via: "rpc project_freshness"
    grain: table
    evidence: "src/components/trust/useProjectFreshness.ts:24"
    confirmed: true

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    Read follows project reachability (`has_project_access`), uuid-only since WP 3.0.
    `write: null` is a STATEMENT and not an omission: there is no user-facing write
    policy. Uploads go through `bulk_insert_network_nodes`, which takes the actor and
    sets `app.current_user_id` through `set_current_user_context`; the analysis half
    goes through `analysis_apply_node_metrics` (WP 4.3), which takes the actor and
    stamps the run's `input_hash`. `audited: true` as of WP 4.3 — the three
    `audit_tier_write` triggers land in `20260917000007`, and until then this table
    was deferred in `coverage.yaml`, which is to say OUTSIDE the audit rule with
    nothing to notice (D54).

