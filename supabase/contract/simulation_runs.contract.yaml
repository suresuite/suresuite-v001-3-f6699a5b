# AUTHORED — the data contract's sidecar for `simulation_runs`.
# WP 10.4 · §4 D245 · gate `result-binding`. Described here for the first time,
# by the package that puts the binding ON THE ROW — the deferral this table sat in
# (WP 4.4 → 6.3 → 9.2 → 10.4) waited for exactly that. Edit this file;
# docs/data/tables/*.md is generated from it.
table: simulation_runs
tier: "5"
schema_name: public
grain: >-
  One simulation run: what it was bound to (engine, graph version, policy
  version, scenario run spec, Validated Model, deviations), its status, and the
  run-level KPIs. Tier 5 — a RESULT. Its replications are `run_replications`.
  Since WP 10.4 every binding of a NEW run resolves from this row alone
  (`run_spec`, `run_key`, `engine_id`, `model_validation_id`,
  `protocol_overrides`, `exploratory`); runs dispatched earlier carry the three
  content hashes, the seed and the schedule, and say so in the record.
owner: engine

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "simulation_runs_pkey"

governance:
  read: null
  write: "simulation_lab"
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    `write: simulation_lab` is the capability behind the one user action that
    creates a run. The row itself is created by the dispatcher through
    `create_simulation_run` (service role only — §4 D248 keeps it off the API)
    and moved on by the worker, or by the browser engine for a browser-computed
    run. BUT the table carries two predicate-less policies (`sim_runs_auth_all`,
    `sim_runs_anon_all`), so any holder of the table grant can write a row
    directly, RunKey and class included — one of the tables §4 D154 measured as
    writable from the browser's `anon` role, D28's standing decision and WP 7.1's
    to close. `min_project_role` is `viewer` because nothing here enforces a role,
    not because a viewer ought to write results. NOT AUDITED: tier 5 is output,
    and a re-run writes a new row rather than mutating this one.

surfaces:
  - page: "SimulationLab.tsx"
    via: "hook useSimulationRun → select * from simulation_runs"
    grain: table
    evidence: "src/hooks/useSimulationRun.tsx:87"
    confirmed: true
  - page: "ProjectPolicies.tsx"
    via: "useVerifiableExports → select * from simulation_runs"
    grain: table
    evidence: "src/hooks/useVerifiableExports.tsx:234"
    confirmed: true
    note: >-
      The run-results workbook, whose reproducibility sheet binds the run from
      this row (WP 10.4).

