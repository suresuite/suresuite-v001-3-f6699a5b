# AUTHORED — the data contract's sidecar for `organization_members`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md.
table: organization_members
tier: G
schema_name: public
grain: >-
  One user's membership of one organization, and the role they hold IN that
  organization. An account may hold several — one per organization it belongs to
  (§4 D210). Org-level only: it says nothing about which projects inside the
  organization the user may touch, which is what WP 2.2's `project_members` is
  for.
owner: platform

natural_key_unique:
  - source: UNIQUE constraint
    columns: [org_id, user_id]
    name: null
  - source: column PRIMARY KEY
    columns: [id]
    name: organization_members_pkey
  - source: partial UNIQUE index
    columns: [user_id]
    name: organization_members_one_default_per_user
    predicate: is_default
# The real key is (org_id, user_id) and it is declared — one of the few tables in
# the schema where `natural-key` (§2.1 I4) already holds. `id` is surrogate.
# `organization_members_one_default_per_user` is not a key of the row: it says an
# account has at most ONE default organization (§4 D216), over the rows where
# `is_default` holds.

governance:
  read: null
  write: super_admin
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    A member may read only their OWN membership row (`user_id =
    get_current_user_id()`); there is no policy letting a member enumerate who
    else is in their organization, and the admin pages that do so run through
    super-admin RPCs. `audited: false` is the honest record — `admin_add_org_member`
    and friends log through `log_admin_action`, but membership rows are also
    written by the `20260709000002` backfill and by nothing else that audits, so
    the general claim fails. WP 2.3 is where it becomes true. Since D211 an
    account's `org_role` in each of its organizations is also set by
    `admin_set_user_org_role` (active super
    admin, /admin/users/:userId), logged to `admin_audit_logs`. Since D278
    `admin_set_user_role` moves the ACTIVE organization's row between `member` and
    `admin` when the account role enters or leaves `admin` (never `owner`, never
    another organization's row), logged the same way.

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: Surrogate row identifier. The membership's identity is (org_id, user_id).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  org_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The organization joined, by uuid. ON DELETE CASCADE — deleting a tenant
      removes its memberships rather than orphaning them.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  user_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The approved user who is a member, by uuid. ON DELETE CASCADE.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  org_role:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The member's standing in the organization — `owner`, `admin` or `member`,
      CHECK-constrained. This is an ORG vocabulary and it is not the project
      vocabulary: `min_project_role` throughout this contract speaks of
      viewer / analyst / editor / owner, which WP 2.2 creates on
      `project_members`. The two share the word "owner" and mean different
      things by it.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions:
      - when: a member row is inserted without a role
        value: "'member' — the least of the three"
        provenance: default
        visible_as: the column default, and the admin member list renders the resulting role verbatim
    ingest: {csv_header: null, required: false, validate: one of owner / admin / member}
    surfaces: []
    resolution: null
    note: >-
      NOT READ BY THE CAPABILITY RESOLVER. `capabilities_for_user()` resolves
      role -> org -> user through `approved_users.role` and the capability
      tables, so for pages and features an organization `admin` holds no more
      than a `member` does. ONE reader decides with it: `_api_key_management_org`
      lets an organization `owner` or `admin` manage that organization's API keys
      (and use every scope on a personal key, `_api_key_caller.can_manage`)
      whatever the account role — which is why D278 lowers an `admin` row when
      the account role leaves `admin`: before it, a demoted account kept that
      right. Since D278 the row follows the account role on the ACTIVE
      organization (`admin_set_user_role`); `admin_list_account_role_gaps` lists
      account admins whose row still says `member`. Recorded rather than implied,
      per §5 T1.
  is_default:
    type: boolean
    unit: null
    unit_source: none
    meaning: >-
      This membership is the account's DEFAULT organization (§4 D216) — where every
      sign-in lands (`authenticate_approved_user` makes it the active organization
      when it is not, and its access period has not ended), and where the account
      re-points when its active organization goes away. At most one per account, by
      the partial unique index `organization_members_one_default_per_user`; always one
      of the account's organizations because it IS a membership row, so removing the
      membership removes the default with it. Set only by a super admin
      (`admin_set_default_org`, /admin/users); the account switches freely between
      sign-ins and cannot change it. `false` on every row of an account with no
      default, which signs in where it last worked (D210's behaviour). Shown to the
      account's fellow members by NAME on /profile's My organization tab (§4 D217):
      `get_my_organization_access` and `project_access_read` return it per person.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions:
      - when: a membership is inserted without saying whether it is the default
        value: "false — no membership becomes the default implicitly"
        provenance: default
        visible_as: the column default; /admin/users shows no default for the account until one is set
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  joined_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: When the membership was created. Server-stamped.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null

note: >-
  THE AUTHORITY FOR WHICH ORGANIZATIONS AN ACCOUNT BELONGS TO since `20260930000004`
  (§4 D210) — an account may belong to several, and `approved_users.organization_id`
  names the ACTIVE one (what RLS reads). Between `20260929000002` (D205) and D210 this
  table was derived from that column and held at most one row per account. The rule
  now, kept by triggers and asserted by `rehearsal/450`: `organization_id` is NULL
  exactly when the account has no row here, and otherwise names one of its rows.
  Setting `organization_id` ADDS its row (`trg_approved_users_sync_org_membership`,
  the `20260709000002` role mapping — app `admin` → `org_role = 'admin'`, everyone
  else `member`) and removes none; a first row makes its organization active
  (`trg_organization_members_activate_first`); deleting the active organization's row
  re-points the account to its earliest remaining one, or none
  (`trg_organization_members_repoint_active`) — to its DEFAULT one when it has one
  (`is_default`, D216), which is also where every sign-in lands. A row's organization and account are
  fixed — an UPDATE of either is refused. Each row is a SEAT: an organization's
  `user_limit` counts these rows (`trg_tenant_allowance`, BEFORE INSERT; a re-add of an
  existing member takes no seat). Written by `admin_add_org_member` /
  `admin_remove_org_member`, `admin_set_default_org`, `admin_set_user_org_role` and,
  for the active organization's member/admin role, `admin_set_user_role` (D278) (all
  logged through `log_admin_action`), by the sync trigger,
  and by the CASCADEs; read by the account through `list_my_organizations`.
