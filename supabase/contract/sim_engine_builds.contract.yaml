# AUTHORED — the data contract's sidecar for `sim_engine_builds`.
# PLAN.md §25 · WP 15.2 · §4 D292. Edit this file; docs/data/tables/*.md is generated from it.
table: sim_engine_builds
tier: reference
schema_name: public
grain: >-
  One row per engine build that produced a result or was reported running, keyed
  by (engine, code_version). Append-only: `last_seen_at` moves forward, a part the
  row did not know is filled once, and a build found wrong is WITHDRAWN with a
  reason, never deleted. The CURRENT build is not stored here — it is
  `sim_engines.code_version`, which the worker's boot report authors.
owner: engine

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "sim_engine_builds_pkey"
  - source: "table constraint 20261004000001_engine_build_ledger.sql"
    columns: [engine_id, code_version]
    name: "sim_engine_builds_key"

natural_key_intended: [engine_id, code_version]

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    A registry, like `sim_engines`: read by everyone through `sim_engine_builds_read`
    (`USING (true)`, select only), written by no API role. Its one writer is
    `_engine_build_record`, internal and service-only (D248), reached three ways:
    the worker's boot report (`sim_engine_report`), an AFTER trigger on every run
    row that names its build (the browser writes runs as anon), and the WP 15.2
    backfill. The one human act, `sim_engine_build_withdraw`, is super-admin only
    and records its actor in the row. Not audited: a reference table whose writers
    name no person, with an append-only trigger instead of an audit trail.

surfaces: []

fields:
