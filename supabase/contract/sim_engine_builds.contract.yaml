    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The build's id within the ledger. A run names its build by `(engine_id, code_version)`, the table's key, not by this id.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  engine_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The registered engine (`sim_engines`) the build belongs to.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  code_version:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The build, spelled exactly as a run's `code_version` is stamped. Since WP 15.1 it is `scsim-<ENGINE_VERSION>+<12 hex>`, a digest of scsim's source and the worker's compute path, so different code is a different build. A row from before WP 15.1 carries the bare label (`scsim-0.2.8`), which several builds shared; what ran under it is unknown, and the row says so by having no digests.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  scsim_digest:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      sha256 over scsim's source files, as the worker reported it. Filled once; NULL for a build no worker reported (a browser run, or history).
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
