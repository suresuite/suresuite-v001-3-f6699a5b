# AUTHORED — the data contract's sidecar for `customers`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: customers
tier: "2"
schema_name: public
grain: >-
  One customer of one project — the demand-side counterpart of `suppliers`. The
  key is the customer's identifier AS THE SOURCE FILE SPELLS IT, scoped to the
  project, so the same company appearing in two projects is two rows and stays
  two rows.
ingest_dataset:
  # §4 D108 + D94 — THE GATE THAT FORCED THIS BLOCK.
  #
  # WP 6.1 built "no engine-read field is unreachable by both the grid and every
  # upload" as a GATE and not a ratchet, because it was empty. D94's declaration
  # made it fire: `priority_weight` and `segment` reach `P-C.2` on every run and
  # this product had no way to set either. `20260919000001` widens
  # `ingest_target_is_promotable` to TEN, and `INGEST_DATASETS` is generated from
  # this block, so the SQL list and the TypeScript one cannot drift
  # (`ingestSpecParity.test.ts`).
  #
  # `fact_class: master` and not `transactional`. A customer is an entity the
  # project HAS, like a supplier or a material — not an arc between two of them.
  # It decides which staging table the landing writes and what a re-upload means:
  # a master row is upserted on its natural key, which is what a user editing one
  # customer's priority expects.
  #
  # `server_set` is `project_id` ALONE, with no `plant_name`: a customer belongs
  # to the project, not to a plant. This table has no such column.
  wizard_id: item_master_customers
  fact_class: master
  server_set: [project_id]
owner: data-ingestion

natural_key_unique:
  - source: UNIQUE constraint
    columns: [project_id, customer_id]
    name: customers_project_customer_key
natural_key_intended: [project_id, customer_id]

governance:
  read: project_member
  write: project_modeler_or_admin
  min_project_role: editor
  audited: true
  rls_enabled: true
  note: >-
    Adopted with RLS enabled and no `anon` policy. The logistics lanes carry an
    `*_anon_read` policy because the public network pages render them (D28, a
    standing decision); nothing reads this table at all, so there was no reader
    to keep working and no reason to widen that exposure.
    `audited: true` was NOT the first draft. The adoption was written with the
    three WP 2.3 triggers left off — the table had had no migration when they
    were written, so it had never had them — and `dataPlaneAudit.test.ts` failed
    on the same commit that put the table in the contract. Its rule is derived
    from the contract's own tier, not from a list, so a tier-2 table without its
    triggers is a failure by construction. The triggers are in
    `20260916000003_adopt_customers_drop_product_code_map.sql` and R9 holds this
    field to them.

fields:
  project_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The project this customer belongs to. Scoping is what makes `customer_id`
      a key: the same company in two projects is two rows, and merging them
      would merge two customers' models.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: true, validate: null}
    surfaces: []
    resolution: null
  customer_id:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The customer's identifier as the source file spells it. Joins to
      `outbound_logistics.customer_id`, which is the only place the identifier
      is used today — and the join is by string, untrimmed, which is D8's shape.
      IT IS ALSO THE UPLOAD KEY since WP 6.2 (§4 D108): the same string the
      outbound file spells, so a customer row and its lanes meet on the value the
      user typed rather than on a normalisation neither file performed.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: "customer_id"
      required: true
      validate: "non-empty; unique within the project"
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  name:
    type: text
    unit: null
    unit_source: none
    meaning: The customer's display name. Nullable; never a join key (G1).
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest:
      csv_header: "name"
      required: false
      validate: "optional; display only"
      rule: {kind: text, blank: 'null'}
    surfaces: []
    resolution: null
  segment:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The customer's service segment, the axis the customer-echelon allocation
      policies tier on (`P-C.x`, blueprint §4.2 and Appendix A). NOT a closed
      vocabulary yet — there is no CHECK, because the set a CHECK would name is
      the user's own segmentation and inventing it before anybody can write the
      table is how a column gets a constraint nobody can satisfy.
    grain: level
    engine:
      consumed_by: "P-C.2 customer_allocation — Customer.segment, the axis `sla_tiers` keys its fill floors by, and what the `fill_rate_segment_<segment>` KPIs are named after"
      transform: null
      missing_default: "\"default\" (Customer.segment's own default) — every customer in one segment, so no `sla_tiers` key can match and every declared floor resolves to 0.0"
    substitutions: []
    ingest:
      csv_header: "segment"
      required: false
      validate: >-
        optional; any string. Blank lands NOTHING and the column's own DEFAULT
        'default' stands in — which is a value and not an absence, so the landing
        reports it as a substitution rather than leaving the cell silent (T2).
      rule: {kind: text, blank: 'null'}
    surfaces: []
    resolution: null
    note: >-
      DEFAULT 'default' is production's own default, adopted rather than chosen.
      It is a value, not an absence, and a later reader must not treat it as
      "unsegmented" without saying so at the point of display (§5 T2).
      DECLARED IN WP 6.2 (§4 D94), which is what closed the blank above rather
      than the trace alone. `p_c2_customer_allocation.data_requirements` named
      one field — `outbound_logistics.volume` — while reading this column and
      `priority_weight` on every run, so `consumed_by: null` here had nothing to
      contradict it. The requirement is declared now, at level `defaulted`
      because `Customer` carries a default, and the gate that fell out of it is
      the inverse of the one `contract:generate` already enforces: an IMPLEMENTED
      policy's declared data requirement may not be `consumed_by: null` in the
      sidecar.
      TRACED IN WP 6.2 (§4 D69). This is the column whose absence was silent in
      a second way: `P-C.2`'s `sla_tiers` guarantees a fill floor PER SEGMENT,
      and the mapper gave every customer the entity default `"default"`, so no
      tier could ever match and every floor was 0.0. The engine already warned
      (`unknown_sla_segment` in P-C.2's feasibility) — the warning named the
      symptom while nothing named the cause, because the segments it compared
      against were a constant.
  priority_weight:
    type: numeric
    unit: null
    unit_source: none
    meaning: >-
      Relative allocation priority when demand exceeds supply. Dimensionless and
      relative — only the RATIO between two customers means anything, so a row
      at 1.0 is not "one unit" of anything.
    grain: rate
    engine:
      consumed_by: "P-C.2 customer_allocation — Customer.priority_weight, the fallback ordering under the `priority` rule wherever the `priority_weights` param does not name the customer"
      transform: null
      missing_default: "1.0 (Customer.priority_weight's own default) — every customer equal, so the `priority` rule cannot order anything"
    substitutions: []
    ingest:
      csv_header: "priority_weight"
      required: false
      validate: >-
        optional; >= 0. ZERO IS ALLOWED AND MEANS SOMETHING: only the ratio
        between two customers matters, so 0 is the lowest priority there is —
        served last, and only out of what is left. `exclusive_min` would reject a
        value the engine reads correctly. Blank lands nothing and the DEFAULT 1.0
        stands in, which makes the `priority` rule inert for that customer.
      rule: {kind: numeric, min: 0, blank: 'null'}
    surfaces: []
    resolution: null
    note: >-
      TRACED IN WP 6.2 (§4 D69), AND THE PREVIOUS NOTE'S REASON WAS FALSE.
      It read: "`scsim` has no customer-priority concept today … none of
      [the `P-C.x` policies] is implemented". `p_c2_customer_allocation` is
      `status: implemented` in the registry export and has always read
      `Customer.priority_weight`. What was true is the CONSEQUENCE — nothing
      reached it — but the cause was the mapper never loading this table, not an
      absent policy, and the stated reason sent the next reader to the blueprint
      instead of to `project_map.py`.
      The blank was still correct while it lasted: `from_project_data` built
      `Customer(id=c, name=c)` from the outbound arcs, so every customer arrived
      at 1.0 whatever this column held. The mapper now reads it.
      AND IT IS DECLARED SINCE WP 6.2 (§4 D94). The mapper reading a column is
      the hop; the registry DECLARING it is what every tool deriving "what the
      engine reads" was missing — this sidecar, `project_map`'s requirement list
      and WP 6.1's resolution-chain door 1 were all blind to a field the engine
      consumes on every run.
  sla_fill_floor_pct:
    type: numeric
    unit: null
    unit_source: none
    meaning: >-
      The minimum fill rate the customer is contracted to receive, as a
      percentage. NULLABLE, and the null means "no contracted floor" — not zero.
      A reader that coerces it to 0 turns "unconstrained" into "no service
      required", which is D17's error in the other direction.
    grain: rate
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED, and the REASON is now different from `priority_weight`'s — the
      two were given the same one and only this column's survives (§4 D69, D94).
      `P-C.2 customer_allocation` IS implemented, and it does guarantee fill
      floors: `sla_tiers`, keyed BY SEGMENT. This column is per CUSTOMER, and
      `Customer` has no field for it at all, so there is nothing to carry it
      into. Mapping per-customer floors onto a per-segment param needs a rule for
      what happens when two customers in one segment disagree, and inventing that
      rule is not a reader change. Declared gap, not a silent one.
  ingest_run_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The ingestion run that last wrote this row (WP 6.2, §4 D108), and through it
      the file, the uploader and who approved the promotion. NULL for every row
      that predates the CSV landing path — and on THIS table that is every row
      written before `20260919000001`, because until then nothing in the product
      wrote it at all: the only way a row got here was a hand at the database.
      A null means the provenance is unknown, never that there was none.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  source_row_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The tier-1 staged row this was promoted from (WP 6.2). Its
      `source_row_number` is the physical line of the uploaded file, header =
      line 1, so a person can be shown the LINE rather than told a file name.
      `ON DELETE SET NULL` and DEFERRABLE, because staging dies with its run and a
      customer belongs to the project rather than to the run.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  created_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: When the row was first inserted. Server-stamped.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  updated_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: When the row was last modified. Server-stamped.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null

note: >-
  ADOPTED IN PHASE 3 / WP 3.0 (D43). This table existed in the production
  database with six rows and no creating migration, and it was invisible to the
  `no-orphan-table` gate for a reason worth keeping: R4 catches tables the CODE
  READS that no migration creates, and nothing has ever read this one. §15's
  schema probe — which keys on "production has it" rather than "the code reads
  it" — is what found it, and that probe now fails the verification run rather
  than reporting.
  TWO OF ITS COLUMNS ARE READ SINCE WP 6.2 (§4 D69): `segment` and
  `priority_weight` reach `P-C.2 customer_allocation`, because the mapper now
  loads this table instead of synthesizing `Customer(id=c, name=c)` from the
  outbound arcs. The sentence that stood here — "NOTHING READS IT YET, and the
  sidecar says so in every `consumed_by: null`" — was true of the outcome and
  wrong about the cause, and it gave that wrong cause twice more in the column
  notes below.
  It is not dead: its columns are the inputs of the customer-echelon policies
  (`P-C.x`), which is why it was adopted rather than dropped the way
  `product_code_map` was in the same migration. What it still lacks is a WRITER
  and a CSV template, and that gap is now BINDING rather than tidy: two of its
  columns reach the engine and no surface in this product writes them, so the
  values deciding who is served when supply is short can only arrive by hand in
  the database (§4 D94).
