# AUTHORED — the data contract's sidecar for `run_usage`.
# WP 10.7 · §4 D247 · blueprint G15. Edit this file; docs/data/tables/*.md is
# generated from it.
table: run_usage
tier: "5"
schema_name: public
grain: >-
  One capacity event of one run: its reservation when it was dispatched
  (`dispatch`), what it actually used when it finished (`complete`), or the
  release of its series storage when the sweep expired them (`expire`). The
  ledger a month's compute is read from.
owner: engine

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "run_usage_pkey"
  - source: "table constraint 20261001000012_capacity.sql"
    columns: [run_id, kind]
    name: "run_usage_run_kind_key"

natural_key_intended: [run_id, kind]

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    No API role reads or writes it: RLS is on with no policy. Written only by
    SECURITY DEFINER code — `create_simulation_run` (the reservation, in the same
    statement as the run row it reserves for), the `simulation_runs_usage_complete`
    trigger (the actual, once per run) and `simulation_runs_usage_expire` (the
    release) — and read only through `get_my_capacity` and the super admin's
    `admin_org_capacity_usage` (the super admin's usage view,
    `src/pages/admin/AdminUsage.tsx` — an admin page, outside §5.1's lineage).
    NOT AUDITED: tier 5 is output, append-only by its
    `(run_id, kind)` key, and each row names the member and the run itself.
    Compute used is the ledger's, so deleting runs does not hand a month's compute
    back; storage used is derived from the live runs, so a deleted run frees its
    bytes whatever deleted it.

surfaces:
  - page: "SimulationLab.tsx"
    via: "hook useMyCapacity → rpc get_my_capacity (what this member has used)"
    grain: table
    evidence: "src/hooks/useMyCapacity.ts:25"
    confirmed: true

