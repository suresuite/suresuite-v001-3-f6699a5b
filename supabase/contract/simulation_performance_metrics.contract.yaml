# AUTHORED — the data contract's sidecar for `simulation_performance_metrics`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md.
#
# WP 10.4 · `result-binding`. A DORMANT table of the retired batch pipeline,
# described so the contract can see it (§4 D54) — see `note`.
table: simulation_performance_metrics
tier: "5"
schema_name: public
grain: >-
  One telemetry record for one legacy job: how long the RETIRED `ml-service`
  took, what memory and CPU it used, how many iterations it needed and how many
  service calls and database queries it made. Operational measurements of a
  run, not results of the simulated supply chain. Tier 5 — input to nothing.
  DORMANT IN THE REPOSITORY: no code in `src/`, `supabase/functions/`,
  `sim-worker/` or `scsim/` reads or writes it; its only writer was the
  `ml-service`, whose source left this repository with the legacy stack.
owner: engine

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "simulation_performance_metrics_pkey"

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    Two policies through the project's organization
    (`org_is_current_user_org(p.organization_id, p.organization)`): SELECT for any
    member of that organization, ALL for the project's modeler or an organization
    admin. Neither is predicate-less, so `write: null` agrees with
    `governanceEnforcement.test.ts`, and no user-facing write path exists in the
    repository. Deleting a project, or a legacy job, removes these rows through the
    inline `REFERENCES … ON DELETE CASCADE` on `project_id` and
    `simulation_job_id`.
    The `ml-service` that wrote it ran on Render, outside this repository and
    outside D168's function list; the 2026-07-02 removal commit asks for that
    service to be deleted by hand, and the repository does not record whether it
    was. §4 D168 does list `delete-simulation-job` — which deleted these rows —
    among the legacy edge functions still LIVE in production with no source here.
    NOT AUDITED: tier 5, and `audit-actor` covers tiers 2–4.

note: >-
  A RETIRED PIPELINE'S TELEMETRY, LEFT IN PLACE ON PURPOSE by the 2026-07-02
  commit that removed the legacy batch stack. A drop needs a production row count
  first, which no §15 run has taken. Every measure below was whatever the
  `ml-service` chose to report — its writer spread a metrics dict straight into
  the insert — so no column has a definition this repository can still check.

