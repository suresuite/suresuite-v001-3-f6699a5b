# AUTHORED — the data contract's sidecar for `projects`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md.
table: projects
tier: G
schema_name: public
grain: >-
  One modelling project: a named supply chain, owned by one modeller, belonging
  to one organization. It is the scope every other project-scoped table hangs
  off `project_id`, and it is the row almost every RLS policy in the schema
  reaches through to decide whether the caller may see anything at all.
owner: platform

natural_key_unique:
  - source: column PRIMARY KEY
    columns: [id]
    name: projects_pkey
  - source: UNIQUE constraint
    columns: [modeler_id, plant_name, name]
    name: uq_modeler_project
natural_key_intended: [organization_id, name]

