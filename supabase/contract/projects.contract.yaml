    unit_source: fixed
    meaning: The plant's latitude in decimal degrees, WGS 84, for the network map.
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      NOT TRACED into the engine, and correctly so: `scsim` has no geography.
      Coordinates place a node on the map; they do not affect a simulated
