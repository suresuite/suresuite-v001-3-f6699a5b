    unit_source: fixed
    meaning: The plant's longitude in decimal degrees, WGS 84, for the network map.
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: As `plant_latitude` — rendered, never simulated.
