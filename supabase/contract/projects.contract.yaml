governance:
  read: null
  write: data_editing
  min_project_role: editor
  audited: false
  rls_enabled: true
  note: >-
    Tier G rather than a data tier: `projects` holds no measured quantity. It is
    the SCOPE, and its access rules are the ones every other table inherits by
    joining to it — which is why WP 2.1 had to redefine 58 policies on 24 other
    tables to change one comparison. Read is org-wide (any member of the owning
    organization sees every project in it); write is restricted to the project's
    own modeller or a global `admin`. There is no project-level role between
    those two — a member cannot be given read on one project and not another,
    which is `subtractive-delegation` (§2.1 G3) having nowhere to attach.
    WP 2.2's `project_members` is where `min_project_role: editor` above stops
    being a forward declaration. `audited: false`: project creation and deletion
    write no audit row (WP 2.3).

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The project's identity, and the `project_id` foreign key of every
      project-scoped table in the schema.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  name:
    type: text
    unit: null
    unit_source: none
    meaning: The project's title, as the modeller typed it.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: non-empty}
    surfaces: []
    resolution: null
  modeler_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The approved user who owns the project. Stamped by `set_project_defaults()`
      from the calling user when not supplied, and it is the second half of every
      write policy: org match AND (modeller is caller OR caller is admin).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions:
      - when: a project is inserted without a modeler_id
        value: the calling user, via get_current_user_id()
        provenance: default
        visible_as: the project lists render the resulting owner
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      NOT a declared foreign key to `approved_users` — it is a bare uuid. WP 2.2
      backfills it into `project_members` as the project's `owner`, which is
      where the reference becomes real.
  modeler_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The owner's name, denormalized at insert. A display convenience, and stale
      the moment the user renames themselves; `modeler_id` is the fact.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  organization:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The owning organization, as a string, copied from the creating user at
      insert. NOT NULL with a default, so it always holds something.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions:
      - when: a project is inserted with no user context to copy from
        value: "'default_org'"
        provenance: default
        visible_as: >-
          nowhere. The string authorizes like any other tenant name, so a project
          that fell to the default is readable by every other account that also
          fell to it.
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      The other half of D13, and the right-hand side of 73 of the 122 live org
      comparisons WP 2.1 rewrote. Nothing updates it when the organization is
      renamed — `admin_update_organization` touches `organizations.name` only —
      so after a rename this column holds the old name indefinitely.
  organization_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The owning organization by uuid. This is what the public /v1 API authorizes
      on (`api_can_access_project`: `p.organization_id = p_org_id`), and it is the
      plane that survives a rename.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      D27 lived here. `set_project_defaults()` stamped `NEW.organization` and
      never this column, so the one-time backfill in `20260709000002` was the only
      thing that had ever set it and every project created afterwards was NULL —
      visible through RLS, which compared text, and invisible to /v1, which
      compares this. WP 2.1 fixed the trigger first and then backfilled, because
      a backfill in front of a trigger that does not stamp rots at the next
      insert. Still NULLABLE: rows whose text org matches no organization row, or
      matches two, were deliberately left alone rather than resolved to a guess,
      and the dual read keeps them reachable. The count is a §15 question.
  plant_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The name of the plant this project models. Part of the
      `(modeler_id, plant_name, name)` unique constraint, and the join key the
      lane and BOM tables carry as their own `plant_name`.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: non-empty}
    surfaces: []
    resolution: null
  plant_latitude:
    type: numeric
