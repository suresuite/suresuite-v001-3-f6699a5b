note: >-
  `natural_key_intended` is `(organization_id, name)` and the declared constraint
  is `(modeler_id, plant_name, name)` — they are different claims, and the
  declared one is the weaker: two modellers in one organization may each hold a
  project called the same thing for the same plant. Changing it is not WP 2.1's
  to do; `natural-key` (§2.1 I4) lands in WP 3.3 and this row is one of its
  inputs. Recorded here so the gap has an owner rather than being noticed again
  in a quarter.
