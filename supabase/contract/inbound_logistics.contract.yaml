# AUTHORED — the data contract's sidecar for `inbound_logistics`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: inbound_logistics
tier: "2"
schema_name: public
grain: >-
  One supply arc as the user uploaded it: this supplier can deliver this material
  to this plant, at this price and lead time, in this volume. UNIQUE on
  `natural_key_intended` since WP 3.3 (`20260916000018`): a second upload of the
  same arc UPDATES it rather than adding a row, and the promotion is the upsert
  that does so (D5 closed).
ingest_dataset:
  wizard_id: inbound_logistics
  fact_class: transactional
  server_set: [project_id, plant_name]
owner: data-ingestion

# Recorded truthfully. `id` is a surrogate and on its own constrained nothing —
# that was D5. WP 3.3 landed the second entry below, and the two together are the
# whole of this table's uniqueness.
natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "inbound_logistics_pkey"
  # WP 3.3 — `20260916000018`. THE KEY `natural_key_intended` HAS NAMED SINCE
  # WP 1.4, now enforced. `NULLS NOT DISTINCT` is part of the constraint and not
  # a detail: PostgreSQL's default makes NULLs distinct, so a plain index would
  # constrain every row except the ones whose key column is null — and
  # `ON CONFLICT` infers from the same index, so the promotion would INSERT a
  # duplicate instead of updating exactly those rows (§4 D5).
  - source: "UNIQUE index (NULLS NOT DISTINCT)"
    columns: [project_id, plant_name, supplier_id, material_id]
    name: "inbound_logistics_natural_key"
natural_key_intended: [project_id, plant_name, supplier_id, material_id]

surfaces:
  - page: "DataManager.tsx"
    via: "rpc get_project_dataset_status"
    grain: table
    evidence: "src/pages/DataManager.tsx:429"
    confirmed: true
  - page: "ProjectPolicies.tsx"
    via: "rpc ensure_item_masters"
    grain: table
    evidence: "src/hooks/useItemMasters.tsx:194"
    confirmed: true
  - page: "SimulationLab.tsx"
    via: "rpc ensure_item_masters"
    grain: table
    evidence: "src/hooks/useItemMasters.tsx:194"
    confirmed: true

governance:
  read: null
  write: data_editing
  min_project_role: editor
  # WP 2.3 created `audit_<table>_insert/update/delete`, three AFTER … FOR EACH
  # STATEMENT triggers calling `audit_tier_write`. This flag said `false` for
  # every one of the twelve tables it audited, and the generated page published
  # that as "Tier transitions audited: no" (D40). `contract:check` R9 now
  # compares this field against the live triggers, so it cannot drift again.
  audited: true
  rls_enabled: true
  note: >-
    `write` names the capability that exists today. WP 2.2 splits `data_editing`
    into `data_edit_inputs` (tier 2) and `data_edit_policies` (tier 4); this row
    becomes `data_edit_inputs` then, and all twelve sidecars change together.

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: Surrogate row identifier. Carries no meaning and joins to nothing.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  project_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: The project this arc belongs to. Every read is scoped by it.
    grain: identifier
    engine:
      consumed_by: datamap.py::rows -> per-project fetch
      transform: filter, never read as a value
      missing_default: null
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "set from the selected project, never from the CSV"}
    surfaces: []
    resolution: null
  plant_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The focal plant receiving the material, by NAME. A displayable string used as
      a join key — the thing invariant G1 forbids; WP 2.1/3.3 replace it with a uuid.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions:
      - when: the CSV omits it
        value: the selected project's `projects.plant_name`
        provenance: derived
        visible_as: null
    ingest: {csv_header: null, required: false, validate: must equal the project's plant_name — a trigger raises otherwise}
    surfaces: []
    resolution: null
  supplier_id:
    type: text
    unit: null
    unit_source: none
    meaning: The supplier's code as the user's own systems spell it.
    grain: identifier
    engine:
      consumed_by: project_map.py::_map_supply -> SupplierLink.supplier_id
      transform: str(); no trimming (D8)
      missing_default: null
    substitutions: []
    ingest:
      csv_header: supplier_id
      required: true
      validate: non-empty after trim — NOT enforced today (D8)
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  material_id:
    type: text
    unit: null
    unit_source: none
    meaning: The material's code as the user's own systems spell it. Joins to materials and the BOM.
    grain: identifier
    engine:
      consumed_by: project_map.py::_map_supply -> SupplierLink.material_id
      transform: str(); arcs whose material is not in the BOM are dropped
      missing_default: null
    substitutions: []
    ingest:
      csv_header: material_id
      required: true
      validate: non-empty after trim — NOT enforced today (D8)
      rule: {kind: text, blank: reject}
    surfaces: []
    resolution: null
  volume:
    type: numeric
    unit: units per `time_unit`
    unit_source: column
    unit_column: time_unit
    normalize_at_promotion: {conversion: rate, canonical: week}
    meaning: >-
      How much of this material the user buys from this supplier over one
      `time_unit`. A RATE, not a quantity — two rows are only comparable after
      both are converted to the same period.
    grain: rate
    engine:
      consumed_by: project_map.py::_map_supply -> supply-share weighting
      transform: rateToWeekly(volume, time_unit) — normalized to weeks
      missing_default: "0 (the arc carries no share)"
    substitutions: []
    ingest:
      csv_header: volume
      required: true
      validate: "numeric >= 0; blank becomes NULL, not 0 (D7)"
      rule: {kind: numeric, min: 0, blank: reject}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        Volume is what the user's own systems recorded. It is not estimated; it is
        the thing other quantities are estimated FROM — demand_mean names it in
        estimable_from.
  time_unit:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The period `volume` is quoted over — day, week, month, quarter, year. It
      describes the VOLUME only. It says nothing about `lead_time`.
    grain: metadata
    engine:
      consumed_by: project_map.py::_duration_to_weeks (via UNIT_DAYS)
      transform: looked up in the one unit table
      missing_default: "weekly"
    substitutions:
      - when: blank or unrecognised
        value: treated as weekly
        provenance: default
        visible_as: null
    ingest:
      csv_header: time_unit
      required: false
      validate: one of day/week/month/quarter/year and their -ly spellings
      rule: {kind: unit, blank: "null"}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        A unit is never estimated. Unrecognised or blank is read on a 7-day basis,
        i.e. as already weekly (grading.ts::rateToWeekly).
  lead_time:
    type: numeric
    unit: weeks
    unit_source: column
    unit_column: lead_time_unit
    normalize_at_promotion: {conversion: duration, canonical: week}
    meaning: >-
      How long this supplier takes to deliver this material. The contract fixes the
      unit at WEEKS; `time_unit` does not apply to it and never has.
    grain: level
    engine:
      consumed_by: project_map.py::_map_supply -> SupplierLink.lead_time_weeks
      transform: _duration_to_weeks(lead_time, lead_time_unit), then round and clamp to [1, 51]
      missing_default: "2 weeks, with a `warn` MappingWarning"
    substitutions:
      - when: the column is NULL or zero
        value: 2 weeks
        provenance: default
        visible_as: MappingWarning on the run's mapping report
    ingest:
      csv_header: lead_time
      required: true
      validate: numeric > 0
      rule: {kind: numeric, exclusive_min: 0, blank: reject}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: [observations.receipts (Phase 7+)]
      hybrid:
        centre: "inbound_logistics.lead_time"
        spread: "materials.lead_time_dist + materials.lead_time_cv"
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        The engine already supports this split and has since scsim was written:
        SupplierLink carries lead_time_weeks (the CENTRE) separately from
        lead_time_dist and lead_time_cv (the SPREAD), and core/engine.py samples
        only when the distribution is not DETERMINISTIC and the CV is above zero.
        So deterministic is not a degenerate case bolted on — it is the default
        path, and it skips sampling entirely. default_mode is `asserted` for the
        same reason: the user states the lead time, and the spread is opt-in.
        estimable_from names the observations tier that does not exist yet (tier
        2-O, reserved in WP 1.2) rather than leaving the door open to estimating
        this from whatever happens to be lying around.
    note: >-
      Was `unit_source: fixed` until WP 1.3, and fixed by OMISSION rather than by
      contract: the engine read a `lead_time_unit` that no column supplied, so
      every lead time was taken as weeks whatever the user meant. The column now
      exists and `unit` stays `weeks` because that is what NULL still means.
  lead_time_unit:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The period `lead_time` is quoted in — day, week, month, quarter or year.
      Blank means WEEKS, which is what the engine assumed before this column
      existed. Distinct from `time_unit`, which is the period `volume` is quoted
      over and has never applied to the lead time.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_map_supply -> _duration_to_weeks(arc.lead_time, arc.lead_time_unit)"
      transform: "looked up in the one unit table; an unknown value falls to a 7-day basis"
      missing_default: "weeks"
    substitutions:
      - when: "NULL or blank"
        value: "weeks"
        provenance: contract
        visible_as: null
    ingest:
      csv_header: lead_time_unit
      required: false
      validate: "one of the units public.unit_days() knows — enforced by the column's CHECK constraint"
      rule: {kind: unit, blank: "null"}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        A unit is never estimated. NULL means weeks, matching
        project_map.py::_duration_to_weeks, and the column's CHECK constraint only
        admits units public.unit_days() knows.
    note: >-
      Added by WP 1.3 (D9). The engine had read this field since the scsim bridge
      was written; no column supplied it, so `r.get("lead_time_unit")` returned
      None on every row and a lead time entered in days was read as weeks — seven
      times too long, with no warning, because nothing in the chain knew a unit was
      expected. This is also the first use of the `contract` provenance state
      reserved in WP 1.2: the weeks default is supplied by this document, not
      guessed by code.
  unit_price:
    type: numeric
    unit: currency per unit of material
    unit_source: fixed
    meaning: What one unit of this material costs from this supplier, delivered.
    grain: level
    engine:
      consumed_by: project_map.py::_map_supply -> SupplierLink.cost
      transform: float(); a value <= 0 is replaced, not rejected
      missing_default: "1.0, with a `warn` MappingWarning"
    substitutions:
      - when: NULL, zero or negative
        value: "1.0"
        provenance: default
        visible_as: MappingWarning on the run's mapping report
      - when: "`materials.cost` is unset for this material"
        value: this arc's price becomes the material's cost, via the cheapest inbound arc
        provenance: derived
        visible_as: the effective-economics badge in /policies
    ingest:
      csv_header: unit_price
      required: true
      validate: numeric > 0
      rule: {kind: numeric, exclusive_min: 0, blank: reject}
    surfaces: []
    resolution:
      default_mode: asserted
      assertable_by: [csv_upload]
      estimable_from: []
      hybrid: null
      on_conflict: assertion_wins
      threshold_pct: null
      note: >-
        hybrid is NULL because scsim has nowhere to put a spread: cost and
        unit_price are bare floats on Material and Product, with no distribution,
        no CV and no sampling path anywhere in the engine. Recording `hybrid:
        null` here is a statement about the ENGINE, not about the world — prices
        obviously vary. Giving them a spread is an engine change on the scsim
        track; see the RFC in PLAN.md §14. Do not invent one in this contract: a
        contract that describes a capability the engine does not have is how a
        fallback ends up in code with no contract entry, which is what I6 forbids
        in the other direction.
    note: >-
      The user types `unit_price` and the engine calls it `cost`. Both names are
      recorded because the manual must lead with the one the user typed (D21).
  created_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: When the row was inserted. Server-set.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  updated_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: When the row last changed. Server-set.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  ingest_run_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The ingestion run that last wrote this row (WP 3.3), and through it the
      project, the source kind and who approved the promotion. NULL for every
      row that predates the CSV landing path, and for rows whose run has since
      been deleted — a null here means the provenance is UNKNOWN, never that
      there was none. Set by `ingest_apply_run` and by nothing else.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
  source_row_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The tier-1 staged row this was promoted from (WP 3.3). Its
      `source_row_number` is the physical line of the uploaded file, header =
      line 1, so a person can be shown the line rather than told a file name —
      which is what extends A4 down to the source. `ON DELETE SET NULL` and
      DEFERRABLE: staging is deleted with its run, and a canonical row belongs to
      the project rather than to the run that last wrote it.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
