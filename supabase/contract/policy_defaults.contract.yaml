    grain: metadata
    engine:
      consumed_by: "project_map.py::_map_policies -> P-P.x production plugins"
      transform: "a JSON object of family parameters, mapped to engine plugins by activation rules"
      missing_default: "{} — the engine's own defaults for every plugin in the family"
