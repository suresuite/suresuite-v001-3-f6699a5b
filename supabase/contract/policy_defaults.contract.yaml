# AUTHORED — the data contract's sidecar for `policy_defaults`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: policy_defaults
tier: "4"
schema_name: public
grain: >-
  One row per project: the policy each family runs with unless a specific node
  overrides it. The bundle, in other words — and the thing a policy_override
  is a patch against.
owner: policy-ui

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [project_id]
    name: "policy_defaults_pkey"

governance:
  read: null
  write: "data_editing"
  min_project_role: editor
  # WP 2.3 created `audit_<table>_insert/update/delete`, three AFTER … FOR EACH
  # STATEMENT triggers calling `audit_tier_write`. This flag said `false` for
  # every one of the twelve tables it audited, and the generated page published
  # that as "Tier transitions audited: no" (D40). `contract:check` R9 now
  # compares this field against the live triggers, so it cannot drift again.
  audited: true
  rls_enabled: true
  note: >-
    `write` names the capability that exists today. WP 2.2 splits `data_editing`
    into `data_edit_inputs` (tier 2) and `data_edit_policies` (tier 4); this row
    becomes `data_edit_policies` then.

fields:
  project_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The project these defaults belong to. It is the PRIMARY KEY — one bundle per
      project, enforced.
    grain: identifier
    engine:
      consumed_by: "project_map.py::_map_policies -> the project's policy bundle"
      transform: "filter, never read as a value"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  sourcing:
    type: "jsonb"
    unit: null
    unit_source: none
    meaning: >-
      The sourcing family's parameters — how supply is split across suppliers, and
      what happens when one fails.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_map_policies -> P-S.x sourcing plugins"
      transform: "a JSON object of family parameters, mapped to engine plugins by activation rules"
      missing_default: "{} — the engine's own defaults for every plugin in the family"
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  inventory:
    type: "jsonb"
    unit: null
    unit_source: none
    meaning: >-
      The inventory family's parameters — reorder points, order-up-to levels,
      safety stock and holding cost.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_map_policies -> P-P.x / inventory_control plugins"
      transform: "a JSON object of family parameters, mapped to engine plugins by activation rules"
      missing_default: "{} — the engine's own defaults for every plugin in the family"
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  transport:
    type: "jsonb"
    unit: null
    unit_source: none
    meaning: >-
      The transport family's parameters. Stored and versioned; consumed by no
      engine mapping today (blueprint G1/G7).
    grain: metadata
    engine:
      consumed_by: "project_map.py::_map_policies -> no plugin — stored, not read"
      transform: "a JSON object of family parameters, mapped to engine plugins by activation rules"
      missing_default: "{} — the engine's own defaults for every plugin in the family"
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  fulfillment:
    type: "jsonb"
    unit: null
    unit_source: none
    meaning: >-
      The fulfillment family's parameters — how demand is allocated when it cannot
      all be met.
    grain: metadata
    engine:
      consumed_by: "project_map.py::_map_policies -> customer_allocation and related P-C.x plugins"
      transform: "a JSON object of family parameters, mapped to engine plugins by activation rules"
      missing_default: "{} — the engine's own defaults for every plugin in the family"
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  updated_by:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Who last changed the bundle.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      Governance, not a parameter. The data plane's only actor stamp on tier 4; WP
      2.3 turns it into an audit row.
  updated_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
