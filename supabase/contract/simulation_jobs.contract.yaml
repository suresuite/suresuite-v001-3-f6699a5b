# AUTHORED — the data contract's sidecar for `simulation_jobs`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md.
#
# WP 10.4 · `result-binding`. Described as a DORMANT table of the retired batch
# pipeline — see `note` — and with the shadowed definition RESOLVED rather than
# guessed, which is what kept it deferred for six packages (see the note's
# second half for the evidence).
table: simulation_jobs
tier: "5"
schema_name: public
grain: >-
  One queued run of the RETIRED batch pipeline: a project, the legacy disruption
  profiles it applied, a priority, a status and progress, and a pointer to the
  `simulation_results` row it produced. It was the queue between
  `simulation-runner` and `external-simulation-processor` / the Render-hosted
  `ml-service`. Tier 5 — run bookkeeping for a result, input to nothing.
  DORMANT IN THE REPOSITORY: no code in `src/`, `supabase/functions/`,
  `sim-worker/` or `scsim/` reads or writes it. The current product's run queue
  is `simulation_runs`, driven by `sim-command` and the Fly worker, and it never
  touches this table.
owner: engine

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "simulation_jobs_pkey"
  - source: "UNIQUE constraint 20250914113757_40b93edc-1f10-4dda-a32e-d35f851ebf20.sql"
    columns: [job_id]
    name: "simulation_jobs_job_id_key"

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    Two policies through the project's organization
    (`org_is_current_user_org(p.organization_id, p.organization)`): SELECT for any
    member of that organization, ALL for the project's modeler or an organization
    admin — recreated in that form by WP 2.1's `20260915000004`, which is why the
    duplicate-policy question of §4 D30 no longer leaves the end state in doubt.
    Neither policy is predicate-less, so `write: null` agrees with
    `governanceEnforcement.test.ts`, and no user-facing write path exists in the
    repository. Two BEFORE triggers still fire on any write
    (`simulation_jobs_defaults`, `simulation_job_timing_trigger`); the AFTER
    trigger that once posted every new job to `external-simulation-processor`
    was dropped on 2025-09-19, so the database no longer calls out on a write.
    Deleting a project removes its jobs through the inline
    `REFERENCES projects ON DELETE CASCADE`.
    NOT IN PRODUCTION'S CASE: §4 D168 found the legacy functions that wrote this
    queue (`simulation-runner`, `external-simulation-processor`,
    `simulation-status`, `delete-simulation-job`) still LIVE in production with no
    source here. "Dormant" is true of the repository; whether those endpoints are
    still called is D168's production question (WP 7.1).
    NOT AUDITED: tier 5, and `audit-actor` covers tiers 2–4.

note: >-
  A RETIRED PIPELINE'S QUEUE, LEFT IN PLACE ON PURPOSE by the 2026-07-02 commit
  that removed the legacy batch stack ("left in place, inert, for a later cleanup
  migration"). A drop needs a production row count first, which no §15 run has
  taken, and D168's live legacy functions are a reason to take one.
  THE SHADOWED DEFINITION IS RESOLVED, AND THE ARTIFACT ALREADY HAD THE ANSWER.
  `20250913085427` created this table with no `job_id`; `20250914113723`
  re-declared it with `job_id TEXT UNIQUE NOT NULL`, `plant_name`,
  `current_stage` and three CHECKs (`valid_status`, `valid_job_type`,
  `valid_priority`). The re-declaration never took effect, by three independent
  lines of evidence. (1) Its `CREATE TABLE IF NOT EXISTS` was a no-op against the
  existing table, and its later `CREATE INDEX … (job_id)` names a column that
  table did not have, so PostgreSQL raised 42703 and the whole file rolled back —
  §4 D97, which taught the introspector to record a rejected statement as an
  abort; `build/schema.introspected.json` lists `20250914113723` under
  `aborted_migrations` for that reason, so the columns above come from
  `20250913085427` alone. (2) Production agrees: §4 D30's trigger probe (§15 run
  `35064364537`) found all four of `20250913085427`'s triggers and NONE of
  `20250914113723`'s, so the later file never ran to its end there. (3) Its
  author knew: `20250914113757`, 34 seconds later, is titled "Fix existing
  simulation_jobs table structure" and ADDs `job_id TEXT` (nullable), backfills
  it with `id::text`, adds `simulation_jobs_job_id_key UNIQUE (job_id)` and
  ADDs `current_stage` — the shape recorded here. So: `job_id` is NULLABLE text
  with a unique constraint, `plant_name` was never a column, and the
  `job_type`/`priority` CHECKs do not exist (the legacy runner wrote
  `job_type` values 'baseline' and 'scenarios', which `valid_job_type` would have
  refused — consistent with it never landing). The one residual risk is a fresh
  database replayed from empty, where `20250914113723` has nothing to collide
  with and would run — D30's closing sentence, unchanged.

