# AUTHORED — the data contract's sidecar for `recovery_playbooks`.
table: recovery_playbooks
tier: '4'
schema_name: public
grain: >-
  One named recovery strategy a scenario can apply after a disruption — the levers, their order
  and their parameters. A system playbook (`is_system`, `project_id` NULL) ships with the
  product; a project playbook belongs to one project.
owner: engine

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [id]
    name: recovery_playbooks_pkey

governance:
  read: null
  write: data_edit_policies
  min_project_role: editor
  audited: true
  rls_enabled: true
  note: >-
    Tier 4 — the DECISION plane: what a person or an agent CHOSE, as against the dataset they
    chose it over and the result it produced. `result-binding` (I8) needs all three, which is
    why WP 6.3 keeps the results and this package takes the decisions. Audited from WP 6.4: the
    three statement-grain triggers land beside this sidecar, because `dataPlaneAudit.test.ts`
    scopes its rule to tables IN the contract and a deferred table's writes are unaudited with
    nothing to notice (D54). **Two of the six recovery strategies a scenario can name reach no
    engine plugin (§4 D114)**, so a playbook's `config` can record an intent the run will not
    act on. The row is stored faithfully either way; what is missing is a reader that says so,
    and the manual states it meanwhile.

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      Surrogate key. There is no natural key: two playbooks may share a name, in one project or
      across projects, and the product treats that as legitimate rather than as a collision.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  project_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The project this playbook belongs to, or NULL for a system playbook. Nullable on purpose —
      that NULL is what makes a row part of the shipped catalog, and it is read as such by
      `useRecoveryPlaybooks`'s `is_system.eq.true,project_id.eq.<id>` filter.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  name:
