# AUTHORED — the data contract's sidecar for `disruption_scenarios`.
table: disruption_scenarios
tier: '4'
schema_name: public
grain: >-
  One disruption applied to one node of one project: a capacity cut, a delay, or
  both. The ORIGINAL disruption shape, superseded in design by the
  `disruption_scenario_*` profile/target/effect/setting split but never migrated
  — both are live and neither reads the other.
owner: policy-ui

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [id]
    name: null

governance:
  read: project_member
  write: project_member
  min_project_role: editor
  audited: true
  rls_enabled: true
  note: >-
    Tier 4 — the DECISION plane. These rows are what a person chose, as against
    the dataset they chose it over and the result it produced, which is why
    `result-binding` (I8) needs all three. Audited from WP 6.4: the three
    statement-grain triggers land with this sidecar, because
    `dataPlaneAudit.test.ts` scopes its rule to tables IN the contract and a
    deferred table's writes are unaudited with nothing to notice (D54).

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      Surrogate key. The natural key is below; this is what the child rows
      reference.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  project_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The project this row belongs to.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  plant_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The plant this scenario belongs to, by display name. A project has one
      plant_name, so this is a denormalised copy of `projects.plant_name` rather
      than a second identity.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  node_id:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The node the disruption is applied to, by its display id — the same string
      the network pages use. Not a uuid and not a foreign key: a scenario may
      name a node that no longer exists in the graph, and deleting it silently
      would lose the decision.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  scenario_name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      What the person called this scenario. Not unique — see
      `natural_key_unique` below, which is the surrogate id and nothing else.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  capacity_reduction_percent:
    type: numeric
    unit: percent
    unit_source: fixed
    meaning: >-
      How much of the node's capacity the scenario removes. A PERCENT, not a
      fraction: the column name says so and the default of 0 means 'no
      reduction'.
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      Reaches no engine field. `project_map.py` builds the engine's world from
      the tier-2 tables and the policy bundle; a disruption is applied by the
      SIMULATOR at run time from `sim_payload`, not by the mapper from this
      column. So the value a person types here is read by the scenario runner
      and by nothing the data contract traces (§5 T1: the number has a source,
      and that source is this row).
  time_delay_days:
    type: numeric
    unit: days
    unit_source: fixed
    meaning: >-
      Additional delay the scenario imposes at this node. DAYS, and it is NOT
      normalised at promotion the way a tier-2 lead time is — this is a decision
      the user typed, not an observation, so it is stored as entered and
      converted where it is read.
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      Reaches no engine field, for the same reason as
      `capacity_reduction_percent`. Note the unit is in the COLUMN NAME rather
      than in a unit column — the opposite of the tier-2 convention
      `lead_time`/`lead_time_unit` that `normalize-at-promotion` (I3) governs.
      That is defensible for a decision (there is one unit and it cannot vary)
      and it is worth stating, because a reader who has learned the tier-2 rule
      will look for the companion column.
  description:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      Free text the person wrote. Never parsed.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  created_by:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The user who created the row, as a uuid. Client-asserted — this
      application authenticates against `approved_users` rather than Supabase
      Auth (D28) — so it names who the client said acted, which is why the audit
      row added by WP 6.4 is the record that matters.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  sim_payload:
    type: jsonb
    unit: null
    unit_source: none
    meaning: >-
      The scenario as the simulator receives it, frozen at save time. A
      denormalised copy of the columns above plus whatever the caller added;
      nothing reads it back into the columns, so a divergence between the two is
      possible and unnoticed.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  from_network:
    type: boolean
    unit: null
    unit_source: none
    meaning: >-
      Whether the scenario was created by clicking a node on a network page
      (true) or entered by hand. Defaults true, so a row written by any other
      path claims a provenance it may not have.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  organization:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The tenant's DISPLAY NAME, carried on every row of this vintage. `uuid-
      identity` (G1) says a displayable name is never a join key: nothing joins
      on this, and `organization_id` is the identity. Kept because the rows
      exist.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  created_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: >-
      When the row was created. Server-stamped, never the client's clock.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  updated_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: >-
      When it was last changed. Server-stamped by the `update_*_updated_at`
      trigger.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null

note: >-
  TWO DISRUPTION MODELS ARE LIVE AT ONCE AND NEITHER READS THE OTHER. This table
  is the 2025-08-26 shape — one row per node, capacity and delay inline. The
  `disruption_scenario_profiles`/`_targets`/`_effects`/`_settings` group is the
  2025-08-27 redesign that normalises the same idea. Nothing migrated the rows
  and nothing deprecates either, so a project can hold disruptions in both and a
  reader of one sees half the picture. Naming that is this sidecar's job; deciding
  it is not, and it belongs with WP 6.4's gap check.
