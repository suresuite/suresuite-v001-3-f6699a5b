# AUTHORED — the data contract's sidecar for `plan_role_allowances`.
# WP 10.7 · §4 D247 · blueprint G15. Edit this file; docs/data/tables/*.md is
# generated from it.
table: plan_role_allowances
tier: '4'
schema_name: public
grain: >-
  One project role's share of an organization's capacity pool: the percentage of
  the month's compute and of the series storage a member holding that role may
  use, and how many runs that member may have in flight. A row with no
  organization is the platform default; a row naming one overrides it for that
  organization alone.
owner: platform

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "plan_role_allowances_pkey"
  - source: "table constraint 20261001000012_capacity.sql"
    columns: [org_id, project_role]
    name: "plan_role_allowances_org_role_key"

natural_key_intended: [org_id, project_role]

governance:
  read: null
  write: super_admin
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    The plan, not tenant data: readable by everyone (`plan_role_allowances_read`,
    `USING (true)`, select only) and written by no API role except through
    `admin_set_role_allowance`, which opens with `_assert_super_admin`, names the
    admin to the audit trigger (`app.current_user_id`) and closes with
    `log_admin_action`. The four defaults (owner 100 %, editor 60 %, analyst 25 %,
    viewer 0 % of compute and storage; 3 and 1 runs in flight for editor and
    analyst) are seeded by the migration. Read by `_capacity_state`, which both
    the admission check inside `create_simulation_run` and the Lab's
    `get_my_capacity` call, so the Run card and the dispatcher read one answer.
    The actor the share is resolved for is the app's asserted user (D28).

surfaces:
  - page: "SimulationLab.tsx"
    via: "hook useMyCapacity → rpc get_my_capacity (the Run card's remaining line, WP 10.7)"
    grain: table
    evidence: "src/hooks/useMyCapacity.ts:25"
    confirmed: true

