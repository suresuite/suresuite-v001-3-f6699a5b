      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      NOT an engine input. It is analyzer output written onto a tier-3 entity row
      with no identity, no version and no input hash (D19). WP 4.2 moves it to
      `analysis_results`; WP 5.3 drops the column. Recorded here so the move has a
      starting inventory.
  critical_node_score:
