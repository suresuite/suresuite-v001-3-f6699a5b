    unit: null
    unit_source: none
    meaning: >-
      WP 4.3 · the `analysis_runs.input_hash` of the run that last wrote
      `is_critical_node` and `critical_node_score` on this row. It describes THOSE
      TWO COLUMNS ONLY — the rest of the row is `combine-project`'s ETL output,
      whose own run is recorded under `analysis_kind = 'combine_etl'`. NULL means
      the prediction predates WP 4.3 or was made through the deprecated
      two-argument `analysis_mark_critical_nodes`, which cannot name its run;
      NULL is the honest record and not a silent default (`declared-fallback`, I6).
