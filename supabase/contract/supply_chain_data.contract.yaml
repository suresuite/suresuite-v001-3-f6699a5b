      provenance, not staleness: staleness is `computed_from_hash <>
      current_graph_hash()`, WP 4.4's one rule, and a timestamp comparison is
      precisely what that rule replaces (§4 D12).
    grain: metadata
    computed_by: "analysis_mark_critical_nodes"
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
