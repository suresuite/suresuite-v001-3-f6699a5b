# AUTHORED — the data contract's sidecar for `supply_chain_data`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: supply_chain_data
tier: "3"
schema_name: public
grain: >-
  One edge of the project's PRODUCT-LEVEL supply graph — four echelons with the
  BILL OF MATERIALS COLLAPSED: supplier → purchased material → finished product →
  customer. A bom edge here runs from a material the plant BUYS to the product it
  ends up in, however many assemblies lie between them;
  `supply_chain_data_multi_tier` is the same network with the tree intact.
  Derived from the four lane tables by `rebuild_supply_chain_lanes` and always
  safe to drop and rebuild — which since WP 8.2 it IS, on every change to any of
  those four tables (§4 D142).
owner: etl

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "supply_chain_data_pkey"

surfaces:
  - page: "DataManager.tsx"
    via: "rpc combine_project_into_supply_chain"
    grain: table
    evidence: "src/pages/DataManager.tsx:656"
    confirmed: true
  - page: "FirmLevelNetwork.tsx"
    via: "rpc get_prediction_stats"
    grain: table
    evidence: "src/components/MLPrediction.tsx:54"
    confirmed: true
  - page: "ProcessLevelNetwork.tsx"
    via: "rpc get_prediction_stats"
    grain: table
    evidence: "src/components/MLPrediction.tsx:54"
    confirmed: true
  - page: "ProductLevelNetwork.tsx"
    via: "rpc project_freshness"
    grain: table
    evidence: "src/pages/ProductLevelNetwork.tsx:227"
    confirmed: true
  - page: "ProjectPolicies.tsx"
    via: "rpc assign_material_supplier"
    grain: table
    evidence: "src/components/policies/StagePolicyTable.tsx:255"
    confirmed: true
  - page: "SimulationLab.tsx"
    via: "rpc assign_material_supplier"
    grain: table
    evidence: "src/components/sim/PreRunValidationPanel.tsx:70"
    confirmed: true

governance:
  read: null
  write: null
  min_project_role: viewer
  # WP 2.3 created `audit_<table>_insert/update/delete`, three AFTER … FOR EACH
  # STATEMENT triggers calling `audit_tier_write`. This flag said `false` for
  # every one of the twelve tables it audited, and the generated page published
  # that as "Tier transitions audited: no" (D40). `contract:check` R9 now
  # compares this field against the live triggers, so it cannot drift again.
  audited: true
  rls_enabled: true
  note: >-
    Written by the `combine-project` edge function, never by a page. Invariant
    I2: pages never write tier 3. `write: null` is therefore a statement, not an
    omission — there is no user-facing write path and there must not be one.
    For precision, since WP 2.4 checked it: three PROJECT-SCOPED write policies do
    exist here, serving that ETL path. They are consistent with `write: null`,
    which names the capability gating a USER-facing write and not the existence of
    any policy — and unlike `dataset_versions` they carry a real predicate, so
    they do not admit an arbitrary holder of the table grant.

fields:
  id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Surrogate row identifier. Carries no meaning.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  from_location:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The upstream end of the edge — a supplier, a PURCHASED material, or a
      finished product, depending on which lane produced it. THIS SENTENCE IS
      WHY §4 D127 EXISTS: the column carries no role, so every consumer infers
      one at render time and eight of them disagree. The role is authored once
      now, on `node_list.echelon`, and read rather than inferred.
    grain: identifier
    engine:
      consumed_by: "network pages and the analyzers; not read by the engine mapping"
      transform: "copied from the lane row's id column"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  to_location:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The downstream end of the edge — a customer, a FINISHED PRODUCT, or a
      purchased material, by lane. On the bom lane it is always a finished
      product, never an intermediate assembly: this lane is the collapsed graph.
    grain: identifier
    engine:
      consumed_by: "network pages and the analyzers; not read by the engine mapping"
      transform: "the customer, the root product of the demand walk, or the material"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  plant_name:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The focal plant this edge belongs to, by NAME — the join key G1 forbids.
      Renamed from `plant` by 20250822025432, which is also when its incorrect
      UNIQUE constraint stopped meaning one-row-per-plant.
    grain: identifier
    engine:
      consumed_by: "network pages; per-plant filtering"
      transform: "copied from the lane row"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  weighted:
    type: "numeric(16,6)"
    unit: "units per week"
    unit_source: fixed
    meaning: >-
      The volume on this edge after unit normalization — always per WEEK, whatever
      period the uploaded row quoted. This is where D2's fix lands: before it, a
      supplier quoting 52 000 a year and one quoting 1 000 a week were summed as
      52 000 and 1 000.
    grain: rate
    engine:
      consumed_by: "the analyzers and the policy grid's volume basis; not the engine mapping"
      transform: "`rate_to_weekly(volume, time_unit)` in `rebuild_supply_chain_lanes`, over the one unit table"
      missing_default: "0"
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      numeric(16,6) since 20250816031317. Normalization SHRINKS every value quoted
      coarser than a day and multiplies day-quoted rows by 7, so overflow needs a
      pre-existing value above ~1.43e9 in a day-quoted project. Bounded by
      analysis, not measurement — the §15 baseline has never been run.
  material_consumption_rate:
    type: "numeric(16,6)"
    unit: "units of upstream per unit of downstream"
    unit_source: derived
    meaning: >-
      How much of the upstream item one unit of the downstream item consumes.
      On a bom edge that is the EFFECTIVE rate through the collapsed tree — the
      sum over every path of the product of the rates along it, which on a
      single-level BOM is exactly the uploaded `consumption_rate`. Before WP 8.2
      the multi-level path wrote a literal 0 here while the single-level path
      wrote the real number, so one column meant two things depending on the
      project's shape (§4 D136).
    grain: level
    engine:
      consumed_by: "the analyzers and the network pages; not the engine mapping"
      transform: "weighted / the product's weekly demand — the rates multiplied down every path"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  sourcing_ratio:
    type: "numeric(16,6)"
    unit: "fraction of the destination's inbound flow"
    unit_source: derived
    meaning: >-
      This edge's share of everything flowing into its destination. A share, so
      the D2 unit error did not cancel: it decides which supplier the platform
      calls primary.
    grain: level
    engine:
      consumed_by: "the policy grid's primary-source suggestion; the analyzers"
      transform: "volumeShare(weeklyVolume(row), weeklyVolumeTotalsBy(...)) in _shared/laneVolumes.ts"
      missing_default: "0"
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  created_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the edge was first computed. Server-set.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  updated_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
