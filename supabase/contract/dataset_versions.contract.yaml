# AUTHORED — the data contract's sidecar for `dataset_versions`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: dataset_versions
tier: "3"
schema_name: public
grain: >-
  One frozen snapshot of a project's tier-2 data, with the hash that
  identifies it. The trust anchor: a run that names a dataset_version can be
  reproduced, and one that does not cannot.
owner: platform

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "dataset_versions_pkey"

governance:
  read: null
  write: null
  min_project_role: viewer
  # WP 2.3 created `audit_<table>_insert/update/delete`, three AFTER … FOR EACH
  # STATEMENT triggers calling `audit_tier_write`. This flag said `false` for
  # every one of the twelve tables it audited, and the generated page published
  # that as "Tier transitions audited: no" (D40). `contract:check` R9 now
  # compares this field against the live triggers, so it cannot drift again.
  audited: true
  rls_enabled: true
  note: >-
    Written by the `_build_dataset_snapshot` database function, never by a page —
    that is the INTENT, and `write: null` records it.
    **The enforcement does not match, and WP 2.4 measured it.** The live policy
    `dataset_versions_insert_all` is `FOR INSERT ... WITH CHECK (true)`, and
    `20260610000002` grants `anon` SELECT and INSERT, so any holder of the public
    anon key may insert a snapshot row. The contract reads narrower than the
    database, which is the exact class §9 asks this package to find. It is pinned
    by `governanceEnforcement.test.ts` rather than silently fixed: the app runs AS
    anon with no auth session, so revoking is a Phase 3 migration with an auth
    model behind it, and the decision taken was to document. See PLAN.md D28.

fields:
  id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Surrogate identifier for the version. Referenced by runs.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  project_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The project this snapshot is of.
    grain: identifier
    engine:
      consumed_by: "sim-command -> run binding"
      transform: "filter, never read as a value"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  label:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      A human-chosen name for this version, so a user can say which one they mean.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      Display only. Not read by the engine and deliberately not part of the hash —
      renaming a version must not change its identity.
  snapshot:
    type: "jsonb"
    unit: null
    unit_source: none
    meaning: >-
      The frozen tier-2 rows themselves, as JSON. What the run actually ran
      against, not a pointer to rows that may since have changed.
    grain: metadata
    engine:
      consumed_by: "sim-command -> the dataset a run is pinned to"
      transform: "built by _build_dataset_snapshot from the project's tier-2 tables"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      `schema_version: 2` since WP 4.1 (`20260917000002`), and the shape changed
      with it: the tables now sit under two keys, `inputs` (what a SIMULATION
      reads) and `network` (what the multi-tier ANALYSES read), where v1 held
      them at the top level. A row written before that migration still holds the
      v1 shape and always will — nothing rewrites a frozen version — so any
      reader of this column handles both. `verifiableExports.ts` does.
      The rule for WHAT is in it changed too, and that is the point: v1 mirrored
      `datamap.py` by hand and missed three things as the engine moved on (D11,
      D67). v2 hashes every VALUE column of every tier-2 input table —
      everything but the surrogate `id`, `project_id`, the audit timestamps, the
      ingestion provenance and the cosmetic `name` — and
      `graphHashCoverage.test.ts` fails when a tier-2 value column is missing
      from it.
  graph_hash:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The fingerprint of the snapshot. Two runs with the same graph_hash saw the
      same world; two with different hashes did not.
    grain: metadata
    engine:
      consumed_by: "sim-command and the run-identity reuse check -> simulation_runs.graph_hash"
      transform: "hashed from the snapshot by _build_dataset_snapshot"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      D11 and D67 CLOSED by WP 4.1: the snapshot now covers `bom_multi_level`
      (which `datamap.py` PREFERS over the single-level table), `lead_time_unit`,
      `demand_min`/`demand_max` and `customers`, and every row ordering is the
      table's UNIQUE natural key rather than a hand-picked prefix, so the same
      data cannot hash two ways (D68). Equal hashes now prove equal inputs for
      every tier-2 table the contract describes; what they still do not cover is
      the four DERIVED network tables, which are WP 4.2's and deliberately out —
      a derived artifact inside the identity of its own inputs is the confusion
      I5 exists to prevent.
      COMPOSITE since WP 4.1: SHA-256 over
      `{schema_version, hash_inputs, hash_network}`, so it decomposes into the
      two columns beside it and `supabase/rehearsal/110` fails if it stops
      doing so. The name and the place in `simulation_runs` are unchanged on
      purpose (§11) — a rename is a migration across every reader.
  hash_inputs:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      SHA-256 over the `inputs` domain of the snapshot — the tier-2 tables a
      SIMULATION reads. When this moves, a run stamped with the old composite
      cannot be reproduced.
    grain: metadata
    engine:
      consumed_by: "current_hash_inputs() -> staleness display; not read by the engine"
      transform: "sha256 over snapshot->'inputs', computed inside snapshot_dataset"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      NULL on every version frozen before WP 4.1 and NOT BACKFILLABLE: a v1
      snapshot has no `inputs` key and the rows it was built from have moved on.
      A NULL here means "this version predates the split", never "this version
      has no inputs", and a reader that treats the two as the same is reporting
      an absence as a fact.
  hash_network:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      SHA-256 over the `network` domain — `tier2_suppliers`, `tier3_suppliers`
      and `multi_tier_supply_chain`. When this moves a multi-tier ANALYSIS is
      stale; no simulation changes.
    grain: metadata
    engine:
      consumed_by: "current_hash_network() -> staleness display; not read by the engine"
      transform: "sha256 over snapshot->'network', computed inside snapshot_dataset"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      All three source tables hold ZERO rows in production (§15), so this column
      is the digest of an empty domain on every project today and the half is
      UNEXERCISED outside `supabase/rehearsal/110`. A green test on it is not a
      working path. NULL before WP 4.1, and not backfillable, for the same
      reason as `hash_inputs`.
  author_user_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Who froze this version.
    grain: identifier
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      Governance, not a parameter — and the closest thing the data plane has to
      the actor-naming audit row I-G4 requires. WP 2.3 generalises it.
  author_email:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The author's email, denormalized so the version survives the user record.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
    note: >-
      Governance display. A displayable name stored beside the uuid — acceptable
      here precisely because `author_user_id` is the join key and this is not
      (G1).
  created_at:
    type: "timestamp with time zone"
    unit: null
    unit_source: none
    meaning: >-
      When the version was frozen. Server-set.
    grain: metadata
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
