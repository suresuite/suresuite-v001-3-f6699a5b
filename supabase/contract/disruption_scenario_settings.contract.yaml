note: >-
  `key` HAS NO DECLARED VOCABULARY, and that is the gap this sidecar can name
  but not close. `natural_key` (I4) is satisfied — `(profile_id, key)` is
  unique — but uniqueness over an open set means a typo creates a new setting
  rather than failing. The `analysis_kinds` block on `analysis_runs` is the
  pattern for declaring such a vocabulary in the contract; nothing has done it
  here because no code reads a fixed list of keys yet.
