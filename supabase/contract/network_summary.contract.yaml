# AUTHORED — the data contract's sidecar for `network_summary`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
#
# WP 4.3 · §11. Described for the first time here. It was deferred through WP 3.1,
# 3.2 and 4.2 because "what tier is it" had no answer while the table was one
# thing — see §4 D56, which decided that `network_nodes` and `node_list` are BOTH
# and that the answer is a SPLIT rather than a tier. Tier 3 is the honest label
# TODAY: what these tables are FOR is analysis output, the anchor already treats
# them as derived (`graphHashCoverage.test.ts`'s DERIVED_AND_OUT), and calling the
# uploaded half tier 2 before WP 5.3 drops the computed columns would fold an
# analysis's own output into the identity of its inputs.
table: network_summary
tier: "3"
schema_name: public
grain: >-
  One rolled-up description of one project's deep-tier graph: node and edge
  counts and a per-depth breakdown. Every value column is derived.
owner: analysis
natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "network_summary_pkey"
surfaces:
  - page: "DataManager.tsx"
    via: "rpc get_deep_tier_datasets"
    grain: table
    evidence: "src/components/ProjectDataViewer.tsx:110"
    confirmed: true
  - page: "ProductLevelNetwork.tsx"
    via: "rpc project_freshness"
    grain: table
    evidence: "src/pages/ProductLevelNetwork.tsx:237"
    confirmed: true
  - page: "SimulationLab.tsx"
    via: "rpc project_freshness"
    grain: table
    evidence: "src/components/trust/useProjectFreshness.ts:24"
    confirmed: true

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    Read follows project reachability. `bulk_insert_network_summary` exists and HAS NO
    CALLER AT ALL — §4 D56 records it, and §15 has never counted the table's rows.
    Described here rather than deferred a fourth time, because a table nothing writes
    still carries RLS policies that every governance rewrite has had to maintain.
    `audited: true` as of WP 4.3.

