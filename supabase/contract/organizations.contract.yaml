# AUTHORED — the data contract's sidecar for `organizations`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md.
table: organizations
tier: G
schema_name: public
grain: >-
  One tenant. Every project, every dataset and every simulation result in the
  product belongs to exactly one of these rows, and the boundary between two of
  them is the boundary the whole access layer is built to hold.
owner: platform

natural_key_unique:
  - source: column PRIMARY KEY
    columns: [id]
    name: organizations_pkey
  - source: column UNIQUE
    columns: [slug]
    name: organizations_slug_key
# `slug` is unique and `name` is NOT. That asymmetry is the whole of D13: the
# column the access layer compared against for a year is the one that may
# collide and may be edited, and the one that may not is the one nothing read.

surfaces:
  - page: "DeveloperApi.tsx"
    via: "rpc list_api_keys"
    grain: table
    evidence: "src/pages/DeveloperApi.tsx:261"
    confirmed: true

governance:
  read: null
  write: super_admin
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    `write: super_admin` is enforced, not aspirational: every mutation goes
    through `admin_create_organization` / `admin_update_organization` /
    `admin_set_org_status` / `admin_set_org_access_period` / `admin_set_org_limits` /
    `admin_set_org_capacity` (WP 10.7) / `admin_delete_organization`, each of which opens with `_assert_super_admin` and
    closes with `log_admin_action`. The last is §4 D208: a PERMANENT delete that
    takes the organization's projects and accounts with it, and is a different verb
    from suspension — since §4 D210 only the accounts that belong to NO other
    organization; an account that also belongs elsewhere loses this membership and
    keeps the rest. This is one of the few tables where
    `audited: true` is literally true today — WP 2.3 is what makes the claim
    general. Read is open to any member of the org via the self-bridge policy
    below, which WP 2.1 rewrote: it matched the caller's TEXT org against `name`
    or `slug`, so renaming an organization revoked its own members' read on the
    row that had just been renamed. It now bridges on `id` first.

fields:
  id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The organization's identity. This is the value that must travel — it is
      what `projects.organization_id`, `approved_users.organization_id` and the
      public /v1 API's `p_org_id` all mean. Not displayable, and that is the
      property that makes it safe as a join key (§2.1 `uuid-identity`).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  name:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      The organization's display name, as an administrator typed it. EDITABLE and
      NOT UNIQUE — two organizations may legitimately share one. It is a label
      for humans and it is never an identity.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: non-empty after btrim — admin_update_organization}
    surfaces: []
    resolution: null
    note: >-
      D13's join key. `admin_update_organization` updates this column and nothing
      else: no trigger, no cascade, and no second UPDATE reaching
      `approved_users.organization` or `projects.organization`. So a rename
      leaves those two text copies holding the OLD string, and the next user
      approved into the organization carries the NEW one — at which point a
      text comparison between them can never match again. WP 2.1 routes every
      such comparison through `org_is_current_user_org(uuid, text)`.
  slug:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      A URL-safe form of the name, `lower(regexp_replace(name, '[^a-zA-Z0-9]+', '-', 'g'))`
      at the moment the row was seeded. UNIQUE, and deliberately NOT recomputed on
      rename — so after a rename it is a record of what the organization used to
      be called, which is what makes it usable to match rows written before it.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: unique}
    surfaces: []
    resolution: null
  owner_user_id:
    type: uuid
    unit: null
    unit_source: none
    meaning: >-
      The approved user who owns the tenant. Advisory today — nothing in RLS or
      any RPC reads it; ownership is expressed through
      `organization_members.org_role = 'owner'`. Two places holding the same fact
      is an I1 violation waiting to diverge; WP 2.2 owns the resolution.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  status:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      Whether the tenant is live — `active` or `suspended`, CHECK-constrained to
      those two. Set through `admin_set_org_status`. Suspension is the
      REVERSIBLE verb; removing a tenant is `admin_delete_organization` (§4 D208),
      which deletes the row rather than setting a status.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: one of active / suspended}
    surfaces: []
    resolution: null
    note: >-
      SUSPENSION IS NOT ENFORCED IN THE DATA LAYER. No policy and no RPC consults
      this column before granting access — a suspended organization's members
      read and write exactly as before. It is a label the admin pages render.
      Recorded here rather than left to be discovered, per §5 T1; the enforcement
      belongs with WP 2.2's resolver, which is where a capability decision is
      made once instead of inevery policy.
  settings:
    type: jsonb
    unit: null
    unit_source: none
    meaning: >-
      Per-tenant configuration, free-form. No key of it is read by any migration,
      edge function or page today; it is a forward-declared extension point.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  created_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: When the organization was created. Server-stamped.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  updated_at:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: >-
      When the row was last modified. Server-stamped by DEFAULT only — no trigger
      maintains it, and `admin_update_organization` does not set it, so a renamed
      organization still shows its creation time here.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null

  access_period:
    type: text
    unit: null
    unit_source: none
    meaning: >-
      How long the organization may be used, counted from `access_valid_from`:
      `week`, `month`, `quarter` or `year`, CHECK-constrained to those four; NULL
      means it does not expire, which every organization that existed before D207
      keeps. Set by `admin_set_org_access_period` (choosing a period again renews it
      from now) or `admin_create_organization`. The lengths are written once, in
      `org_access_period_interval()`.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "one of week / month / quarter / year, or NULL"}
    surfaces: []
    resolution: null
  access_valid_from:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: >-
      When the current access period started — the database clock at the moment an
      administrator set it, never the browser's. NULL exactly when `access_period`
      is NULL (a CHECK).
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  access_valid_until:
    type: timestamp with time zone
    unit: null
    unit_source: none
    meaning: >-
      When the access period ends. DERIVED by `trg_organizations_access_valid_until`
      from the two columns above; a write that names it is overwritten. At or after
      this instant `authenticate_approved_user` refuses every member except a super
      admin, `get_my_profile` reports `access_expired`, and no project can be added
      to the organization (D207).
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  project_limit:
    type: integer
    unit: null
    unit_source: none
    meaning: >-
      The most projects the organization may hold, counted by
      `projects.organization_id` — 1, 2, 3, 5, 10, 20, 50 or 100 (D207; the last four
      added by §4 D218), CHECK-constrained; NULL is
      unlimited. Enforced on every writer by `trg_tenant_allowance` on `projects`.
      Lowering it deletes nothing; no project can be added until under it.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "one of 1 / 2 / 3 / 5 / 10 / 20 / 50 / 100, or NULL"}
    surfaces: []
    resolution: null
  user_limit:
    type: integer
    unit: null
    unit_source: none
    meaning: >-
      The most accounts the organization may have, counted as its
      `organization_members` rows — an account may belong to several organizations
      and takes a seat in each (§4 D210; between D207 and D210 it counted
      `approved_users.organization_id`) — 1, 2, 3, 5, 10, 20, 50 or 100 (D207; the
      last four added by §4 D218), CHECK-constrained; NULL is
      unlimited. Enforced on every writer by `trg_tenant_allowance` on
      `organization_members`, which every path that adds an account to an
      organization goes through; switching to an organization the account already
      belongs to takes no seat. Lowering it removes nobody; no account can be added
      until under it.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "one of 1 / 2 / 3 / 5 / 10 / 20 / 50 / 100, or NULL"}
    surfaces: []
    resolution: null
  storage_quota_bytes:
    type: bigint
    unit: null
    unit_source: none
    meaning: >-
      The simulation-result storage the organization's plan grants, in bytes: the
      `series_bytes` of its runs whose series are still kept (expired runs free
      theirs). NULL is unlimited. Enforced at dispatch by `create_simulation_run`
      (WP 10.7 · §4 D247), which refuses a run whose expected bytes overflow it
      with SQLSTATE P0402 and the numbers; a role's share of it is
      `plan_role_allowances.storage_share_pct`.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "> 0, or NULL"}
    surfaces: []
    resolution: null
  compute_quota_rep_weeks_month:
    type: bigint
    unit: null
    unit_source: none
    meaning: >-
      The simulation compute the plan grants per calendar month, in
      replication-weeks (replications × ceil(horizon days / 7)): counted from
      `run_usage`, each run at its settled actual if it finished, else at its
      reservation. NULL is unlimited. A run that would exceed it, or the member's
      `compute_share_pct` of it, is refused at dispatch (P0402).
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "> 0, or NULL"}
    surfaces: []
    resolution: null
  max_replications_per_run:
    type: integer
    unit: null
    unit_source: none
    meaning: >-
      The most replications one run may ask for, under the global clamp of 200.
      NULL is unlimited. /v1's key-scoped `max_replications` folds into it inside
      `create_simulation_run` — the stricter wins — and a run over it is refused
      with SQLSTATE P0403 (HTTP 403).
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "1 – 200, or NULL"}
    surfaces: []
    resolution: null
  max_concurrent_runs:
    type: integer
    unit: null
    unit_source: none
    meaning: >-
      The most runs the organization may have queued or running at once. NULL is
      unlimited, and then a role's `max_concurrent` does not bind either — the
      role's allowance is a share of this one. /v1's key-scoped cap folds in; a
      run over it is refused with SQLSTATE P0429 (HTTP 429).
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "> 0, or NULL"}
    surfaces: []
    resolution: null
  series_retention_days:
    type: integer
    unit: null
    unit_source: none
    meaning: >-
      How long a standard run keeps its weekly series after it completes, read by
      `run_series_retention` when the run completes. Every organization starts at
      90 (the column default — WP 10.6's period); NULL keeps series without limit.
      A change re-dates the organization's standard runs
      (`admin_set_org_capacity`); a pinned run or a Validated Model's evidence
      run has no expiry whatever the plan says.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: "> 0, or NULL"}
    surfaces: []
    resolution: null

note: >-
  Created by `20260709000002_super_admin_phase1.sql`, which seeded one row per
  DISTINCT `approved_users.organization` string. That seeding is why the uuid
  plane and the text plane started out agreeing, and why nothing has kept them
  agreeing since: the seed ran once, `set_project_defaults()` never stamped the
  uuid (D27), and `admin_update_organization` renames without propagating. WP 2.1
  fixed the trigger, backfilled what it could match unambiguously, and routed
  every live comparison through one predicate. It deliberately did NOT re-seed
  this table from distinct strings: after a rename, a user carrying the new name
  slugifies to a slug no row holds, and seeding would split one organization into
  two.
