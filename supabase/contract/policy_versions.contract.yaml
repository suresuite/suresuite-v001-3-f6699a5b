# AUTHORED — the data contract's sidecar for `policy_versions`.
table: policy_versions
tier: '4'
schema_name: public
grain: >-
  One saved snapshot of a project's whole policy bundle, with the bundle it replaced and the
  hash of both. The audit trail of the /policies grid: what the policies WERE at a moment
  somebody chose to record, which is what makes a simulation result reproducible from the policy
  side.
owner: policy-ui

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [id]
    name: policy_versions_pkey

governance:
  read: null
  write: data_edit_policies
  min_project_role: editor
  audited: true
  rls_enabled: true
  note: >-
    Tier 4 — the DECISION plane: what a person or an agent CHOSE, as against the dataset they
    chose it over and the result it produced. `result-binding` (I8) needs all three, which is
    why WP 6.3 keeps the results and this package takes the decisions. Audited from WP 6.4: the
    three statement-grain triggers land beside this sidecar, because `dataPlaneAudit.test.ts`
    scopes its rule to tables IN the contract and a deferred table's writes are unaudited with
    nothing to notice (D54). **This is the one decision table `result-binding` (I8) already
    reaches**: a run stores `policy_version_id` and the verifiable export reads the row back, so
    the policy half of a reproducibility record is bound where the dataset half has to be
    reconstructed. The row carries THREE author columns beside `created_by`, which is a
    denormalised copy of a person rather than a second identity (G1) — kept because a version
    outlives an account and a deleted user should not erase who made a decision.

fields:
