    unit: null
    unit_source: none
    meaning: >-
      Surrogate key. A run binds to this, so it is the id that makes a result reproducible from
      the policy side.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
