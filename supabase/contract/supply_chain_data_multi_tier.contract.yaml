# AUTHORED — the data contract's sidecar for `supply_chain_data_multi_tier`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: supply_chain_data_multi_tier
tier: "3"
schema_name: public
grain: >-
  One edge of the REAL BOM TREE, at the BOM's own depth — where
  `supply_chain_data` is the same network with the BOM COLLAPSED to
  purchased-material → finished-product. A bom edge appears once per root
  product, so `(from_location, to_location, path_root)` is its grain and not
  `(from_location, to_location)`. Read by the network pages, and NOT propagated
  into the simulation: the engine models a single focal plant with three echelons
  (blueprint §2.4).
  WP 8.2 REWROTE THIS LINE. It said "tier-2 and tier-3 suppliers behind the
  direct ones", which is `tier2_suppliers` / `tier3_suppliers` and a different
  node universe — and it is where `level`'s "tiers upstream" claim came from
  (§4 D140). Nothing has ever written a tier-2 supplier into this table.
owner: etl

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "supply_chain_data_multi_tier_pkey"

surfaces:
  - page: "DataManager.tsx"
    via: "rpc combine_project_into_supply_chain"
    grain: table
    evidence: "src/pages/DataManager.tsx:656"
    confirmed: true
  - page: "InteractiveNetworkSpace.tsx"
    via: "table read"
    grain: table
    evidence: "src/pages/InteractiveNetworkSpace.tsx:369"
    confirmed: true
  - page: "ProcessLevelNetwork.tsx"
    via: "table read"
    grain: table
    evidence: "src/pages/ProcessLevelNetwork.tsx:1258"
    confirmed: true
  - page: "ProjectPolicies.tsx"
    via: "rpc get_supply_chain_data_multi_tier"
    grain: table
    evidence: "src/hooks/useProjectContext.tsx:49"
    confirmed: true

governance:
  read: null
  write: null
  min_project_role: viewer
  # WP 2.3 created `audit_<table>_insert/update/delete`, three AFTER … FOR EACH
  # STATEMENT triggers calling `audit_tier_write`. This flag said `false` for
  # every one of the twelve tables it audited, and the generated page published
  # that as "Tier transitions audited: no" (D40). `contract:check` R9 now
  # compares this field against the live triggers, so it cannot drift again.
  audited: true
  rls_enabled: true
  note: >-
    Written by `rebuild_supply_chain_lanes` — the ONE ETL since WP 8.2 — and
    never by a page. It had TWO writers until then, this and the
    `combine-project` edge function, disagreeing about what `level` meant (§4
    D140); the edge function's lane build is deleted and it now calls the RPC.
    Invariant I2: pages never write tier 3. `write: null` is therefore a statement, not an
    omission — there is no user-facing write path and there must not be one.
    For precision, since WP 2.4 checked it: three PROJECT-SCOPED write policies do
    exist here, serving that ETL path. They are consistent with `write: null`,
    which names the capability gating a USER-facing write and not the existence of
    any policy — and unlike `dataset_versions` they carry a real predicate, so
    they do not admit an arbitrary holder of the table grant.

