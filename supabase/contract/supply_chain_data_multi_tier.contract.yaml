# AUTHORED — the data contract's sidecar for `supply_chain_data_multi_tier`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
table: supply_chain_data_multi_tier
tier: "3"
schema_name: public
grain: >-
  One edge of the DEEP supply graph — tier-2 and tier-3 suppliers behind the
  direct ones. Computed by the same ETL, read by the network pages, and NOT
  propagated into the simulation: the engine models a single focal plant with
  three echelons (blueprint §2.4).
owner: etl

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "supply_chain_data_multi_tier_pkey"

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    Written by the `combine-project` edge function, never by a page. Invariant
    I2: pages never write tier 3. `write: null` is therefore a statement, not an
    omission — there is no user-facing write path and there must not be one.
    For precision, since WP 2.4 checked it: three PROJECT-SCOPED write policies do
    exist here, serving that ETL path. They are consistent with `write: null`,
    which names the capability gating a USER-facing write and not the existence of
    any policy — and unlike `dataset_versions` they carry a real predicate, so
    they do not admit an arbitrary holder of the table grant.

