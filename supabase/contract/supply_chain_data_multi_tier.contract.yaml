  from_location:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The upstream end of the edge: the finished product on the outbound lane,
      the component on a bom edge, the supplier on an inbound one. It said "a
      tier-2 or tier-3 supplier" until WP 8.2 and no writer has ever put one here
      (see the table's `grain`).
    grain: identifier
    engine:
      consumed_by: "the network pages"
      transform: "the child of a BOM row, a product, or a supplier, by lane"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  to_location:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The downstream end of the edge: the customer on the outbound lane, the
      parent assembly on a bom edge, the material on an inbound one. Where a
      `bom_multi_level` row names NO parent, this is the FINISHED PRODUCT — never
      blank and never `ROOT` (§4 D129, D141).
    grain: identifier
    engine:
      consumed_by: "the network pages"
      transform: "the parent of a BOM row, resolved to the finished product when it names none"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  material_consumption_rate:
    type: "numeric"
    unit: "units of upstream per unit of downstream"
    unit_source: derived
    meaning: >-
      How much of the upstream item one unit of the downstream item consumes —
      this BOM row's own `consumption_rate`. On the outbound and inbound lanes it
      is the row's WEEKLY volume instead, which is the convention both writers
      have always had and is stated here rather than left to be inferred.
    grain: level
    engine:
      consumed_by: "the network pages"
      transform: "`bom_*.consumption_rate`, or `rate_to_weekly(volume, time_unit)` off the BOM lane"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  sourcing_ratio:
    type: "numeric"
    unit: "fraction of the destination's inbound flow"
    unit_source: derived
    meaning: >-
      This edge's share of everything flowing into its destination. Its
      denominator is the eighth raw-volume read D2 missed — a share computed over
      unnormalized volumes until WP 0.2 in the edge function and until WP 8.2 in
      the SQL writer that was actually deployed (§4 D148). 1.0 on a bom edge: a
      BOM row is the whole of what its parent takes from that component.
    grain: level
    engine:
      consumed_by: "the network pages"
      transform: "volume over the destination's total, both `rate_to_weekly`-normalized"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  weighted:
    type: "numeric"
    unit: "units per week"
    unit_source: fixed
    meaning: >-
      The weekly flow along this edge: on a bom edge, the parent's demand for
      this edge's `path_root` times this row's consumption rate — so the edge
      carries ITS OWN contribution and not the child's whole requirement, which
      double-counted a material used by two assemblies. Unconstrained `numeric`
      here, unlike supply_chain_data's numeric(16,6) — so the normalization
      carries no overflow risk.
    grain: rate
    engine:
      consumed_by: "the network pages"
      transform: "the demand walk in `rebuild_supply_chain_lanes`, over `rate_to_weekly` volumes"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  level:
    type: "integer"
    unit: "levels down the bill of materials"
    unit_source: fixed
    meaning: >-
      DEPRECATED since WP 8.2 — a deprecated ALIAS of `bom_depth`, written with
      the same value (NULLs included) for one release while the network pages
      move to the honest name. Read `bom_depth`. This column named FOUR different
      measurements across two live writers (§4 D140) — 0 on outbound, a literal 1
      on the single-level bom lane, a literal 2 on the multi-level one whatever
      the BOM's real depth, and `max_level + 1` on inbound — while this sidecar
      claimed a fifth ("tiers upstream of the plant; 2 is a supplier's supplier"),
      which is `supply_tier` and lives on `node_list`.
    grain: level
    engine:
      consumed_by: "the network pages' depth filter"
      transform: "copied from `bom_depth`"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces:
      - page: "ProcessLevelNetwork.tsx"
        via: "table read"
        grain: column
        evidence: "src/pages/ProcessLevelNetwork.tsx:1258"
        confirmed: true
    resolution: null
  bom_depth:
    type: "integer"
    unit: "levels down the bill of materials"
    unit_source: fixed
    meaning: >-
      How deep in the BILL OF MATERIALS this edge's UPSTREAM end sits — 0 a
      finished product, 1 a material directly under one, N the Nth level of
      `bom_multi_level`. A bom edge takes it from `bom_multi_level.level`, the
      table that OWNS the measurement; an inbound edge takes the depth of the
      material it feeds PLUS ONE, from `node_bom_depth`, which is the one rule
      `node_list.bom_depth` also reads. NULL means UNKNOWN — a supplier of a
      material that is in no BOM has no depth, and reporting 0 for it is §4 D134:
      the ladder calls 0 a PRODUCT, so an unknown arrives as a confident wrong
      answer and the page's own `unknown` case can never be reached.
    grain: level
    engine:
      consumed_by: "the network pages' depth filter and column position"
      transform: "`bom_multi_level.level` for a bom edge, `node_bom_depth(...) + 1` for a supplier"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
  path_root:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The node at the DOWNSTREAM end of the path this edge belongs to. On the
      outbound and bom lanes that is the FINISHED PRODUCT whose demand flows
      along the edge — a bom edge appears once per root product, so one BOM row
      feeding two products is two rows with two roots. On the inbound lane it is
      the material the supplier delivers. NULL on a bom edge that no finished
      product reaches: the structure is real and no demand flows through it, and
      that is a thing to say rather than a row to drop.
      CORRECTED IN WP 8.2. This field previously read "the direct (tier-1)
      supplier this deep chain hangs off", which NEITHER writer has ever written —
      the RPC wrote the product, the product, the parent component and the
      material on its four lanes, and the edge function wrote the root product.
      A sidecar describing a fifth thing is §5 T1 in the contract itself.
    grain: identifier
    engine:
      consumed_by: "the network pages, to group deep edges under the product they serve"
      transform: "the root of the demand walk, or the material on the inbound lane"
      missing_default: null
    substitutions: []
    ingest:
      csv_header: null
      required: false
      validate: null
    surfaces: []
    resolution: null
