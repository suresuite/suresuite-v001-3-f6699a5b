# AUTHORED — the data contract's sidecar for `graph_level_versions`.
# WP 11.1 · §4 D258. Edit this file; docs/data/tables/*.md is generated from it.
table: graph_level_versions
tier: "3"
schema_name: public
grain: >-
  One row per (project, level, content): the FIRST time a project's product,
  process, firm or simulation level had that hash. Numbered per project PER LEVEL,
  so "Product graph v3" and "Firm graph v5" are both sentences the system can say,
  and a change to one level moves that level's number and no other. A snapshot
  (`dataset_versions`) names its level versions — its tuple.
owner: platform

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "graph_level_versions_pkey"
  - source: "constraint 20261001000019_graph_level_versions.sql"
    columns: [project_id, level, level_hash]
    name: "graph_level_versions_content_key"
  - source: "constraint 20261001000019_graph_level_versions.sql"
    columns: [project_id, level, version_no]
    name: "graph_level_versions_number_key"

natural_key_intended: [project_id, level, level_hash]

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    No page and no API role writes it — `anon`, `authenticated` and `service_role`
    hold SELECT only. ONE writer: `_graph_level_register`, called by a row trigger
    on `dataset_versions` (insert, and the level-hash backfill `snapshot_dataset`
    takes on a row frozen before WP 10.1), so every capture point registers its
    levels and no second capture path exists. It runs inside the statement that froze
    the snapshot and names that statement's actor, or the snapshot's author when the
    statement named nobody. Immutable by trigger: the one change a row takes is the
    cascade that forgets its first snapshot when that snapshot is deleted. Read
    through `has_project_access`.

