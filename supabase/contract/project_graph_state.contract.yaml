# AUTHORED — the data contract's sidecar for `project_graph_state`.
# WP 10.1 · §4 D233. Edit this file; docs/data/tables/*.md is generated from it.
table: project_graph_state
tier: "3"
schema_name: public
grain: >-
  One row per project: every hash of the project's LIVE data — the composite
  `graph_hash`, its two domains and the three levels — stored, so a page that asks
  "has this project's graph changed?" reads a row instead of rebuilding a snapshot
  of thirteen tables. A CACHE of a pure function of tier 2, safe to drop: the next
  read rebuilds it.
owner: analysis

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [project_id]
    name: "project_graph_state_pkey"

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    No page and no API role writes it. Two writers, both SECURITY DEFINER and both
    inside somebody else's statement: the statement triggers on the thirteen hashed
    tables (`_graph_state_touch_*`) raise `dirty`, and `project_graph_hashes` stores
    a recomputed set — only when `generation` has not moved since it read the row,
    so a reader that started before a write cannot store the pre-write hash over the
    flag the write raised. Read through `has_project_access`. Audited at statement
    grain like every tier-3 table; its audit rows name whoever made the edit that
    dirtied it.

