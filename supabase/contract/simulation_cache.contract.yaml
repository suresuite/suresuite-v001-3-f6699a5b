# AUTHORED — the data contract's sidecar for `simulation_cache`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md.
#
# WP 10.4 · `result-binding`. A DORMANT table of the retired batch pipeline,
# described so the contract can see it (§4 D54) — see `note`.
table: simulation_cache
tier: "5"
schema_name: public
grain: >-
  One cached payload of the RETIRED batch pipeline, per project and cache key:
  baseline data, scenario data, network analysis or risk factors that the legacy
  `simulation-cache-manager` stored with a time-to-live so the next legacy run
  could skip recomputing it. Tier 5 — derived, disposable, input to nothing that
  still runs. DORMANT IN THE REPOSITORY: no code in `src/`,
  `supabase/functions/`, `sim-worker/` or `scsim/` reads or writes it. The
  current product's cache is a different mechanism entirely —
  `analysis_get_or_start` keyed on the graph hash, and the run reuse that
  `simulation_runs` performs.
owner: engine

natural_key_unique:
  # The constraint is UNNAMED in its migration (`UNIQUE(project_id, cache_key)`
  # inside the CREATE TABLE), so the introspector records `name: null`;
  # PostgreSQL will have given it its default name in production. Copied as
  # recorded rather than guessed.
  - source: "UNIQUE constraint 20250913085427_4fb4acfc-fb3c-4021-8851-ffe01adf9d76.sql"
    columns: [project_id, cache_key]
    name: null
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "simulation_cache_pkey"

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: false
  rls_enabled: true
  note: >-
    Two policies through the project's organization
    (`org_is_current_user_org(p.organization_id, p.organization)`): SELECT for any
    member of that organization, ALL for the project's modeler or an organization
    admin. Neither is predicate-less, so `write: null` agrees with
    `governanceEnforcement.test.ts`, and no user-facing write path exists in the
    repository. `cleanup_simulation_cache()` (SECURITY DEFINER, deletes expired
    rows) still exists and has no caller; nothing schedules it, so expired rows
    are not removed — `expires_at` is a statement of intent, not a guarantee.
    Deleting a project removes its rows through the inline
    `REFERENCES projects ON DELETE CASCADE`.
    NOT IN PRODUCTION'S CASE: §4 D168 found `simulation-cache-manager` and
    `simulation-availability-checker`, the legacy functions that wrote and read
    this table, still LIVE in production with no source here.
    NOT AUDITED: tier 5, and `audit-actor` covers tiers 2–4.

note: >-
  A RETIRED PIPELINE'S CACHE, LEFT IN PLACE ON PURPOSE by the 2026-07-02 commit
  that removed the legacy batch stack. A drop needs a production row count first,
  which no §15 run has taken. A cache whose writer is gone holds nothing anyone
  should trust: `data_hash` is a hash of the PAYLOAD, not of the inputs that
  produced it, so a hit could never say whether the project had changed since —
  which is the defect the graph-hash-keyed analysis store exists to avoid
  (`input-hash`, I5).

