# AUTHORED — the data contract's sidecar for `model_validations`.
# Described from WP 10.3 (it was deferred to WP 6.3, then re-homed by WP 10.0).
table: model_validations
tier: "4"
schema_name: public
grain: >-
  One VALIDATED MODEL: a decision about how a project's model may be used, bound to the
  exact policy content, graph version and scenario world it was established on and
  stating the run protocol every decision-grade run must follow — how many seeds, the
  week steady state begins, horizon, analysis window, CI level and stopping rule — with
  who validated it and when. Immutable: only its lifecycle (status, supersession,
  revocation) changes. Matched by CONTENT, never by id (WP 10.2).
owner: policy-ui

natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "model_validations_pkey"
  - source: "partial unique index 20261001000020_simulation_scope.sql (WHERE status = 'active')"
    columns: [project_id, policy_hash, "(COALESCE(hash_simulation, graph_hash))", scenario_hash]
    name: "model_validations_active_content_uq"
  - source: "constraint 20261004000002_version_codes.sql"
    columns: [project_id, model_code]
    name: "model_validations_model_code_key"

surfaces:
  - page: "SimulationLab.tsx"
    via: "table read"
    grain: table
    evidence: "src/hooks/useModelValidation.tsx:366"
    confirmed: true
  - page: "ProjectPolicies.tsx"
    via: "table read"
    grain: table
    evidence: "src/hooks/useModelValidation.tsx:366"
    confirmed: true

governance:
  read: null
  write: simulation_lab
  min_project_role: analyst
  audited: true
  rls_enabled: true
  note: >-
    Tier 4 — a DECISION. Readable by every API role (`model_validations_read_all`, D28's
    pinned list); written only through SECURITY DEFINER functions: `record_validated_model`
    (Save Validated Model — authenticates the actor through the shared preamble and
    enforces the adoption rule: every selected KPI passed, or a recorded face-validation
    statement), the legacy `record_model_validation` (its agent caller), and
    `revoke_model_validation`; all three reach one insert path. Audited at statement
    grain since WP 10.3. A BEFORE UPDATE trigger refuses every change but the lifecycle —
    and three fill-once completions: the engine id, the simulation hash (WP 11.2), and the
    planning period with its code, set by `set_model_planning_period` (same writer gate as
    saving the model) on a model saved without one (WP 10.5 follow-up).

