# AUTHORED — the data contract's sidecar for `node_list`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
#
# WP 4.3 · §11. Described for the first time here. It was deferred through WP 3.1,
# 3.2 and 4.2 because "what tier is it" had no answer while the table was one
# thing — see §4 D56, which decided that `network_nodes` and `node_list` are BOTH
# and that the answer is a SPLIT rather than a tier. Tier 3 is the honest label
# TODAY: what these tables are FOR is analysis output, the anchor already treats
# them as derived (`graphHashCoverage.test.ts`'s DERIVED_AND_OUT), and calling the
# uploaded half tier 2 before WP 5.3 drops the computed columns would fold an
# analysis's own output into the identity of its inputs.
table: node_list
tier: "3"
schema_name: public
grain: >-
  One node of one project's supply chain, derived from `supply_chain_data`
  by `refresh_node_list_for_project`. Like `network_nodes` it is two things
  (D56): the derivation and the geocoder write some columns, the criticality
  prediction others.
owner: analysis
natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "node_list_pkey"
  - source: "table constraint 20250829101944_b2ded57f-be29-4ae7-afff-38b3712e92e5.sql"
    columns: [project_id, node_id]
    name: "node_list_unique_per_project"

natural_key_intended: [project_id, node_id]
governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    Read follows project reachability. Written by `refresh_node_list_for_project`, which
    took only a project id until WP 4.3 gave it a two-argument overload that names the
    actor — `combine-project` had the actor all along and nothing told the trigger, the
    same shape as `assign_material_supplier` in WP 3.3. Also written by
    `geocode-locations` through PostgREST, which is D36's class and is NOT closed here.
    `audited: true` as of WP 4.3.

