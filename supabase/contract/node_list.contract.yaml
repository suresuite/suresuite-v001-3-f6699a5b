# AUTHORED — the data contract's sidecar for `node_list`.
# The schema half is introspected (build/schema.introspected.json); this half says
# what the columns MEAN. Edit this file; do not edit docs/data/tables/*.md, which
# WP 1.4 renders from the two together.
#
# WP 4.3 · §11. Described for the first time here. It was deferred through WP 3.1,
# 3.2 and 4.2 because "what tier is it" had no answer while the table was one
# thing — see §4 D56, which decided that `network_nodes` and `node_list` are BOTH
# and that the answer is a SPLIT rather than a tier. Tier 3 is the honest label
# TODAY: what these tables are FOR is analysis output, the anchor already treats
# them as derived (`graphHashCoverage.test.ts`'s DERIVED_AND_OUT), and calling the
# uploaded half tier 2 before WP 5.3 drops the computed columns would fold an
# analysis's own output into the identity of its inputs.
table: node_list
tier: "3"
schema_name: public
grain: >-
  One node of one project's supply chain, derived from BOTH edge tables —
  `supply_chain_data` AND `supply_chain_data_multi_tier` — by
  `refresh_node_list_for_project`. The multi-tier half is WP 8.1's widening:
  until then the derivation read the flat table only, so 104 deep-tier nodes
  had no row here and therefore no type any page could read (D132). Like
  `network_nodes` it is two things (D56): the derivation and the geocoder
  write some columns, the criticality prediction others. SCOPE LIMIT, stated
  because `supply_tier` makes it visible: this is the projection of the two
  EDGE tables, so a firm that appears only in `tier2_suppliers` /
  `tier3_suppliers` is not a node here and its tier is reachable only through
  `node_supply_tier`. Folding the deep-tier FIRM graph in is a different node
  universe (`network_nodes.uid` against material ids is D137) and is owned by
  no package yet.
owner: analysis
natural_key_unique:
  - source: "column PRIMARY KEY"
    columns: [id]
    name: "node_list_pkey"
  - source: "table constraint 20250829101944_b2ded57f-be29-4ae7-afff-38b3712e92e5.sql"
    columns: [project_id, node_id]
    name: "node_list_unique_per_project"

natural_key_intended: [project_id, node_id]
surfaces:
  - page: "DataManager.tsx"
    via: "rpc get_node_list"
    grain: table
    evidence: "src/pages/DataManager.tsx:425"
    confirmed: true
  - page: "FirmLevelNetwork.tsx"
    via: "rpc get_node_list"
    grain: table
    evidence: "src/components/MapView.tsx:355"
    confirmed: true
  - page: "ProductLevelNetwork.tsx"
    via: "rpc project_freshness"
    grain: table
    evidence: "src/pages/ProductLevelNetwork.tsx:227"
    confirmed: true
  - page: "SimulationLab.tsx"
    via: "rpc project_freshness"
    grain: table
    evidence: "src/components/trust/useProjectFreshness.ts:24"
    confirmed: true

