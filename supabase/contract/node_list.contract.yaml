  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    Read follows project reachability. Written by `refresh_node_list_for_project`, which
    took only a project id until WP 4.3 gave it a two-argument overload that names the
    actor — `combine-project` had the actor all along and nothing told the trigger, the
    same shape as `assign_material_supplier` in WP 3.3. Also written by
    `geocode-locations` through PostgREST, which is D36's class and is NOT closed here.
    `audited: true` as of WP 4.3.

