      two centrality ANALYZERS do read some of them — `meaning` says
      which.
  supply_tier:
    type: "integer"
    unit: null
    unit_source: none
    computed_by: "node_supply_tier"
    meaning: >-
      Tiers upstream of the focal plant: 0 the plant itself, 1 a direct
      supplier, 2 and 3 from `tier2_suppliers` / `tier3_suppliers`. NULL
      when unknown, which includes every material, product and customer —
      they are not upstream suppliers, and reporting 0 for them would be
      D134's substitution wearing a different column name. This is what
      `supply_chain_data_multi_tier.level`'s contract CLAIMED to be, and
      keeping it apart from `bom_depth` is the whole point: a BOM three
      levels deep does not mean three tiers of suppliers, and a tier-2
      supplier is not "a material at level 2". The rule is MIN across the
      sources, because "tiers upstream" means the shortest such path. See
      the table's `grain` for why 2 and 3 are rarely reachable today.
    grain: level
    engine:
      consumed_by: null
      transform: null
      missing_default: null
    substitutions: []
    ingest:
