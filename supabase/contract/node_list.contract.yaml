  bom_depth:
    type: "integer"
    unit: null
    unit_source: none
    computed_by: "node_bom_depth"
    meaning: >-
      Depth in the BOM tree, read from `bom_multi_level.level` — the table
      that OWNS the measurement — and NULL for a node that is in no BOM.
      This is what `supply_chain_data_multi_tier.level` actually holds on
      the bom lane, under a name that says so. The rule is MIN, not MAX: a
      material used by two assemblies at different depths has more than one
      true depth, and the shallowest is the one that says how close to a
      finished product it sits; a node that is only ever a PARENT at level 1
      is the finished product, depth 0. It is NOT read from the lane's own
      `level` column, because two live writers disagree about what that
      column means and one of them discards this very value for a literal 2
      (D140).
    grain: level
    engine:
      consumed_by: null
      transform: null
      missing_default: null
