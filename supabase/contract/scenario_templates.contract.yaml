# AUTHORED — the data contract's sidecar for `scenario_templates`.
table: scenario_templates
tier: '4'
schema_name: public
grain: >-
  One shipped starting point for a scenario: a named disruption shape with its schedule, its
  suggested playbook and the run settings that go with it. A template is not a scenario —
  applying one WRITES a scenario, and the two diverge from that moment.
owner: engine

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [id]
    name: scenario_templates_pkey
  - source: UNIQUE constraint
    columns: [slug]
    name: null

governance:
  read: null
  write: null
  min_project_role: editor
  audited: true
  rls_enabled: true
  note: >-
    Tier 4 — the DECISION plane: what a person or an agent CHOSE, as against the dataset they
    chose it over and the result it produced. `result-binding` (I8) needs all three, which is
    why WP 6.3 keeps the results and this package takes the decisions. Audited from WP 6.4: the
    three statement-grain triggers land beside this sidecar, because `dataPlaneAudit.test.ts`
    scopes its rule to tables IN the contract and a deferred table's writes are unaudited with
    nothing to notice (D54). **Every row is a system row (`is_system` defaults true) and there
    is no user-facing write path**, so `write` is null and the audit triggers guard a table only
    a migration changes — which is the point: a change to the shipped catalog is exactly the
    kind of change nobody notices. **Six of the seven presets name a disruption target the
    mapper cannot resolve (§4 D112)**, so a run from one of them completes with the disruption
    ABSENT rather than failing, and that is the open question this package carries.

