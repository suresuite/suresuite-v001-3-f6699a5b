# AUTHORED — which tables the data contract covers, and why the rest do not yet.
#
# Phase 1 / WP 1.4. `npm run contract:check` requires EVERY table in
# build/schema.introspected.json to be in exactly one of two places:
#
#   · it has a sidecar in supabase/contract/ — then the contract describes every
#     one of its columns, and a page is generated for it; or
#   · it is listed below, with the work package that will author it and why it
#     waits.
#
# A table in neither fails the gate. That is the whole point: a new table added
# to a migration cannot slip into the schema undocumented and unnoticed, which is
# how `approved_users` — the AUTHENTICATION table — came to exist in no migration
# at all for a year (PLAN.md §4, §16 WP 1.4).
#
# Deferring is a commitment, not an excuse. Every entry names a work package that
# already exists in PLAN.md; if a package is renumbered or dropped, this file
# moves with it in the same commit.
#
# AND EVERY DEFERRAL MUST SAY WHETHER THE TABLE IS AUDITED (D54, WP 4.2).
#
# `dataPlaneAudit.test.ts` requires the three `audit_tier_write` triggers on every
# tier-2/3/4 table IN THE CONTRACT. A table deferred here is outside the contract,
# therefore outside that rule, therefore its writes are unattributable WITH
# NOTHING TO NOTICE — and the decision about which tables those are was being made
# by this file, silently, by omission. WP 3.2 hit it from the other side: it
# described three tables and the audit gate went red in the same session, which is
# the gate working and is only possible for a table somebody had already chosen to
# describe.
#
# So each group carries an `audited:` map naming EVERY table in it, and
# `contract:check` R11 fails when a table is missing from it or when the
# declaration disagrees with the triggers the migrations actually create. The
# point is not the boolean. The point is that `false` now has to be TYPED by a
# person, next to the work package that owns fixing it.
#
# §15 measured the six this package owns at zero of six on 2026-09-17; R11 reports
# the number for all of them on every run.

deferred:
  - wp: "6.3"
    why: >-
      MOVED FROM WP 4.4 BY WP 4.4 ITSELF, and the reason is a correction rather
      than a deferral. This row said the table's subject is "whether a card has
      gone stale, which is the one staleness rule WP 4.4 lands" — and WP 4.4
      landed that rule without needing to DESCRIBE the table, because the rule is
      a function over a hash column and `model_validations` already carries four
      of them. What the table actually needs is the thing WP 6.3 builds: it binds
      a verdict to a dataset, a policy, a scenario and an engine fingerprint,
      which IS invariant `result-binding` (I8) and IS the A5 Reproducibility
      Record. Describing it in a staleness package would have put it in the
      contract under a package that had no reason to think about what its columns
      mean. §15 measured 0 active cards, so nothing is waiting on it.
      Original note follows.
      `model_validations` is a VALIDATION CARD, not analysis output — it already
      carries `graph_hash`, `policy_hash`, `scenario_hash` and `engine_fingerprint`
      and its whole subject is whether a card has gone stale, which is the one
      staleness rule WP 4.4 lands ("stale iff `computed_from_hash <>
      current_graph_hash()`") and the Trust Report that reads it. It was grouped
      with the network tables by WP 1.4 on the strength of the word "validation";
      WP 4.2 moved it when the D56 decision made the network group specific.
      §15 measured 0 active cards, so nothing is waiting on it.
    tables: [model_validations]
    audited:
      model_validations: false

  - wp: "6.1"
    why: >-
      `external_evidence` is the AGENT's evidence store — retrieved URLs, content
      hashes and confidence behind a proposal — and it belongs with the decision
      plane rather than with analysis output. Same regrouping as
      `model_validations` above: it was in the WP 4.2 bucket because nobody had
      looked at it, which is exactly what D54 says a deferral list does when it is
      allowed to decide by omission.
    tables: [external_evidence]
    audited:
      external_evidence: false

  - wp: "6.3"
    why: >-
      Runs and results (tier 5). Invariant `result-binding` is the claim these
      tables have to satisfy — every result binds dataset + policy + scenario +
      engine version.
      MOVED FROM WP 4.4 BY WP 4.4 ITSELF. This row read "WP 4.1/4.4 are where the
      binding is completed", and neither package was ever scoped to complete it:
      §11's WP 4.1 is the graph hash and §11's WP 4.4 is staleness plus the Trust
      Report. Ten tables were waiting on a sentence no work item behind them ever
      agreed to. WP 6.3 ships the A5 Reproducibility Record — "dataset, policy,
      scenario, engine and analysis versions plus declared limits" — which is
      `result-binding` stated as a deliverable, so the tables and the invariant
      now wait on the same package. See §16 · WP 4.4 · J.
      NOTE for whoever authors `simulation_jobs`: it carries an UNRESOLVED
      shadowed definition (`20250914113723` re-declares what `20250913085427`
      created, and the two disagree about `job_id`). The introspector records the
      disagreement rather than picking a winner. Resolve it BEFORE writing the
      sidecar — a field entry for a column whose type depends on which CREATE
      TABLE won is a guess with a schema around it.
    tables:
      - simulation_runs
      - simulation_results
      - run_replications
      - run_item_series
      - simulation_jobs
      - simulation_job_magnitudes
      - simulation_cache
      - simulation_performance_metrics
      - experiments
    audited:
      simulation_runs: false
      simulation_results: false
      run_replications: false
      run_item_series: false
      simulation_jobs: false
      simulation_job_magnitudes: false
      simulation_cache: false
      simulation_performance_metrics: false
      experiments: false

  - wp: "6.1"
    why: >-
      Decisions (tier 4) beyond the two policy tables the contract already
      covers. WP 6.1 pins the resolution chains and WP 6.2 fixes the divergences
      (D17, D18, D23, D24, D26); the scenario and disruption tables are the
      surface those chains resolve against.
    tables:
      - policy_versions
      - policy_presets
      - scenarios
      - scenario_templates
      - disruption_scenarios
      - disruption_scenario_profiles
      - disruption_scenario_targets
      - disruption_scenario_effects
      - disruption_scenario_settings
      - recovery_playbooks
    audited:
      policy_versions: false
      policy_presets: false
      scenarios: false
      scenario_templates: false
      disruption_scenarios: false
      disruption_scenario_profiles: false
      disruption_scenario_targets: false
      disruption_scenario_effects: false
      disruption_scenario_settings: false
      recovery_playbooks: false

  - wp: "5.2"
    why: >-
      Outside the data spine. These are the AI and public-API control planes:
      they carry no simulation input, no engine-read field and no user-uploaded
      value, so a data-contract sidecar would describe machinery rather than the
      user's data. PLAN.md §6.3 documents them in the manual's sections 14 and
      15 instead, and lists several of them explicitly as internal-only. If one
      ever starts carrying a value a simulation reads, it moves into the contract
      — that is the test, not the table's age.
    tables:
      - ai_budgets
      - ai_chat_events
      - ai_model_capabilities
      - ai_models
      - ai_providers
      - ai_usage_logs
      - api_idempotency
      - api_keys
      - api_rate_limits
      - api_request_logs
      - chat_folders
      - chat_messages
      - chat_plans
      - chat_threads
      - project_memory
      - proposals
      - user_files
    audited:
      ai_budgets: false
      ai_chat_events: false
      ai_model_capabilities: false
      ai_models: false
      ai_providers: false
      ai_usage_logs: false
      api_idempotency: false
      api_keys: false
      api_rate_limits: false
      api_request_logs: false
      chat_folders: false
      chat_messages: false
      chat_plans: false
      chat_threads: false
      project_memory: false
      proposals: false
      user_files: false
