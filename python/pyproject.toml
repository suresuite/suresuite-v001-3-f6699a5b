[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suresuite"
version = "0.1.0"
description = "SuReSuite for Python: pull the data your API key may read and run the simulation engine on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-SuReSuite-Proprietary"
dependencies = ["requests>=2.28", "pandas>=1.5", "pyarrow>=12"]

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7", "matplotlib>=3.6", "openpyxl>=3.1"]

[tool.setuptools]
packages = ["suresuite"]
