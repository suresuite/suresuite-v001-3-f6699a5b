name: adaptive UI audit

on:
  push:
    paths:
      - "src/**"
      # index.html IS a real input, not an inheritance from the deleted
      # mobile-verify.yml: audit-adaptive-ui.mjs:319 reads it directly for the
      # viewport rule — `env(safe-area-inset-*)` resolves to 0 on iOS when
      # index.html lacks `viewport-fit=cover`, and NO other rule reads that
      # file. Without this path an edit dropping the meta tag would change the
      # audit's answer with nothing running the audit.
      - "index.html"
      - "scripts/audit-adaptive-ui.mjs"
      - "scripts/adaptive-ui-baseline.json"
      - ".github/workflows/ui-audit.yml"
  workflow_dispatch:

# ONE RUN PER COMMIT — 2026-09-18. `pull_request:` removed; the unfiltered
# `push:` above is kept and is what reports on a pull request (checks attach to
# the SHA). Every commit on a PR branch used to run this gate TWICE, once per
# event, for one answer. Coverage is unchanged: same gate, same paths, same
# commits. Every pull request in this repository is same-repo (`claude/*`
# branches) — IF FORK PRs EVER BECOME EXPECTED, `pull_request:` MUST COME BACK,
# because a fork's push raises no event here.
#
# `concurrency` cancels a superseded run on the same ref: pushing three times in
# a minute now pays for the last commit, not all three.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The mechanical half of docs/mobile-ui-spec.md — emoji in product copy, bare
# `1fr` tracks, `shrink-0` on unbounded text, sub-44px touch targets, a second
# breakpoint, and the rest of §2/§3/§6.
#
# It lands on a codebase with a known backlog, so the gate is a RATCHET: it
# fails on anything above scripts/adaptive-ui-baseline.json and passes on the
# backlog itself. That makes it green on arrival and one-directional — the
# backlog can shrink and can never grow. Fix a file, re-run with
# --update-baseline to record the smaller number, and commit that.

# ── mobile-verify.yml IS GONE, AND THIS JOB IS WHAT IT RAN (2026-09-18) ──────
#
# `mobile-verify.yml` ("mobile handoff conformance") ran `audit-adaptive-ui.mjs`
# — this exact script, against this exact baseline. Its own header said so:
# "This makes the job a second run of ui-audit.yml's gate" and "a duplicated
# green gate is better than a permanently red one". It ran ~200 times in 30
# days and asserted nothing this job does not.
#
# It became a duplicate rather than being born one. It used to be the DESIGN
# half of the mobile handoff, running `handoff/verify-repo.mjs` over
# `handoff/PAGES.md`'s per-surface copy decks. That checker and its book were
# deleted with the whole `handoff/` directory in `e0bb85c`, so the job failed
# MODULE_NOT_FOUND on every PR touching `src/**` — the G7 breakage. Repointing
# it here was the resolution G7 records, and the duplicate was the stopgap.
#
# TO RESTORE THE COPY-DECK GATE — the coverage that actually went missing, and
# it went missing in `e0bb85c`, not here:
#
#     git show e0bb85c^:handoff/verify-repo.mjs   # the checker
#     git show e0bb85c^:handoff/PAGES.md          # the per-surface copy decks
#
# Restore both, then give them their own workflow. Do NOT re-create
# `mobile-verify.yml` pointed at `audit-adaptive-ui.mjs`: that is the
# duplicate, not the gate.
#
# Its path filter carried two paths this one lacked. `index.html` is now in the
# filter above and it is load-bearing (see the note there). `handoff/**` is
# deliberately NOT: the directory does not exist in the tree, and a filter on an
# absent path matches nothing — it would be a comment pretending to be a
# trigger. Add it back in the same commit that restores the directory.

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # measured ~20s; no install, one node script
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies: the audit is a single Node script over the source.
      - name: Adaptive-UI audit (fails on any violation above the baseline)
        run: node scripts/audit-adaptive-ui.mjs

      - name: Backlog, for the record
        if: always()
        run: node scripts/audit-adaptive-ui.mjs --all || true
