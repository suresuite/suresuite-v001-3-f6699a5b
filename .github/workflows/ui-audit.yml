name: adaptive UI audit

on:
  push:
    paths:
      - "src/**"
      - "scripts/audit-adaptive-ui.mjs"
      - "scripts/adaptive-ui-baseline.json"
      - ".github/workflows/ui-audit.yml"
  workflow_dispatch:

# ONE RUN PER COMMIT — 2026-09-18. `pull_request:` removed; the unfiltered
# `push:` above is kept and is what reports on a pull request (checks attach to
# the SHA). Every commit on a PR branch used to run this gate TWICE, once per
# event, for one answer. Coverage is unchanged: same gate, same paths, same
# commits. Every pull request in this repository is same-repo (`claude/*`
# branches) — IF FORK PRs EVER BECOME EXPECTED, `pull_request:` MUST COME BACK,
# because a fork's push raises no event here.
#
# `concurrency` cancels a superseded run on the same ref: pushing three times in
# a minute now pays for the last commit, not all three.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The mechanical half of docs/mobile-ui-spec.md — emoji in product copy, bare
# `1fr` tracks, `shrink-0` on unbounded text, sub-44px touch targets, a second
# breakpoint, and the rest of §2/§3/§6.
#
# It lands on a codebase with a known backlog, so the gate is a RATCHET: it
# fails on anything above scripts/adaptive-ui-baseline.json and passes on the
# backlog itself. That makes it green on arrival and one-directional — the
# backlog can shrink and can never grow. Fix a file, re-run with
# --update-baseline to record the smaller number, and commit that.

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # measured ~20s; no install, one node script
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies: the audit is a single Node script over the source.
      - name: Adaptive-UI audit (fails on any violation above the baseline)
        run: node scripts/audit-adaptive-ui.mjs

      - name: Backlog, for the record
        if: always()
        run: node scripts/audit-adaptive-ui.mjs --all || true
