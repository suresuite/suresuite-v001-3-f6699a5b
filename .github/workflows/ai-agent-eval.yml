# Deterministic eval tier for the AI-agent layer (ai-agents.md §7.4 tier 1).
# Gates every PR touching the agent path, the way golden traces gate engine
# changes (asset A13). No LLM calls: providers are fetch-mocked and the
# proposal/chat-store RPCs run on a scratch Postgres built from the real
# migration files (EVAL_REQUIRE_DB=1 turns a missing Postgres into a failure).

name: AI Agent Eval (deterministic tier)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/project-ai-chat/**'
      - 'supabase/functions/project-ai-health/**'
      - 'supabase/functions/agent-apply/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/**'
      - 'src/lib/chat/**'
      # The chat UI was outside this gate, so the visual-language port
      # (0c5d5ba) landed with no agent-eval run at all — it orphaned six
      # components, replaced the server-backed §17.3 suggestion chips with two
      # hardcoded strings, and downgraded the live PlanCard to a frozen
      # snapshot on the main surface.
      - 'src/components/intelligence/**'
      - 'src/components/chat/**'
      - 'src/hooks/useProjectChat.ts'
      - '.github/workflows/ai-agent-eval.yml'
  pull_request:
    paths:
      - 'supabase/functions/project-ai-chat/**'
      - 'supabase/functions/project-ai-health/**'
      - 'supabase/functions/agent-apply/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/**'
      - 'src/lib/chat/**'
      # The chat UI was outside this gate, so the visual-language port
      # (0c5d5ba) landed with no agent-eval run at all — it orphaned six
      # components, replaced the server-backed §17.3 suggestion chips with two
      # hardcoded strings, and downgraded the live PlanCard to a frozen
      # snapshot on the main surface.
      - 'src/components/intelligence/**'
      - 'src/components/chat/**'
      - 'src/hooks/useProjectChat.ts'
      - '.github/workflows/ai-agent-eval.yml'
  workflow_dispatch:

# NOT a push+pull_request double fire, deliberately left alone — `push` here is
# `branches: [main]`, so a PR-branch commit raises exactly one run
# (`pull_request`) and a merge raises exactly one (`push`). Removing
# `pull_request` would leave feature branches with NO agent-eval run at all.
#
# Cancellation added 2026-09-18: a superseded commit's run is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # measured ~40s incl. the throwaway Postgres cluster
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # PINNED, not `v2.x` (§4 D165). The float resolved to 2.9.7 on
          # 2026-09-22, which tightened inference on a PostgREST `.map()` and
          # turned `eval` red on every branch at once — a repo-wide CI break
          # that no commit caused and no gate could attribute. Bump this
          # deliberately, with the type errors it surfaces fixed in the same PR.
          deno-version: 2.9.7

      # ubuntu-latest ships Postgres server binaries (initdb/pg_ctl/psql);
      # the harness boots its own throwaway cluster — no service container.
      - name: Run deterministic eval tier
        working-directory: supabase/functions/project-ai-chat/eval
        env:
          EVAL_REQUIRE_DB: '1'
        run: deno test --allow-env --allow-read --allow-write --allow-run .
