name: Deploy Supabase Migrations

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # The remote DB was set up with different migration timestamps than the local files.
      # Step 1: mark those orphaned remote versions as reverted so the CLI stops complaining.
      # 20260704000001 was applied straight to the remote (no local file) and, until
      # repaired, made every `db push` abort — which silently left all later
      # migrations (incl. the simulation_runs/run_replications anon grants) unapplied.
      - name: Repair remote migration history
        run: |
          supabase migration repair --status reverted \
            20250815102121 20250815105909 20250815105931 20250815112141 20250815112919 \
            20250815113307 20250815113724 20250815115124 20250815115234 20250816031316 \
            20250816034626 20250816052310 20250816054205 20250816063310 20250816063523 \
            20250816065303 20250816070053 20250816070225 20250816120500 20250816121750 \
            20250816122505 20250820025733 20250820025836 20250820032954 20250820043747 \
            20250820043957 20250820044923 20250820045721 20250820050402 20250820051201 \
            20250820052631 20250820052813 20250820055052 20250820055709 20250820093407 \
            20250820100455 20250820110600 20250820113522 20250821021726 20250822011857 \
            20250822021941 20250822025431 20250822025503 20250822031713 20250822031815 \
            20250822032651 20250825015930 20250826012409 20250826012724 20250826015627 \
            20250826015710 20250826060748 20250826071237 20250826083442 20250826123353 \
            20250827051105 20250827054259 20250827064315 20250828010044 20250828012708 \
            20250828015334 20250828015347 20250828120822 20250828122251 20250828125113 \
            20250829101943 20250829104527 20250830111611 20250830112750 20250830113949 \
            20250831014415 20250831015157 20250831015459 20250901011314 20250901015225 \
            20250901021903 20250902051118 20250902052437 20250902084746 20250902084800 \
            20250902084843 20250902085643 20250902090122 20250902090655 20250903060129 \
            20250903074405 20250903080404 20250904105525 20250904112615 20250904113553 \
            20250904122314 20250904124535 20250904125033 20250905020015 20250905031341 \
            20250905032726 20250905032755 20250905032816 20250905040139 20250905040723 \
            20250906085804 20250906085824 20250906090601 20250906092021 20250906092125 \
            20250906093349 20250906103550 20250906103741 20250906113203 20250906121450 \
            20250906121605 20250906121714 20250906122416 20250907021245 20250908031645 \
            20250908033140 20250908071334 20250908071449 20250908071709 20250908071937 \
            20250908071950 20250908072020 20250908072919 20250908074611 20250908082644 \
            20250908084418 20250908085603 20250908090914 20250908092746 20250908093523 \
            20250908094237 20250908094955 20250908095011 20250908095027 20250908095047 \
            20250908095105 20250908095502 20250908100040 20250908100945 20250908101011 \
            20250908102148 20250908105502 20250908113139 20250908113724 20250908114701 \
            20250908121323 20250908121516 20250909023834 20250909030806 20250909031740 \
            20250909033439 20250909034413 20250909040609 20250909041205 20250909042747 \
            20250909043604 20250909054119 20250909055456 20250909060008 20250909073025 \
            20250909073137 20250909080608 20250909114822 20250909121109 20250909121128 \
            20250909125659 20250912064533 20250913085426 20250914113756 20250916095325 \
            20250916095413 20250916095505 20250916100017 20250916104521 20250916110838 \
            20250917094432 20250918111400 20250919023824 20250919092145 20250919092203 \
            20250919092719 20250919125030 20250921084858 20250923102619 20250923103122 \
            20250923105655 20250923120307 20250924125121 20250925030727 20250925034018 \
            20250925044453 20260527011426 20260610000003 20260704000001
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Step 2: mark local 2025/20260527/20260607 and the individual 20260609
      # migration files as already applied so db push skips them.
      # Only the consolidated 20260609040000 file will actually run.
      - name: Mark baseline migrations as applied
        run: |
          versions=$(ls supabase/migrations/ \
            | grep -E '^(2025|20260527|20260607|20260609)' \
            | grep -v '^20260609040000' \
            | sed 's/_.*//' | tr '\n' ' ')
          if [ -n "$versions" ]; then
            supabase migration repair --status applied $versions
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        run: supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
