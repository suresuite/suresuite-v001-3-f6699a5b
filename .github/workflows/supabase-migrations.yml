            20250909073137 20250909080608 20250909114822 20250909121109 20250909121128 \
            20250909125659 20250912064533 20250913085426 20250914113756 20250916095325 \
            20250916095413 20250916095505 20250916100017 20250916104521 20250916110838 \
            20250917094432 20250918111400 20250919023824 20250919092145 20250919092203 \
            20250919092719 20250919125030 20250921084858 20250923102619 20250923103122 \
            20250923105655 20250923120307 20250924125121 20250925030727 20250925034018 \
            20250925044453 20260527011426 20260610000003 20260704000001 \
            20260711000004
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Step 2: mark local 2025/20260527/20260607 and the individual 20260609
      # migration files as already applied so db push skips them.
      # Only the consolidated 20260609040000 file will actually run.
      - name: Mark baseline migrations as applied
        run: |
          versions=$(ls supabase/migrations/ \
            | grep -E '^(2025|20260527|20260607|20260609)' \
            | grep -v '^20260609040000' \
            | sed 's/_.*//' | tr '\n' ' ')
          if [ -n "$versions" ]; then
            supabase migration repair --status applied $versions
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        id: push
        run: |
          set -o pipefail
          supabase db push --include-all --password ${{ secrets.SUPABASE_DB_PASSWORD }} 2>&1 | tee /tmp/migrations.log
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Outcome readable over plain git (environments here may lack Actions
      # API access): the db push log lands on the migration-results branch.
      - name: Publish result log to migration-results branch
        if: always()
        run: |
          [ -f /tmp/migrations.log ] || echo "db push never produced a log" > /tmp/migrations.log
          {
            echo "run_id: ${{ github.run_id }}  outcome: ${{ steps.push.outcome }}"
            echo "trigger: ${{ github.event_name }}  ref: ${{ github.ref_name }}  sha: ${{ github.sha }}"
            echo "──────────────────────────────────────"
            cat /tmp/migrations.log
          } > /tmp/migrations-full.log
          git config user.name "supabase-migrations"
          git config user.email "actions@github.com"
          git checkout --orphan migration-results
          git rm -rfq . || true
          mkdir -p results
          cp /tmp/migrations-full.log results/latest.log
          git add results
          git commit -qm "migrations run ${{ github.run_id }}: ${{ steps.push.outcome }}"
          git push -f origin migration-results
