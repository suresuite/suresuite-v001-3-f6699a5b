name: Deploy Supabase Migrations

# SCOPED TO `main` — 2026-09-18. This is PLAN.md §4 D31's first half, closed.
#
# The `push` trigger carried NO branch filter, so every push to every feature
# branch that touched `supabase/migrations/**` DEPLOYED THAT BRANCH'S MIGRATIONS
# TO PRODUCTION. That is not a hypothetical: run 95 (2026-09-15) deployed from
# `claude/brave-einstein-xi1kh2`, and it is one of ~55 such runs in 30 days. The
# database therefore reached states no merge commit ever described, which is the
# shape of half the repairs in the "Repair remote migration history" step below.
#
# A branch's migrations are still EXECUTED before merge — `data-contract.yml`'s
# `migrations run` job applies them three ways against a throwaway PostgreSQL 16
# (fresh, over production's untracked shape, and against the artifact the branch
# writes). That is where a migration should first run. This workflow is the
# DEPLOY, and a deploy belongs to `main`.
#
# The filter also removes D31's coupling to `verification-sql.yml`: the standing
# rule "never push a migration in the same push as a §15 verify request" existed
# because both workflows fired on any branch push with no ordering between them.
# On a feature branch only one of them can fire now.
#
# NOTE FOR THE NEXT READER: this file's own path is a trigger path, so editing
# it used to deploy. With `branches: [main]` that is no longer true off `main` —
# GitHub reads the workflow file from the pushed commit, so the narrowed filter
# governs the very push that introduces it.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the db push log to the migration-results branch
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # The remote DB was set up with different migration timestamps than the local files.
      # Step 1: mark those orphaned remote versions as reverted so the CLI stops complaining.
      # 20260704000001 was applied straight to the remote (no local file) and, until
      # repaired, made every `db push` abort — which silently left all later
      # migrations (incl. the simulation_runs/run_replications anon grants) unapplied.
      # 20260711000004 repeats the pattern: policy_version_notes_delete was applied to
      # the remote under that version from its feature branch; the file now lives at
      # 20260711000005 (both versions are recorded remotely — only the file-less
      # 20260711000004 needs reverting). 20260712000001 (product_demand_bounds) and
      # 20260712000002 (admin_project_management) both have local files again after
      # the TRON-ver2 merge, so they are NOT in the revert list — recorded versions
      # with matching local files are simply skipped by db push.
      # All of these migrations are idempotent DDL, so reverting here is safe —
      # worst case they re-apply as no-ops when their branch merges.
      - name: Repair remote migration history
        run: |
          supabase migration repair --status reverted \
            20250815102121 20250815105909 20250815105931 20250815112141 20250815112919 \
            20250815113307 20250815113724 20250815115124 20250815115234 20250816031316 \
            20250816034626 20250816052310 20250816054205 20250816063310 20250816063523 \
            20250816065303 20250816070053 20250816070225 20250816120500 20250816121750 \
            20250816122505 20250820025733 20250820025836 20250820032954 20250820043747 \
            20250820043957 20250820044923 20250820045721 20250820050402 20250820051201 \
            20250820052631 20250820052813 20250820055052 20250820055709 20250820093407 \
            20250820100455 20250820110600 20250820113522 20250821021726 20250822011857 \
            20250822021941 20250822025431 20250822025503 20250822031713 20250822031815 \
            20250822032651 20250825015930 20250826012409 20250826012724 20250826015627 \
            20250826015710 20250826060748 20250826071237 20250826083442 20250826123353 \
