name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/project-ai-chat/**'
      - 'supabase/functions/project-ai-health/**'
      - 'supabase/functions/agent-apply/**'
      - 'supabase/functions/sim-command/**'
      - 'supabase/functions/api/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:
  # Callable from ops-request.yml (git-native trigger for environments that
  # can push but cannot reach the Actions API).
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Push provider API keys from GitHub Actions secrets into the Supabase
      # function environment. Each key is set only when present, so a partially
      # configured repo still deploys. GitHub masks the values in logs.
      - name: Set function secrets
        run: |
          # A secret pasted into GitHub with wrapping quotes would be pushed
          # verbatim and break the function at runtime (Invalid URL / bad
          # Authorization header). Strip one pair of matching quotes first;
          # the functions also tolerate quotes (_shared/env.ts), belt+braces.
          strip_quotes() {
            local v="$1"
            case "$v" in
              '"'*'"') v="${v#\"}"; v="${v%\"}" ;;
              "'"*"'") v="${v#\'}"; v="${v%\'}" ;;
            esac
            printf '%s' "$v"
          }
          for name in GEMINI_API_KEY OPENAI_API_KEY DEEPSEEK_API_KEY \
                      UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN \
                      FLY_API_TOKEN FLY_APP_NAME; do
            printf -v "$name" '%s' "$(strip_quotes "${!name}")"
          done
          args=()
          [ -n "$GEMINI_API_KEY" ]   && args+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          [ -n "$OPENAI_API_KEY" ]   && args+=("OPENAI_API_KEY=$OPENAI_API_KEY")
          [ -n "$DEEPSEEK_API_KEY" ] && args+=("DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY")
          # sim-command needs the Upstash REST pair to enqueue worker commands
          # (the Fly worker uses the NATIVE rediss:// URL — same database).
          [ -n "$UPSTASH_REDIS_REST_URL" ]   && args+=("UPSTASH_REDIS_REST_URL=$UPSTASH_REDIS_REST_URL")
          [ -n "$UPSTASH_REDIS_REST_TOKEN" ] && args+=("UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN")
          # Fly wake creds for scale-to-zero: sim-command starts a stopped worker
          # via the Fly Machines API when a run is enqueued (_shared/wakeWorker.ts).
          # Harmless when the worker is always-on (start on a started machine is a
          # no-op); the reused FLY_API_TOKEN secret + FLY_APP_NAME variable already
          # exist for the deploy-sim-worker workflow.
          [ -n "$FLY_API_TOKEN" ] && args+=("FLY_API_TOKEN=$FLY_API_TOKEN")
          [ -n "$FLY_APP_NAME" ]  && args+=("FLY_APP_NAME=$FLY_APP_NAME")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref wckdrutwkytwcomrlpib "${args[@]}"
          else
            echo "No function secrets found in GitHub secrets; skipping (function will report 'not configured')."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME || 'suresuite-sim-worker' }}

      # Deploy the AI chat edge function. verify_jwt is configured in
      # supabase/config.toml, which the deploy reads.
      - name: Deploy project-ai-chat
        run: supabase functions deploy project-ai-chat --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the provider-registry health probe (ai-agents.md §3.2 bridge 6).
      # It imports MODEL_REGISTRY from project-ai-chat, so it redeploys on the
      # same path triggers.
      - name: Deploy project-ai-health
        run: supabase functions deploy project-ai-health --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the proposal apply function (ai-agents.md §4.4 — the sole writer
      # of apply outcomes). It imports from project-ai-chat/ and _shared/, so
      # it redeploys on the same path triggers.
      - name: Deploy agent-apply
        run: supabase functions deploy agent-apply --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the simulation command gateway — the entry point every run
      # dispatch goes through. Without this deploy, the frontend gets
      # "Failed to send a request to the Edge Function" on Run.
      - name: Deploy sim-command
        run: supabase functions deploy sim-command --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the public /v1 API gateway (API Phase 0 / G15). verify_jwt is
      # off in config.toml — the gateway authenticates hashed API keys itself
      # and fails closed on auth/authz/quota.
      - name: Deploy api gateway
        run: supabase functions deploy api --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
