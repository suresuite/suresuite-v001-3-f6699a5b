name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/project-ai-chat/**'
      - 'supabase/functions/project-ai-health/**'
      - 'supabase/functions/agent-apply/**'
      - 'supabase/functions/report-render/**'
      - 'supabase/functions/sim-command/**'
      - 'supabase/functions/api/**'
      # The four analysis functions (D105). They were absent from this list AND
      # from the deploy steps below since the workflow was first committed, so
      # every change to them since — WP 4.1's actor RPCs, WP 4.3's dual-write —
      # landed in the repo and never in production. `_shared/**` covers the
      # store module they import, which is why run #47 fired for WP 4.3's
      # branch and still deployed none of them.
      - 'supabase/functions/calculate-network-science-metrics/**'
      - 'supabase/functions/calculate-node-prominence/**'
      - 'supabase/functions/predict-critical-nodes/**'
      - 'supabase/functions/combine-project/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:
  # Callable from ops-request.yml (git-native trigger for environments that
  # can push but cannot reach the Actions API).
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Caps a hung `supabase functions deploy`. Deliberately NO `concurrency`
    # cancellation: this workflow writes function secrets and then deploys, and
    # cancelling between the two leaves the deployment half-configured.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Push provider API keys from GitHub Actions secrets into the Supabase
      # function environment. Each key is set only when present, so a partially
      # configured repo still deploys. GitHub masks the values in logs.
      - name: Set function secrets
        run: |
          # A secret pasted into GitHub with wrapping quotes would be pushed
          # verbatim and break the function at runtime (Invalid URL / bad
          # Authorization header). Strip one pair of matching quotes first;
          # the functions also tolerate quotes (_shared/env.ts), belt+braces.
          strip_quotes() {
            local v="$1"
            case "$v" in
              '"'*'"') v="${v#\"}"; v="${v%\"}" ;;
              "'"*"'") v="${v#\'}"; v="${v%\'}" ;;
            esac
            printf '%s' "$v"
          }
          for name in GEMINI_API_KEY OPENAI_API_KEY DEEPSEEK_API_KEY \
                      UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN \
                      FLY_API_TOKEN FLY_APP_NAME; do
            printf -v "$name" '%s' "$(strip_quotes "${!name}")"
          done
          args=()
          [ -n "$GEMINI_API_KEY" ]   && args+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          [ -n "$OPENAI_API_KEY" ]   && args+=("OPENAI_API_KEY=$OPENAI_API_KEY")
          [ -n "$DEEPSEEK_API_KEY" ] && args+=("DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY")
          # sim-command needs the Upstash REST pair to enqueue worker commands
          # (the Fly worker uses the NATIVE rediss:// URL — same database).
          [ -n "$UPSTASH_REDIS_REST_URL" ]   && args+=("UPSTASH_REDIS_REST_URL=$UPSTASH_REDIS_REST_URL")
          [ -n "$UPSTASH_REDIS_REST_TOKEN" ] && args+=("UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN")
          # Fly wake creds for scale-to-zero: sim-command starts a stopped worker
          # via the Fly Machines API when a run is enqueued (_shared/wakeWorker.ts).
          # Harmless when the worker is always-on (start on a started machine is a
          # no-op); the reused FLY_API_TOKEN secret + FLY_APP_NAME variable already
          # exist for the deploy-sim-worker workflow.
          [ -n "$FLY_API_TOKEN" ] && args+=("FLY_API_TOKEN=$FLY_API_TOKEN")
          [ -n "$FLY_APP_NAME" ]  && args+=("FLY_APP_NAME=$FLY_APP_NAME")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref wckdrutwkytwcomrlpib "${args[@]}"
          else
            echo "No function secrets found in GitHub secrets; skipping (function will report 'not configured')."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME || 'suresuite-sim-worker' }}

      # AI-agent v1.2 GA server flags (ai-agents.md §9 flag conventions; GA
      # flip per §9.8, §14.7 M0-M2 and §16 — flipped only after the §7.4 live
      # model-scored eval passed; see .github/workflows/ai-agent-model-eval.yml
      # and the eval-results branch). Values are deliberately literal: these
      # are deployment flags, not secrets, and this step is their single
      # source of truth. To kill a stage, edit the value here and re-run this
      # workflow (workflow_dispatch or ops-request.yml); every flag off ⇒
      # clean regression to the previous stage per §9.
      #
      #   AGENT_TELEMETRY_ENABLED   §7.1 event writer (Stage 0)
      #   AGENT_ROUTER_ENABLED      §6 intent router (Stage 1+)
      #   AGENT_ENABLED_IDS         deployment-wide per-agent kill switch
      #                             (§9.2; explainer stays out — Stage 5 gate)
      #   AGENT_EXPERIMENT_TYPES    §9.5 spec vocabulary (single until Phase C)
      #   CHAT_STORE_ENABLED        §14.7 M0 server chat store
      #   CHAT_SUMMARY_ENABLED      §14.7 M1 rolling summaries
      #   PROJECT_MEMORY_ENABLED    §14.7 M2 project memory
      #   CHAT_MODES_ENABLED        §15 Ask/Review mode control
      #   SUGGESTED_ACTIONS_ENABLED §17.3 suggestion engine
      #   FILE_WORKSPACE_ENABLED    §16.2 file workspace + report-render
      #   COVERAGE_TOOLS_ENABLED    §19.3 grounded relation/detail read tools
      #   VERIFIER_ENABLED          §22.3 pre-send verifier + the §22.2 v2
      #                             system prompt (providers.ts selects v2 on
      #                             this flag — off ⇒ the v1 prompt, which
      #                             lacks the count-is-not-a-list rules)
      - name: Set AI-agent GA flags (ai-agents.md §9 GA flip)
        run: |
          supabase secrets set --project-ref wckdrutwkytwcomrlpib \
            AGENT_TELEMETRY_ENABLED=true \
            AGENT_ROUTER_ENABLED=true \
            AGENT_ENABLED_IDS=data-steward,policy-configurator,vv-analyst,experiment-designer,report-builder \
            AGENT_EXPERIMENT_TYPES=single \
            CHAT_STORE_ENABLED=true \
            CHAT_SUMMARY_ENABLED=true \
            PROJECT_MEMORY_ENABLED=true \
            CHAT_MODES_ENABLED=true \
            SUGGESTED_ACTIONS_ENABLED=true \
            FILE_WORKSPACE_ENABLED=true \
            COVERAGE_TOOLS_ENABLED=true \
            VERIFIER_ENABLED=true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the AI chat edge function. verify_jwt is configured in
      # supabase/config.toml, which the deploy reads.
      - name: Deploy project-ai-chat
        run: supabase functions deploy project-ai-chat --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the provider-registry health probe (ai-agents.md §3.2 bridge 6).
      # It imports MODEL_REGISTRY from project-ai-chat, so it redeploys on the
      # same path triggers.
      - name: Deploy project-ai-health
        run: supabase functions deploy project-ai-health --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the proposal apply function (ai-agents.md §4.4 — the sole writer
      # of apply outcomes). It imports from project-ai-chat/ and _shared/, so
      # it redeploys on the same path triggers.
      - name: Deploy agent-apply
        run: supabase functions deploy agent-apply --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the file-workspace function (ai-agents.md §16.1/§16.2 — the
      # ONLY client download path, plus the retention sweep and an internal
      # service-bearer render; v1.2 Phase 3). It imports from
      # project-ai-chat/ and _shared/, so it redeploys on the same path
      # triggers. NOTE: this step was missing from the Phase-3 landing
      # (PR #81) — the function existed in-repo but was never deployed;
      # added at the v1.2 GA flip.
      - name: Deploy report-render
        run: supabase functions deploy report-render --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the simulation command gateway — the entry point every run
      # dispatch goes through. Without this deploy, the frontend gets
      # "Failed to send a request to the Edge Function" on Run.
      - name: Deploy sim-command
        run: supabase functions deploy sim-command --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy the public /v1 API gateway (API Phase 0 / G15). verify_jwt is
      # off in config.toml — the gateway authenticates hashed API keys itself
      # and fails closed on auth/authz/quota.
      - name: Deploy api gateway
        run: supabase functions deploy api --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── The four analysis functions (D105) ────────────────────────────────
      #
      # NEVER DEPLOYED BY THIS WORKFLOW UNTIL NOW, and not once in its history —
      # `git log -S` over this file finds no commit that ever added a step for
      # any of them. Each one is `analysisStore.ts`'s caller: `getOrStart` opens
      # an `analysis_runs` row, `applyNodeMetrics` writes the metrics WITH the
      # run's `input_hash`, `completeRun` closes it. That is the whole of
      # WP 4.3's dual-write and the whole of what `input-hash` (I5) needs.
      #
      # §15 is what made it visible and it took three packages to read: the
      # store held 0 runs and 0 results while 9 016 of 9 016 derived rows
      # carried no input hash, and every report read that as "nobody has run an
      # analysis yet". A user ran one. The code that answered was the version
      # deployed before any of this existed — it computes the same centralities,
      # writes them straight onto `network_nodes`, opens no run and stamps no
      # hash. An undeployed function does not fail; it succeeds as its old self,
      # which is why nothing anywhere went red.
      #
      # `verify_jwt` for each is declared in `supabase/config.toml`, which the
      # deploy reads — `calculate-node-prominence` is `false` because a database
      # trigger reaches it through `pg_net` with no user JWT; the other three are
      # browser-invoked with the anon key and stay on.
      - name: Deploy calculate-network-science-metrics
        run: supabase functions deploy calculate-network-science-metrics --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy calculate-node-prominence
        run: supabase functions deploy calculate-node-prominence --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy predict-critical-nodes
        run: supabase functions deploy predict-critical-nodes --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy combine-project
        run: supabase functions deploy combine-project --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
