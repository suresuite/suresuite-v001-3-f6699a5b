name: Deploy Supabase Functions

on:
  push:
    paths:
      - 'supabase/functions/project-ai-chat/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy the AI chat edge function. verify_jwt is configured in
      # supabase/config.toml, which the deploy reads. Function secrets
      # (GEMINI/OPENAI/DEEPSEEK keys) are managed separately and untouched here.
      - name: Deploy project-ai-chat
        run: supabase functions deploy project-ai-chat --project-ref wckdrutwkytwcomrlpib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
