name: mobile handoff conformance

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "handoff/**"
      - "scripts/adaptive-ui-baseline.json"
      - ".github/workflows/mobile-verify.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "handoff/**"
      - "scripts/adaptive-ui-baseline.json"
      - ".github/workflows/mobile-verify.yml"
  workflow_dispatch:

# This job used to be the design half of the mobile handoff, running
# handoff/verify-repo.mjs over handoff/PAGES.md's per-surface copy decks. That
# checker and its book were deleted with the whole handoff/ directory in
# `e0bb85c`, so every run since has failed with MODULE_NOT_FOUND on any PR
# touching src/** — the same G7 breakage that `npm run verify:mobile` had.
#
# Repointed at the mechanical audit, which is the resolution G7 records and the
# one package.json's `verify:mobile` alias now takes. Called directly rather
# than through npm so the job keeps its no-install design.
#
# This makes the job a second run of ui-audit.yml's gate. Restoring the copy-deck
# gates means restoring the checker from `e0bb85c^` first; until someone decides
# to do that, a duplicated green gate is better than a permanently red one.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies: the checker is a single Node script over the source.
      - name: Adaptive-UI gate
        run: node scripts/audit-adaptive-ui.mjs

      - name: Full violation list, for the record
        if: always()
        run: node scripts/audit-adaptive-ui.mjs --all || true
