name: bundle size audit

on:
  push:
    paths:
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-bundle-size.mjs"
      - "scripts/bundle-size-baseline.json"
      - ".github/workflows/bundle-audit.yml"
  workflow_dispatch:

# ONE RUN PER COMMIT — 2026-09-18. `pull_request:` removed; the unfiltered
# `push:` above is kept and is what reports on a pull request (checks attach to
# the SHA). Every commit on a PR branch used to run this gate TWICE, once per
# event, for one answer. Coverage is unchanged: same gate, same paths, same
# commits. Every pull request in this repository is same-repo (`claude/*`
# branches) — IF FORK PRs EVER BECOME EXPECTED, `pull_request:` MUST COME BACK,
# because a fork's push raises no event here.
#
# `concurrency` cancels a superseded run on the same ref: pushing three times in
# a minute now pays for the last commit, not all three.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Guards the initial load graph — the entry chunk plus everything statically
# reachable from it, which is what a first visit downloads before paint.
#
# The failure this catches is invisible in review: one top-level `import` of a
# page, of MapView or of NetworkVisualization3D silently pulls a lazy chunk back
# into the entry. That is how the 1.65 MB single bundle happened the first time.
#
# Like the adaptive-UI audit, the gate is a RATCHET against
# scripts/bundle-size-baseline.json (plus a small tolerance so a dependency
# patch does not fail an unrelated PR). Improve the split, re-run with
# --update-baseline, commit the smaller number.

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # measured ~70s (npm ci + vite build + the audit)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # The audit measures dist/, so the build is the input, not a side errand.
      - run: npm run build

      - name: Bundle-size audit (fails on growth above the baseline)
        run: node scripts/audit-bundle-size.mjs
