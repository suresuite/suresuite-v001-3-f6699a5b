name: data contract

# WHAT THIS FIXES. Twelve workflows existed in this repository before this one and
# NONE of them ran `npm test`, `npm run check:docs`, or any `contract:*` command.
# `npm run lint` was not in CI either — and it is red at baseline (342 eslint
# errors), so the two gates hidden behind it (`audit:ui`, `check:docs`) were
# unreadable even to someone who ran it locally.
#
# The consequence is in PLAN.md §16: merge `5c7129f` took `check:docs` from green
# to thirteen orphan citations AND left `resolveCell` referencing an undefined
# binding — every policy-grid cell threw at runtime, five unit tests were red on
# the branch, and nothing failed. A gate that is not wired is not a gate.
#
# So each command below is invoked DIRECTLY, never through `npm run lint`. Steps
# are separate and named so a red run names the gate that failed in the Actions
# UI without anyone opening a log.
#
# NO PATH FILTER, deliberately. The introspected artifact records where in the
# application code each table is referenced, so an edit to a page that touches no
# migration can still make `contract:introspect -- --check` drift — it did, during
# WP 1.4: PR #190's header work shifted three `file:line` references and left the
# committed artifact stale. A filter on `supabase/migrations/**` would have let
# that through and then failed the NEXT migration PR for a reason it did not
# cause. `npm test` and `check:docs` have the same property.

# NO BRANCH FILTER ON `push` EITHER, and that is D35's first half. The filter
# used to be `branches: [main]`, so a feature branch was gated only by the
# `pull_request` event — and a pull request opened by an APP TOKEN raises no
# `pull_request` event at all. The result is a pull request with no run, and a
# check that never ran is indistinguishable in the UI from one that passed.
# Running on every push means the head commit carries a `data contract` result
# however the pull request came to exist. It costs a duplicate run per pull
# request; a gate that can be bypassed by the way a PR was opened costs more.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # R7 (§16 is append-only) compares every ancestor revision of
          # docs/PLAN.md against HEAD, and actions/checkout defaults to a SHALLOW
          # clone with no ancestors at all. Without this the rule SKIPS on every
          # CI run and says so — a gate that always skips is not a gate, which is
          # the same lesson as WP 2.3's RAISE NOTICE the db push log dropped.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── the six commands, each its own step ────────────────────────────────
      #
      # `contract:introspect -- --check` re-replays every migration and compares
      # the result to the committed artifact. It does NOT rewrite it: a generator
      # that regenerates in CI proves only that it ran.
      - name: Introspected schema matches the migrations
        run: npm run contract:introspect -- --check

      # The sidecars against contract.schema.json AND against the introspected
      # schema: an undescribed column, a described non-column, a type or natural
      # key that disagrees with the migrations, an untraced field with no note,
      # and a CSV template header no field records (D21).
      - name: Sidecars validate against the schema
        run: npm run contract:validate

      # WP 1.3's handoff asked for this one by name. It is the only thing stopping
      # the SQL unit table and grading.ts::UNIT_DAYS diverging again — `quarter`
      # was 13x wrong in SQL for a year (D10).
      - name: SQL unit table matches grading.ts::UNIT_DAYS
        run: npm run contract:units -- --check

      # D33. The capability catalog is seeded across nine migrations and mirrored
      # in TypeScript because the client needs the labels without a round trip.
      # Nothing checked the two agreed, and the fallback had lost two keys
      # (`reports`, `agent_report_builder`) — a silent denial for everyone
      # holding Decision Reports whenever the capability fetch failed.
      - name: Capability catalog matches the migrations
        run: npm run contract:capabilities -- --check

      # WP 1.1's exit checks, including the orphan check — the one WP 1.4 turned
      # from red to green by reconciling `approved_users`, `risk_data` and
      # `product_code_map`. Reverting any of the three turns it red again.
      - name: Schema exit checks (orphans, phantoms, D5)
        run: npm run contract:verify

      # PLAN.md §4 is the only authority for data-layer file:line evidence.
      - name: Data-layer facts have exactly one source
        run: npm run check:docs

      - name: Unit tests
        run: npm test

      # ── and the composite ─────────────────────────────────────────────────
      #
      # `contract:check` re-runs the four contract gates above and adds WP 1.4's
      # own rules: coverage (every table described or explicitly deferred), the
      # generated-page drift comparison, the natural-key warning, and the §4
      # citation resolver. It is duplicated work — about three seconds of node —
      # and it is deliberate: the six steps above exist so the Actions UI names
      # the exact gate that failed, and this one exists so a contributor has a
      # SINGLE command that reproduces the whole job locally. Neither purpose is
      # served by the other.
      - name: Data contract holds (coverage, page drift, §4 citations)
        run: npm run contract:check

  # ── D31 · a migration's first execution is no longer the production deploy ──
  #
  # `contract:introspect` replays migrations STATICALLY — it parses DDL, it never
  # runs SQL. So `min(o.id)` on a uuid (42883) passed every gate in this repo and
  # surfaced on the `db push` that deployed it; WP 2.1 needed four deploys to land
  # one file and only the fourth was about that file's own logic (§16 · WP 2.1
  # follow-up).
  #
  # This job EXECUTES the migrations a pull request adds, against a PostgreSQL 16
  # built from the BASE branch's own introspected artifact. It is deliberately not
  # a replay of history: 92 of 296 migrations fail on an empty database and always
  # will. It gates the new file, not the past.
  migrations-run:
    name: migrations run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The base branch by NAME, not by whatever the checkout happened to leave
      # behind: the rehearsal takes the schema from the merge-base's artifact, and
      # reading HEAD's instead would hand each migration a database that already
      # contains everything it is about to create — the one reading that cannot fail.
      - name: Fetch the base branch
        run: |
          BASE="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          echo "REHEARSE_SINCE=origin/$BASE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: New migrations apply to a real PostgreSQL 16
        run: npm run contract:rehearse
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  # ── D35 · nothing stopped a merge while `main`'s own gate was red ───────────
  #
  # Detection was never the gap: `data-contract.yml` went red at `3bf44aa`,
  # `53119da` and `55249d0` exactly as designed. THREE FURTHER MERGES WENT IN
  # ANYWAY, each inheriting the breakage rather than causing it, because a red
  # `main` blocks nothing.
  #
  # The conventional answer — a required status check — IS NOT AVAILABLE HERE.
  # This repository is private and owned by a personal account on a plan where
  # both the branch-protection and the ruleset APIs answer "Upgrade to GitHub Pro
  # or make this repository public" (403). Measured, not assumed. So enforcement
  # has to live in the repository, and this is it: every pull request carries a
  # check that is RED while the branch it would merge into is red. It does not
  # block the button — nothing in this plan can — but it removes the one excuse
  # the three merges had, which is that nobody could see it from the pull request.
  base-is-green:
    name: base branch is green
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The base branch's own data contract run must be green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/base-is-green.mjs
